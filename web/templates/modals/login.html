{{ define "modal_login" }}
<!-- ==================== МОДАЛЬНОЕ ОКНО 4: ВХОД (LOGIN) ==================== -->
    <div
        x-show="$store.app.activeModal === 'login'"
        x-cloak
        class="fixed inset-0 z-50 flex items-center justify-center modal-backdrop p-4"
        x-data="loginModalComponent()">
        <div
            @click.outside="$store.app.activeModal = null"
            class="bg-gray-900 border border-gray-700 rounded-2xl max-w-sm w-full p-6 shadow-2xl animate-fade-in space-y-4">
            <h3 class="text-base font-bold text-white text-center">Авторизация</h3>

            <form @submit.prevent="doLogin()" class="space-y-4">
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Логин</label>
                    <input
                        type="text"
                        x-model="loginUser"
                        required
                        class="w-full bg-gray-950 border border-gray-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500">
                </div>
                <div>
                    <label class="block text-xs text-gray-400 mb-1">Пароль</label>
                    <input
                        type="password"
                        x-model="password"
                        required
                        class="w-full bg-gray-950 border border-gray-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-emerald-500">
                </div>

                <template x-if="error">
                    <p class="text-xs text-red-400" x-text="error"></p>
                </template>

                <button
                    type="submit"
                    :disabled="isLoggingIn"
                    class="w-full py-2.5 bg-emerald-600 hover:bg-emerald-500 text-white font-bold text-xs rounded-lg transition shadow-lg shadow-emerald-600/30 flex items-center justify-center space-x-2">
                    <template x-if="isLoggingIn">
                        <svg class="w-3.5 h-3.5 animate-spin" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M8.125 21.213q-1.825-.788-3.187-2.15t-2.15-3.188T2 11.988t.788-3.875t2.15-3.175t3.187-2.15T12 2q.425 0 .713.288T13 3t-.288.713T12 4Q8.675 4 6.337 6.338T4 12t2.338 5.663T12 20t5.663-2.337T20 12q0-.425.288-.712T21 11t.713.288T22 12q0 2.05-.788 3.875t-2.15 3.188t-3.175 2.15t-3.875.787t-3.887-.787"/>
                        </svg>
                    </template>
                    <template x-if="!isLoggingIn">
                        <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M13 21q-.425 0-.712-.288T12 20t.288-.712T13 19h6V5h-6q-.425 0-.712-.288T12 4t.288-.712T13 3h6q.825 0 1.413.588T21 5v14q0 .825-.587 1.413T19 21zm-1.825-8H4q-.425 0-.712-.288T3 12t.288-.712T4 11h7.175L9.3 9.125q-.275-.275-.275-.675t.275-.7t.7-.313t.725.288L14.3 11.3q.3.3.3.7t-.3.7l-3.575 3.575q-.3.3-.712.288T9.3 16.25q-.275-.3-.262-.712t.287-.688z"/>
                        </svg>
                    </template>
                    <span x-text="isLoggingIn ? 'Проверка...' : 'Войти'"></span>
                </button>
            </form>
        </div>
    </div>
{{ end }}
