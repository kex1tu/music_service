{{ define "tag_editor_flat" }}
                    <!-- РЕЖИМ 2: СПЛОШНОЙ СПИСОК (FLAT VIEW) -->
                    <template x-if="viewMode === 'flat'">
                        <div class="border border-surface-border rounded-xl overflow-x-auto shadow-panel">
                            <table class="w-full text-left text-xs min-w-[820px]">
                                <thead class="bg-surface-base text-content-secondary uppercase tracking-wider border-b border-surface-border font-mono text-[11px]">
                                    <tr>
                                        <th class="py-2.5 px-2 w-8 text-center" title="Выбрать все треки">
                                            <input
                                                type="checkbox"
                                                :checked="isAllTracksSelected()"
                                                @click="toggleSelectAllTracks()"
                                                class="rounded bg-surface-input border-surface-border text-brand focus:ring-0 cursor-pointer">
                                        </th>
                                        <th class="py-2.5 px-2 w-8 text-center" title="Перетаскивание треков"></th>
                                        <th class="py-2.5 px-2 w-12 text-center" title="Обложка трека">Арт</th>
                                        <th class="py-2.5 px-2 w-14 text-center">Диск</th>
                                        <th class="py-2.5 px-2 w-14 text-center">#</th>
                                        <th class="py-2.5 px-3 min-w-[150px]">Название трека</th>
                                        <th class="py-2.5 px-3 min-w-[130px]">Исполнитель</th>
                                        <th class="py-2.5 px-3 min-w-[130px]">Альбом</th>
                                        <th class="py-2.5 px-3 w-20">Год</th>
                                        <th class="py-2.5 px-3 text-center w-24">Аудио</th>
                                        <th class="py-2.5 px-3 text-center w-24">Текст</th>
                                        <th class="py-2.5 px-1 w-8 text-center" title="Исключить трек">✕</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-surface-borderSubtle bg-surface-panel/40">
                                    <template x-for="(track, index) in tracks" :key="track.path || index">
                                        <tr
                                            class="hover:bg-surface-elevated/60 transition-colors"
                                            :class="{
                                                'bg-brand/10': isTrackSelected(index),
                                                'bg-brand-muted border-t-2 border-brand': dragOverIndex === index,
                                                'opacity-40': draggedIndex === index
                                            }"
                                            draggable="true"
                                            @dragstart="onDragStart($event, index)"
                                            @dragover="onDragOver($event, index)"
                                            @drop="onDrop($event, index)"
                                            @dragend="onDragEnd()">
                                            <td class="py-2 px-1 text-center select-none" @click.stop>
                                                <input
                                                    type="checkbox"
                                                    :checked="isTrackSelected(index)"
                                                    @click="toggleTrackSelection(index, $event)"
                                                    class="rounded bg-surface-input border-surface-border text-brand focus:ring-0 cursor-pointer">
                                            </td>
                                            <td class="py-2 px-1 text-center cursor-grab active:cursor-grabbing text-content-muted hover:text-content-primary select-none">
                                                <svg class="w-4 h-4 mx-auto" viewBox="0 0 24 24" fill="currentColor">
                                                    <path d="M9 19q-.825 0-1.412-.587T7 17t.588-1.412T9 15t1.413.588T11 17t-.587 1.413T9 19m6 0q-.825 0-1.412-.587T13 17t.588-1.412T15 15t1.413.588T17 17t-.587 1.413T15 19M9 13q-.825 0-1.412-.587T7 11t.588-1.412T9 9t1.413.588T11 11t-.587 1.413T9 13m6 0q-.825 0-1.412-.587T13 11t.588-1.412T15 9t1.413.588T17 11t-.587 1.413T15 13M9 7q-.825 0-1.412-.587T7 5t.588-1.412T9 3t1.413.588T11 5t-.587 1.413T9 7m6 0q-.825 0-1.412-.587T13 5t.588-1.412T15 3t1.413.588T17 5t-.587 1.413T15 7"/>
                                                </svg>
                                            </td>
                                            <!-- Обложка трека (40x40 thumbnail с переходом в галерею) -->
                                            <td class="py-2 px-1 text-center">
                                                <button
                                                    type="button"
                                                    @click="openTrackCoverGallery(track, index)"
                                                    class="w-10 h-10 rounded bg-surface-input border border-surface-border hover:border-brand overflow-hidden relative group/art transition flex items-center justify-center mx-auto shadow-sm"
                                                    title="Выбрать обложку для трека">
                                                    <template x-if="track.cover_preview_url || track.cover_url || track.cover_base64 || coverPreviewUrl">
                                                        <img :src="track.cover_preview_url || track.cover_url || track.cover_base64 || coverPreviewUrl" class="w-full h-full object-cover">
                                                    </template>
                                                    <template x-if="!(track.cover_preview_url || track.cover_url || track.cover_base64 || coverPreviewUrl)">
                                                        <svg class="w-4 h-4 text-content-muted" viewBox="0 0 24 24" fill="currentColor">
                                                            <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55c-2.21 0-4 1.79-4 4s1.79 4 4 4s4-1.79 4-4V7h4V3z"/>
                                                        </svg>
                                                    </template>
                                                    <span class="absolute inset-0 bg-black/60 opacity-0 group-hover/art:opacity-100 flex items-center justify-center text-[9px] text-brand font-bold transition">Арт</span>
                                                </button>
                                            </td>
                                            <td class="py-2 px-2 text-center">
                                                <input
                                                    type="number"
                                                    min="1"
                                                    x-model="track.disc_number"
                                                    class="w-10 bg-surface-input border border-surface-border rounded px-1 py-1 text-center text-content-primary focus:outline-none focus:border-brand font-mono">
                                            </td>
                                            <td class="py-2 px-2 text-center">
                                                <input
                                                    type="number"
                                                    min="1"
                                                    x-model="track.track_number"
                                                    class="w-12 bg-surface-input border border-surface-border rounded px-1.5 py-1 text-center text-content-primary focus:outline-none focus:border-brand font-mono">
                                            </td>
                                            <td class="py-2 px-3">
                                                <div class="flex items-center space-x-1.5">
                                                    <template x-if="track.version_status">
                                                        <span
                                                            class="inline-flex items-center space-x-1 px-1.5 py-0.5 rounded-full text-[9px] font-semibold border shrink-0 transition"
                                                            :class="window.DownloaderVersions ? window.DownloaderVersions.getVersionBadge(track.version_status).badgeClass : ''"
                                                            :title="window.DownloaderVersions ? window.DownloaderVersions.getVersionBadge(track.version_status).tooltip : ''">
                                                            <span class="w-1.5 h-1.5 rounded-full shrink-0" :class="window.DownloaderVersions ? window.DownloaderVersions.getVersionBadge(track.version_status).dotClass : ''"></span>
                                                            <span x-text="window.DownloaderVersions ? window.DownloaderVersions.getVersionBadge(track.version_status).label : ''"></span>
                                                        </span>
                                                    </template>
                                                    <input
                                                        type="text"
                                                        x-model="track.title"
                                                        placeholder="Название трека"
                                                        class="w-full bg-surface-input border border-surface-border rounded px-2 py-1 text-content-primary focus:outline-none focus:border-brand">
                                                    <button
                                                        type="button"
                                                        @click="cleanTrackTitle(track)"
                                                        title="Очистить название трека от мусора и извлечь фиты"
                                                        class="text-content-muted hover:text-brand p-1 transition flex-shrink-0">
                                                        <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor">
                                                            <path d="M19.36 2.72l1.42 1.42a1.996 1.996 0 0 1 0 2.83l-1.42 1.42l-4.24-4.24l1.41-1.43a2 2 0 0 1 2.83 0M3 21v-4.24l10.6-10.6l4.25 4.24L7.24 21zm3.5-2H7.5l7.66-7.66l-.96-.95l-7.7 7.7z"/>
                                                        </svg>
                                                    </button>
                                                    <button
                                                        type="button"
                                                        @click="openDeezerSearchForTrack(track, index)"
                                                        title="Найти трек в Deezer и применить соавторов/теги"
                                                        class="text-content-muted hover:text-purple-400 p-1 transition flex-shrink-0">
                                                        <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor">
                                                            <path d="M12 3a9 9 0 0 0-9 9a9 9 0 0 0 9 9a9 9 0 0 0 9-9a9 9 0 0 0-9-9m0 16a7 7 0 0 1-7-7a7 7 0 0 1 7-7a7 7 0 0 1 7 7a7 7 0 0 1 7 7a7 7 0 0 1-7 7m0-10a3 3 0 0 0-3 3a3 3 0 0 0 3 3a3 3 0 0 0 3-3a3 3 0 0 0-3-3m0 4a1 1 0 0 1-1-1a1 1 0 0 1 1-1a1 1 0 0 1 1 1a1 1 0 0 1-1 1"/>
                                                        </svg>
                                                    </button>
                                                </div>
                                            </td>
                                            <td class="py-2 px-3">
                                                <input
                                                    type="text"
                                                    x-model="track.artist"
                                                    placeholder="Исполнитель"
                                                    class="w-full bg-surface-input border border-surface-border rounded px-2 py-1 text-content-primary focus:outline-none focus:border-brand">
                                            </td>
                                            <td class="py-2 px-3">
                                                <input
                                                    type="text"
                                                    x-model="track.album"
                                                    placeholder="Альбом"
                                                    class="w-full bg-surface-input border border-surface-border rounded px-2 py-1 text-content-primary focus:outline-none focus:border-brand">
                                            </td>
                                            <td class="py-2 px-3">
                                                <input
                                                    type="number"
                                                    x-model="track.year"
                                                    placeholder="Год"
                                                    class="w-20 bg-surface-input border border-surface-border rounded px-2 py-1 text-center text-content-primary focus:outline-none focus:border-brand font-mono">
                                            </td>
                                            <td class="py-2 px-3 text-center">
                                                <button
                                                    type="button"
                                                    @click="recognizeTrack(track)"
                                                    :disabled="recognizingTrackPath === track.path"
                                                    class="px-2 py-1 rounded text-[11px] font-semibold bg-blue-500/10 hover:bg-blue-500/20 text-blue-400 border border-blue-500/30 transition flex items-center justify-center space-x-1 mx-auto disabled:opacity-50"
                                                    title="Распознать трек по звуку через Shazam">
                                                    <template x-if="recognizingTrackPath === track.path">
                                                        <svg class="w-3 h-3 animate-spin" viewBox="0 0 24 24" fill="currentColor">
                                                            <path d="M8.125 21.213q-1.825-.788-3.187-2.15t-2.15-3.188T2 11.988t.788-3.875t2.15-3.175t3.187-2.15T12 2q.425 0 .713.288T13 3t-.288.713T12 4Q8.675 4 6.337 6.338T4 12t2.338 5.663T12 20t5.663-2.337T20 12q0-.425.288-.712T21 11t.713.288T22 12q0 2.05-.788 3.875t-2.15 3.188t-3.175 2.15t-3.875.787t-3.887-.787"/>
                                                        </svg>
                                                    </template>
                                                    <template x-if="recognizingTrackPath !== track.path">
                                                        <svg class="w-3 h-3" viewBox="0 0 24 24" fill="currentColor">
                                                            <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55c-2.21 0-4 1.79-4 4s1.79 4 4 4s4-1.79 4-4V7h4V3z"/>
                                                        </svg>
                                                    </template>
                                                    <span>Shazam</span>
                                                </button>
                                            </td>
                                            <td class="py-2 px-3 text-center">
                                                <button
                                                    type="button"
                                                    @click="openLyrics(track, index)"
                                                    class="px-2.5 py-1 rounded text-[11px] font-semibold transition flex items-center justify-center space-x-1 mx-auto"
                                                    :class="{
                                                        'bg-brand-muted text-brand border border-brand/30 hover:bg-brand/20': track.lyrics_status === 'lrc',
                                                        'bg-blue-500/20 text-blue-400 border border-blue-500/30 hover:bg-blue-500/30': track.lyrics_status === 'txt',
                                                        'bg-surface-elevated text-content-muted hover:text-content-primary hover:bg-surface-hover': !track.lyrics_status || track.lyrics_status === 'none'
                                                    }">
                                                    <span x-text="track.lyrics_status === 'lrc' ? 'LRC' : (track.lyrics_status === 'txt' ? 'TXT' : '+ Текст')"></span>
                                                </button>
                                            </td>
                                            <td class="py-2 px-1 text-center">
                                                <button
                                                    type="button"
                                                    @click="removeTrack(index)"
                                                    class="text-content-muted hover:text-red-400 p-1 rounded transition"
                                                    title="Исключить трек из списка">
                                                    <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor">
                                                        <path d="m12 13.4l-4.9 4.9q-.275.275-.7.275t-.7-.275t-.275-.7t.275-.7l4.9-4.9l-4.9-4.9q-.275-.275-.275-.7t.275-.7t.7-.275t.7.275l4.9 4.9l4.9-4.9q.275-.275.7-.275t.7.275t.275.7t-.275.7L13.4 12l4.9 4.9q.275.275.275.7t-.275.7t-.7.275t-.7-.275z"/>
                                                    </svg>
                                                </button>
                                            </td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </div>
                    </template>
{{ end }}
