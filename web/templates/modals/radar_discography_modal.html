{{ define "radar_discography_modal" }}
<div
    x-show="$store.radar.isDiscographyModalOpen"
    x-cloak
    role="dialog"
    aria-modal="true"
    aria-labelledby="radar-discography-title"
    class="fixed inset-0 z-50 overflow-y-auto"
    @keydown.escape.window="$store.radar.isDiscographyModalOpen = false">
    
    <!-- Затемнение фона -->
    <div
        x-show="$store.radar.isDiscographyModalOpen"
        x-transition:enter="ease-out duration-300"
        x-transition:enter-start="opacity-0"
        x-transition:enter-end="opacity-100"
        x-transition:leave="ease-in duration-200"
        x-transition:leave-start="opacity-100"
        x-transition:leave-end="opacity-0"
        class="fixed inset-0 bg-black/80 backdrop-blur-sm"
        @click="$store.radar.isDiscographyModalOpen = false"></div>

    <!-- Модальное окно -->
    <div class="flex min-h-full items-center justify-center p-4">
        <div
            x-show="$store.radar.isDiscographyModalOpen"
            x-transition:enter="ease-out duration-300"
            x-transition:enter-start="opacity-0 scale-95"
            x-transition:enter-end="opacity-100 scale-100"
            x-transition:leave="ease-in duration-200"
            x-transition:leave-start="opacity-100 scale-100"
            x-transition:leave-end="opacity-0 scale-95"
            class="relative w-full max-w-4xl bg-surface-panel border border-surface-border rounded-2xl shadow-panel overflow-hidden p-6 space-y-6">
            
            <!-- Заголовок -->
            <div class="flex items-start justify-between">
                <div>
                    <h3 id="radar-discography-title" class="text-xl font-bold text-white flex items-center space-x-2">
                        <span x-text="$store.radar.selectedArtist"></span>
                        <span class="text-xs font-normal text-content-muted font-mono">— Дискография и сверка</span>
                    </h3>
                    <p class="text-xs text-content-muted mt-1">Кросс-каталожный анализ дискографии (Deezer + MusicBrainz + локальная медиатека)</p>
                </div>
                <button
                    @click="$store.radar.isDiscographyModalOpen = false"
                    aria-label="Закрыть окно дискографии"
                    class="p-2 rounded-lg text-content-muted hover:text-white hover:bg-surface-elevated transition">
                    <svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                        <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
                    </svg>
                </button>
            </div>

            <!-- Блок кастомных связей артиста -->
            <div class="bg-surface-input/60 border border-surface-border rounded-xl p-4 space-y-3 text-xs">
                <div class="font-bold text-white flex items-center justify-between">
                    <span>Связи каталогов & поисковый псевдоним (Alias)</span>
                    <button
                        @click="$store.radar.saveCustomLinks()"
                        class="px-3 py-1 bg-brand hover:bg-brand-hover text-white rounded-lg transition font-semibold">
                        Сохранить связи
                    </button>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-4 gap-3">
                    <div>
                        <label for="radar-custom-alias" class="block text-xs text-content-muted uppercase mb-1">Поисковый алиас</label>
                        <input
                            id="radar-custom-alias"
                            type="text"
                            x-model="$store.radar.customAlias"
                            placeholder="Псевдоним (напр. 'RH')"
                            class="w-full bg-surface-elevated border border-surface-border rounded-lg px-2.5 py-1.5 text-white">
                    </div>
                    <div>
                        <label for="radar-deezer-id" class="block text-xs text-content-muted uppercase mb-1">Deezer Artist ID</label>
                        <input
                            id="radar-deezer-id"
                            type="text"
                            x-model="$store.radar.customDeezerId"
                            placeholder="ID (напр. 42)"
                            class="w-full bg-surface-elevated border border-surface-border rounded-lg px-2.5 py-1.5 text-white">
                    </div>
                    <div>
                        <label for="radar-mb-id" class="block text-xs text-content-muted uppercase mb-1">MusicBrainz Artist MBID</label>
                        <input
                            id="radar-mb-id"
                            type="text"
                            x-model="$store.radar.customMbId"
                            placeholder="UUID артиста"
                            class="w-full bg-surface-elevated border border-surface-border rounded-lg px-2.5 py-1.5 text-white">
                    </div>
                    <div>
                        <label for="radar-yandex-id" class="block text-xs text-content-muted uppercase mb-1">Яндекс Музыка ID</label>
                        <input
                            id="radar-yandex-id"
                            type="text"
                            x-model="$store.radar.customYandexId"
                            placeholder="ID артиста"
                            class="w-full bg-surface-elevated border border-surface-border rounded-lg px-2.5 py-1.5 text-white">
                    </div>
                </div>
            </div>

            <!-- Список релизов -->
            <div class="max-h-96 overflow-y-auto space-y-2 pr-1">
                <template x-if="$store.radar.isDiscographyLoading">
                    <div class="py-12 text-center text-content-muted flex items-center justify-center space-x-2">
                        <svg class="w-5 h-5 animate-spin text-brand" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
                        </svg>
                        <span>Загрузка дискографии...</span>
                    </div>
                </template>

                <template x-if="!$store.radar.isDiscographyLoading && $store.radar.discographyReleases.length === 0">
                    <div class="py-8 text-center text-content-muted text-xs">
                        Релизы не найдены. Попробуйте нажать кнопку проверки дискографии.
                    </div>
                </template>

                <template x-for="rel in $store.radar.discographyReleases" :key="rel.id || rel.clean_title">
                    <div class="flex items-center justify-between p-3 rounded-xl bg-surface-elevated/40 border border-surface-border hover:border-surface-borderSubtle transition text-xs">
                        <div class="flex items-center space-x-3 truncate mr-3">
                            <div class="w-10 h-10 rounded-lg bg-surface-input overflow-hidden shrink-0">
                                <img :src="rel.cover_url || '/static/images/default-cover.png'" class="w-full h-full object-cover" alt="Обложка релиза">
                            </div>
                            <div class="truncate">
                                <div class="font-bold text-white truncate" x-text="rel.title"></div>
                                <div class="text-xs text-content-muted font-mono flex items-center space-x-2 mt-0.5">
                                    <span x-text="rel.release_type"></span>
                                    <span>•</span>
                                    <span x-text="rel.year || rel.release_date"></span>
                                    <span x-text="rel.track_count > 0 ? `• ${rel.track_count} трек.` : ''"></span>
                                </div>
                            </div>
                        </div>

                        <!-- Статус и действия -->
                        <div class="flex items-center space-x-2 shrink-0">
                            <!-- Бэджи статуса -->
                            <template x-if="rel.status === 'in_library'">
                                <span class="px-2.5 py-1 text-xs font-bold bg-emerald-500/20 text-emerald-400 rounded-lg border border-emerald-500/30">В медиатеке</span>
                            </template>
                            <template x-if="rel.status === 'version_exists'">
                                <span class="px-2.5 py-1 text-xs font-bold bg-blue-500/20 text-blue-400 rounded-lg border border-blue-500/30">Другая версия</span>
                            </template>
                            <template x-if="rel.status === 'new'">
                                <span class="px-2.5 py-1 text-xs font-bold bg-brand/20 text-brand rounded-lg border border-brand/30">Новинка</span>
                            </template>
                            <template x-if="rel.status === 'missing'">
                                <span class="px-2.5 py-1 text-xs font-bold bg-amber-500/20 text-amber-400 rounded-lg border border-amber-500/30">Пробел (Missing)</span>
                            </template>
                            <template x-if="rel.status === 'downloaded'">
                                <span class="px-2.5 py-1 text-xs font-bold bg-purple-500/20 text-purple-400 rounded-lg border border-purple-500/30">В очереди / Загружен</span>
                            </template>
                            <template x-if="rel.status === 'ignored'">
                                <span class="px-2.5 py-1 text-xs font-bold bg-surface-input text-content-muted rounded-lg border border-surface-border">Скрыт</span>
                            </template>

                            <!-- Кнопка загрузки -->
                            <template x-if="rel.status !== 'in_library'">
                                <button
                                    @click="$store.radar.downloadRelease(rel)"
                                    class="px-3 py-1 bg-brand hover:bg-brand-hover text-white rounded-lg transition font-medium text-xs">
                                    Скачать
                                </button>
                            </template>
                        </div>
                    </div>
                </template>
            </div>
        </div>
    </div>
</div>
{{ end }}
