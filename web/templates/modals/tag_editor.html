{{ define "modal_tag_editor" }}
<!-- ==================== МОДАЛЬНОЕ ОКНО 1: TAG EDITOR ==================== -->
    <div
        x-show="$store.app.activeModal === 'tag_editor'"
        x-cloak
        @click.self="close()"
        @keydown.escape.window="close()"
        class="fixed inset-0 z-50 flex items-center justify-center modal-backdrop p-4 overflow-y-auto"
        x-data="tagEditorComponent()">
        <div
            @click.stop
            class="bg-gray-900 border border-gray-700 rounded-2xl max-w-5xl w-full max-h-[90vh] flex flex-col shadow-2xl overflow-hidden animate-fade-in">
            
            <!-- Заголовок модального окна -->
            <div class="px-6 py-4 border-b border-gray-800 flex items-center justify-between bg-gray-950/60">
                <div class="flex items-center space-x-3">
                    <div class="w-8 h-8 rounded-lg bg-emerald-500/10 text-emerald-400 flex items-center justify-center">
                        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor">
                            <path d="m21.4 14.25l-7.15 7.15q-.3.3-.675.45t-.75.15t-.75-.15t-.675-.45l-8.825-8.825q-.275-.275-.425-.637T2 11.175V4q0-.825.588-1.412T4 2h7.175q.4 0 .775.163t.65.437l8.8 8.825q.3.3.438.675t.137.75t-.137.738t-.438.662M6.5 8q.625 0 1.063-.437T8 6.5t-.437-1.062T6.5 5t-1.062.438T5 6.5t.438 1.063T6.5 8"/>
                        </svg>
                    </div>
                    <h2 class="text-base font-bold text-white">Редактор тегов ID3v2.4</h2>
                </div>
                <button
                    @click="close()"
                    class="text-gray-400 hover:text-white p-1 rounded-lg hover:bg-gray-800 transition">
                    <svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor">
                        <path d="m12 13.4l-4.9 4.9q-.275.275-.7.275t-.7-.275t-.275-.7t.275-.7l4.9-4.9l-4.9-4.9q-.275-.275-.275-.7t.275-.7t.7-.275t.7.275l4.9 4.9l4.9-4.9q.275-.275.7-.275t.7.275t.275.7t-.275.7L13.4 12l4.9 4.9q.275.275.275.7t-.275.7t-.7.275t-.7-.275z"/>
                    </svg>
                </button>
            </div>

            <!-- Тело модального окна -->
            <div class="flex-1 overflow-y-auto p-6 space-y-6">
                <!-- БЛОК РЕЛИЗОВ И ТРЕКОВ -->
                <div class="space-y-4">
                    <div class="flex items-center justify-between flex-wrap gap-2">
                        <div class="flex items-center space-x-3">
                            <h3 class="text-sm font-semibold text-white">Список треков</h3>
                            <!-- Переключатель режима отображения: По релизам / Сплошной список -->
                            <div class="flex items-center bg-gray-950 p-0.5 rounded-lg border border-gray-800 text-xs">
                                <button
                                    type="button"
                                    @click="viewMode = 'grouped'"
                                    :class="viewMode === 'grouped' ? 'bg-emerald-600/30 text-emerald-400 font-semibold' : 'text-gray-400 hover:text-white'"
                                    class="px-2.5 py-1 rounded-md transition flex items-center space-x-1"
                                    title="Сгруппировать треки по альбомам и синглам">
                                    <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor">
                                        <path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H8V4h12v12z"/>
                                    </svg>
                                    <span>По релизам</span>
                                </button>
                                <button
                                    type="button"
                                    @click="viewMode = 'flat'"
                                    :class="viewMode === 'flat' ? 'bg-emerald-600/30 text-emerald-400 font-semibold' : 'text-gray-400 hover:text-white'"
                                    class="px-2.5 py-1 rounded-md transition flex items-center space-x-1"
                                    title="Отобразить все треки сплошным списком">
                                    <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor">
                                        <path d="M3 13h2v-2H3v2zm0 4h2v-2H3v2zm0-8h2V7H3v2zm4 4h14v-2H7v2zm0 4h14v-2H7v2zM7 7v2h14V7H7z"/>
                                    </svg>
                                    <span>Сплошной список</span>
                                </button>
                            </div>

                            <!-- Кнопки управления аккордеоном (для группового режима) -->
                            <template x-if="viewMode === 'grouped'">
                                <div class="flex items-center space-x-1 text-xs">
                                    <button
                                        type="button"
                                        @click="expandAllGroups()"
                                        class="px-2 py-1 text-gray-400 hover:text-white hover:bg-gray-800 rounded transition flex items-center space-x-1"
                                        title="Развернуть все альбомы и релизы">
                                        <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor">
                                            <path d="M12 16.175l3.9-3.875q.275-.275.688-.288t.712.288q.275.275.275.7t-.275.7l-4.6 4.6q-.15.15-.325.213t-.375.062t-.375-.062t-.325-.213l-4.6-4.6q-.275-.275-.288-.687T6.7 12.3q.275-.275.7-.275t.7.275zm0-6L15.9 6.3q.275-.275.688-.287t.712.287q.275.275.275.7t-.275.7l-4.6 4.6q-.15.15-.325.213t-.375.062t-.375-.062t-.325-.213L6.7 7.7q-.275-.275-.288-.687T6.7 6.3q.275-.275.7-.275t.7.275z"/>
                                        </svg>
                                        <span>Развернуть все</span>
                                    </button>
                                    <span class="text-gray-700">|</span>
                                    <button
                                        type="button"
                                        @click="collapseAllGroups()"
                                        class="px-2 py-1 text-gray-400 hover:text-white hover:bg-gray-800 rounded transition flex items-center space-x-1"
                                        title="Свернуть все альбомы и релизы">
                                        <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor">
                                            <path d="M12 7.825l3.9 3.875q.275.275.688.288t.712-.288q.275-.275.275-.7t-.275-.7l-4.6-4.6q-.15-.15-.325-.213t-.375-.062t-.375.062t-.325.213l-4.6 4.6q-.275.275-.288.687T6.7 11.7q.275.275.7.275t.7-.275z"/>
                                        </svg>
                                        <span>Свернуть все</span>
                                    </button>
                                </div>
                            </template>
                        </div>
                        <div class="flex items-center flex-wrap gap-2">
                            <!-- Кнопка автопоиска обложек синглов -->
                            <button
                                type="button"
                                @click="fetchSinglesCovers()"
                                :disabled="isSearchingSinglesCovers || !tracks.length"
                                class="px-3 py-1.5 bg-gray-800 hover:bg-gray-700 text-pink-400 hover:text-pink-300 text-xs font-semibold rounded-lg border border-pink-500/30 transition flex items-center space-x-1.5 disabled:opacity-50 shadow-sm"
                                title="Автоматический поиск обложек в Deezer для всех синглов и отдельных треков">
                                <template x-if="isSearchingSinglesCovers">
                                    <svg class="w-3.5 h-3.5 animate-spin" viewBox="0 0 24 24" fill="currentColor">
                                        <path d="M8.125 21.213q-1.825-.788-3.187-2.15t-2.15-3.188T2 11.988t.788-3.875t2.15-3.175t3.187-2.15T12 2q.425 0 .713.288T13 3t-.288.713T12 4Q8.675 4 6.337 6.338T4 12t2.338 5.663T12 20t5.663-2.337T20 12q0-.425.288-.712T21 11t.713.288T22 12q0 2.05-.788 3.875t-2.15 3.188t-3.175 2.15t-3.875.787t-3.887-.787"/>
                                    </svg>
                                </template>
                                <template x-if="!isSearchingSinglesCovers">
                                    <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor">
                                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 17.93c-3.95-.49-7-3.85-7-7.93 0-.62.08-1.21.21-1.79L9 15v1c0 1.1.9 2 2 2v1.93zm6.9-2.54c-.26-.81-1-1.39-1.9-1.39h-1v-3c0-.55-.45-1-1-1H8v-2h2c.55 0 1-.45 1-1V7h2c1.1 0 2-.9 2-2v-.41c2.93 1.19 5 4.06 5 7.41 0 2.08-.8 3.97-2.1 5.39z"/>
                                    </svg>
                                </template>
                                <span x-text="isSearchingSinglesCovers ? `Поиск обложек (${singlesCoverProgress.current}/${singlesCoverProgress.total})...` : '⚡ Обложки синглов'"></span>
                            </button>
                            <button
                                type="button"
                                @click="cleanTitles()"
                                :disabled="!tracks.length"
                                class="px-3 py-1.5 bg-gray-800 hover:bg-gray-700 text-amber-400 hover:text-amber-300 text-xs font-semibold rounded-lg border border-amber-500/30 transition flex items-center space-x-1.5 disabled:opacity-50 shadow-sm"
                                title="Очистить названия всех треков от мусорных суффиксов и извлечь фиты в исполнители">
                                <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor">
                                    <path d="M19.36 2.72l1.42 1.42a1.996 1.996 0 0 1 0 2.83l-1.42 1.42l-4.24-4.24l1.41-1.43a2 2 0 0 1 2.83 0M3 21v-4.24l10.6-10.6l4.25 4.24L7.24 21zm3.5-2H7.5l7.66-7.66l-.96-.95l-7.7 7.7z"/>
                                </svg>
                                <span>Очистить названия</span>
                            </button>
                            <button
                                type="button"
                                @click="renumberTracks()"
                                :disabled="!tracks.length"
                                class="px-3 py-1.5 bg-gray-800 hover:bg-gray-700 text-teal-400 hover:text-teal-300 text-xs font-semibold rounded-lg border border-teal-500/30 transition flex items-center space-x-1.5 disabled:opacity-50 shadow-sm"
                                title="Автоматически перенумеровать все треки (1..N)">
                                <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor">
                                    <path d="M4 19h16v2H4zm3.8-4L6.4 9.6c-.2-.7-.4-1.3-.5-1.9h-.1c0 .6-.1 1.2-.3 1.9L4.2 15zm-2-7.2h1.6l2.9 8.2H8.8l-.6-1.9H4.6l-.6 1.9H2.6zm9.7 7.2h2v-8h-2zm-.5-9.5c0-.7.6-1.2 1.5-1.2s1.5.5 1.5 1.2c0 .6-.6 1.2-1.5 1.2s-1.5-.6-1.5-1.2"/>
                                </svg>
                                <span>Перенумеровать</span>
                            </button>
                            <button
                                type="button"
                                @click="recognizeAllTracks()"
                                :disabled="isRecognizingAll || !tracks.length"
                                class="px-3 py-1.5 bg-gray-800 hover:bg-gray-700 text-blue-400 hover:text-blue-300 text-xs font-semibold rounded-lg border border-blue-500/30 transition flex items-center space-x-1.5 disabled:opacity-50 shadow-sm"
                                title="Распознать все треки альбома по звуку через Shazam">
                                <template x-if="isRecognizingAll">
                                    <svg class="w-3.5 h-3.5 animate-spin" viewBox="0 0 24 24" fill="currentColor">
                                        <path d="M8.125 21.213q-1.825-.788-3.187-2.15t-2.15-3.188T2 11.988t.788-3.875t2.15-3.175t3.187-2.15T12 2q.425 0 .713.288T13 3t-.288.713T12 4Q8.675 4 6.337 6.338T4 12t2.338 5.663T12 20t5.663-2.337T20 12q0-.425.288-.712T21 11t.713.288T22 12q0 2.05-.788 3.875t-2.15 3.188t-3.175 2.15t-3.875.787t-3.887-.787"/>
                                    </svg>
                                </template>
                                <template x-if="!isRecognizingAll">
                                    <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor">
                                        <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55c-2.21 0-4 1.79-4 4s1.79 4 4 4s4-1.79 4-4V7h4V3z"/>
                                    </svg>
                                </template>
                                <span x-text="isRecognizingAll ? `Shazam (${shazamProgress.current}/${shazamProgress.total})...` : 'Распознать всё (Shazam)'"></span>
                            </button>
                            <button
                                type="button"
                                @click="fetchLyricsForAlbum()"
                                :disabled="isFetchingLyrics || !tracks.length"
                                class="px-3 py-1.5 bg-gray-800 hover:bg-gray-700 text-emerald-400 hover:text-emerald-300 text-xs font-semibold rounded-lg border border-emerald-500/30 transition flex items-center space-x-1.5 disabled:opacity-50 shadow-sm"
                                title="Автоматический поиск и сохранение текстов песен для всех треков">
                                <template x-if="isFetchingLyrics">
                                    <svg class="w-3.5 h-3.5 animate-spin" viewBox="0 0 24 24" fill="currentColor">
                                        <path d="M8.125 21.213q-1.825-.788-3.187-2.15t-2.15-3.188T2 11.988t.788-3.875t2.15-3.175t3.187-2.15T12 2q.425 0 .713.288T13 3t-.288.713T12 4Q8.675 4 6.337 6.338T4 12t2.338 5.663T12 20t5.663-2.337T20 12q0-.425.288-.712T21 11t.713.288T22 12q0 2.05-.788 3.875t-2.15 3.188t-3.175 2.15t-3.875.787t-3.887-.787"/>
                                    </svg>
                                </template>
                                <template x-if="!isFetchingLyrics">
                                    <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor">
                                        <path d="M9.5 16q-2.725 0-4.612-1.888T3 9.5t1.888-4.612T9.5 3t4.613 1.888T16 9.5q0 1.1-.35 2.075T14.7 13.3l5.6 5.6q.275.275.275.7t-.275.7t-.7.275t-.7-.275l-5.6-5.6q-.75.6-1.725.95T9.5 16m0-2q1.875 0 3.188-1.312T14 9.5t-1.312-3.187T9.5 5T6.313 6.313T5 9.5t1.313 3.188T9.5 14"/>
                                    </svg>
                                </template>
                                <span x-text="isFetchingLyrics ? `Поиск текстов (${lyricsProgress.current}/${lyricsProgress.total})...` : 'Найти все тексты'"></span>
                            </button>
                        </div>
                    </div>

                    <!-- РЕЖИМ 1: КАРТОЧКИ РЕЛИЗОВ (Альбомы и Синглы) -->
                    <template x-if="viewMode === 'grouped'">
                        <div class="space-y-5">
                            <template x-for="group in releases" :key="group.id">
                                <div class="bg-gray-950/70 border border-gray-800 rounded-xl overflow-hidden shadow">
                                    <!-- Заголовок релиза (аккордеон) -->
                                    <div
                                        @click="toggleGroupCollapse(group.id)"
                                        class="py-3 px-4 bg-gray-900/80 hover:bg-gray-900 border-b border-gray-800/80 flex items-center justify-between cursor-pointer select-none transition">
                                        <div class="flex items-center space-x-3 min-w-0">
                                            <!-- Шеврон сворачивания / разворачивания -->
                                            <div
                                                class="p-1 text-gray-400 hover:text-white rounded transition flex-shrink-0"
                                                :title="isGroupCollapsed(group.id) ? 'Развернуть релиз' : 'Свернуть релиз'">
                                                <svg class="w-4 h-4 transition-transform duration-200" :class="{ '-rotate-90': isGroupCollapsed(group.id) }" viewBox="0 0 24 24" fill="currentColor">
                                                    <path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6l-6-6l1.41-1.41z"/>
                                                </svg>
                                            </div>

                                            <!-- Обложка релиза (32x32) -->
                                            <div class="w-8 h-8 rounded bg-gray-800 border border-gray-700 overflow-hidden flex items-center justify-center flex-shrink-0">
                                                <template x-if="group.coverPreviewUrl">
                                                    <img :src="group.coverPreviewUrl" class="w-full h-full object-cover">
                                                </template>
                                                <template x-if="!group.coverPreviewUrl">
                                                    <template x-if="group.isSingles">
                                                        <svg class="w-4 h-4 text-gray-400" viewBox="0 0 24 24" fill="currentColor">
                                                            <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55c-2.21 0-4 1.79-4 4s1.79 4 4 4s4-1.79 4-4V7h4V3z"/>
                                                        </svg>
                                                    </template>
                                                    <template x-if="!group.isSingles">
                                                        <svg class="w-4 h-4 text-gray-400" viewBox="0 0 24 24" fill="currentColor">
                                                            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 14.5c-2.49 0-4.5-2.01-4.5-4.5S9.51 7.5 12 7.5s4.5 2.01 4.5 4.5s-2.01 4.5-4.5 4.5zm0-5.5c-.55 0-1 .45-1 1s.45 1 1 1s1-.45 1-1s-.45-1-1-1z"/>
                                                        </svg>
                                                    </template>
                                                </template>
                                            </div>

                                            <!-- Название и метаданные заголовка -->
                                            <div class="flex items-center space-x-2 min-w-0 flex-wrap">
                                                <span class="font-bold text-white text-xs sm:text-sm tracking-wide truncate" x-text="group.title"></span>
                                                <template x-if="group.isSingles">
                                                    <span class="px-2 py-0.5 rounded text-[10px] font-semibold bg-amber-500/20 text-amber-300 border border-amber-500/30">Синглы</span>
                                                </template>
                                                <template x-if="!group.isSingles && group.albumArtist">
                                                    <span class="text-xs text-gray-400 truncate" x-text="group.albumArtist"></span>
                                                </template>
                                                <template x-if="group.year">
                                                    <span class="text-xs text-gray-500" x-text="`• ${group.year}`"></span>
                                                </template>
                                                <span class="text-xs text-gray-500" x-text="`(${group.items.length} трек.)`"></span>
                                            </div>
                                        </div>

                                        <!-- Действия в заголовке убраны — дублировали кнопки внутри карточки -->
                                    </div>

                                    <!-- Раскрывающееся содержимое карточки релиза -->
                                    <div x-show="!isGroupCollapsed(group.id)" class="p-4 sm:p-5 space-y-4">
                                        <!-- БЛОК МЕТАДАННЫХ РЕЛИЗА (БОЛЬШОЕ МЕНЮ РЕЛИЗА) -->
                                        <div class="bg-gray-900/60 border border-gray-800 rounded-xl p-4">
                                            <div class="flex flex-col md:flex-row gap-5">
                                                <!-- Обложка релиза (128x128) -->
                                                <div class="flex flex-col items-center space-y-2 flex-shrink-0">
                                                    <div class="w-32 h-32 rounded-lg bg-gray-950 border border-gray-800 flex items-center justify-center overflow-hidden shadow-inner relative group">
                                                        <template x-if="group.coverPreviewUrl">
                                                            <img :src="group.coverPreviewUrl" alt="Release Cover" class="w-full h-full object-cover">
                                                        </template>
                                                        <template x-if="!group.coverPreviewUrl">
                                                            <svg class="w-10 h-10 text-gray-700" viewBox="0 0 24 24" fill="currentColor">
                                                                <path d="M5 21q-.825 0-1.412-.587T3 19V5q0-.825.588-1.412T5 3h14q.825 0 1.413.588T21 5v14q0 .825-.587 1.413T19 21zm0-2h14V5H5zm0 0V5zm2-2h10q.3 0 .45-.275t-.05-.525l-2.75-3.675q-.15-.2-.4-.2t-.4.2L11.25 16L9.4 13.525q-.15-.2-.4-.2t-.4.2l-2 2.675q-.2.25-.05.525T7 17"/>
                                                            </svg>
                                                        </template>
                                                        <label class="absolute inset-0 bg-black/60 opacity-0 group-hover:opacity-100 flex items-center justify-center cursor-pointer transition text-xs text-white font-medium space-x-1">
                                                            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor">
                                                                <path d="M6 20q-.825 0-1.412-.587T4 18v-2q0-.425.288-.712T5 15t.713.288T6 16v2h12v-2q0-.425.288-.712T19 15t.713.288T20 16v2q0 .825-.587 1.413T18 20zm5-12.15L9.125 9.725q-.3.3-.712.288T7.7 9.7q-.275-.3-.288-.7t.288-.7l3.6-3.6q.15-.15.325-.212T12 4.425t.375.063t.325.212l3.6 3.6q.3.3.288.7t-.288.7q-.3.3-.712.313t-.713-.288L13 7.85V15q0 .425-.288.713T12 16t-.712-.288T11 15z"/>
                                                            </svg>
                                                            <span>Изменить</span>
                                                            <input type="file" accept="image/jpeg,image/png" @change="handleGroupCoverUpload($event, group)" class="hidden">
                                                        </label>
                                                    </div>
                                                    <div class="flex flex-col items-center space-y-1">
                                                        <button
                                                            type="button"
                                                            @click="openGroupCoverGallery(group)"
                                                            class="text-xs text-purple-400 hover:text-purple-300 hover:underline flex items-center space-x-1">
                                                            <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor">
                                                                <path d="M5 21q-.825 0-1.412-.587T3 19V5q0-.825.588-1.412T5 3h14q.825 0 1.413.588T21 5v14q0 .825-.587 1.413T19 21zm0-2h14V5H5zm0 0V5zm2-2h10q.3 0 .45-.275t-.05-.525l-2.75-3.675q-.15-.2-.4-.2t-.4.2L11.25 16L9.4 13.525q-.15-.2-.4-.2t-.4.2l-2 2.675q-.2.25-.05.525T7 17"/>
                                                            </svg>
                                                            <span>Выбрать из галереи</span>
                                                        </button>
                                                    </div>
                                                </div>

                                                <!-- Поля метаданных релиза -->
                                                <div class="flex-1 grid grid-cols-1 sm:grid-cols-2 gap-3.5">
                                                    <div>
                                                        <label class="block text-xs font-semibold text-gray-400 mb-1">Исполнитель релиза (Album Artist)</label>
                                                        <input
                                                            type="text"
                                                            x-model="group.albumArtist"
                                                            placeholder="Daft Punk\\Pharrell Williams"
                                                            class="w-full bg-gray-950 border border-gray-700 rounded-lg px-3 py-1.5 text-sm text-white focus:outline-none focus:border-emerald-500">

                </div>
            </div>

            <!-- Подвал модального окна -->
            <div class="px-6 py-4 border-t border-gray-800 bg-gray-950 flex items-center justify-between flex-wrap gap-3">
                <div class="flex items-center space-x-4 text-xs">
                    <label class="flex items-center space-x-2 cursor-pointer text-gray-300 hover:text-white select-none" title="Раскладывать треки в подпапки соответствующих альбомов">
                        <input
                            type="checkbox"
                            x-model="groupByAlbum"
                            class="rounded bg-gray-900 border-gray-700 text-emerald-500 focus:ring-emerald-500/30 focus:ring-offset-0">
                        <span>Раскладывать по альбомам</span>
                    </label>
                    <label class="flex items-center space-x-2 cursor-pointer text-gray-300 hover:text-white select-none" title="Сохранять отдельные треки без альбома по схеме Artist/Track.mp3 вместо Artist/Singles/Track.mp3">
                        <input
                            type="checkbox"
                            x-model="singlesMode"
                            @change="buildReleasesFromTracks()"
                            class="rounded bg-gray-900 border-gray-700 text-emerald-500 focus:ring-emerald-500/30 focus:ring-offset-0">
                        <span>Режим синглов (Artist/Track)</span>
                    </label>
                </div>
                <div class="flex items-center space-x-3">
                    <button
                        type="button"
                        @click="close()"
                        class="px-4 py-2 bg-gray-800 hover:bg-gray-700 text-gray-300 text-xs font-semibold rounded-lg transition">
                        Отмена
                    </button>
                    <button
                        type="button"
                        @click="saveAlbum()"
                        :disabled="isSaving"
                        class="px-6 py-2 bg-emerald-600 hover:bg-emerald-500 disabled:opacity-50 text-white text-xs font-bold rounded-lg transition flex items-center space-x-2 shadow-lg shadow-emerald-600/30">
                        <template x-if="isSaving">
                            <svg class="w-3.5 h-3.5 animate-spin" viewBox="0 0 24 24" fill="currentColor">
                                <path d="M8.125 21.213q-1.825-.788-3.187-2.15t-2.15-3.188T2 11.988t.788-3.875t2.15-3.175t3.187-2.15T12 2q.425 0 .713.288T13 3t-.288.713T12 4Q8.675 4 6.337 6.338T4 12t2.338 5.663T12 20t5.663-2.337T20 12q0-.425.288-.712T21 11t.713.288T22 12q0 2.05-.788 3.875t-2.15 3.188t-3.175 2.15t-3.875.787t-3.887-.787"/>
                            </svg>
                        </template>
                        <template x-if="!isSaving">
                            <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor">
                                <path d="M5 21q-.825 0-1.412-.587T3 19V5q0-.825.588-1.412T5 3h11.175q.4 0 .763.15t.637.425l2.85 2.85q.275.275.425.638t.15.762V19q0 .825-.587 1.413T19 21zm9.125-3.875Q15 16.25 15 15t-.875-2.125T12 12t-2.125.875T9 15t.875 2.125T12 18t2.125-.875M7 10h7q.425 0 .713-.288T15 9V7q0-.425-.288-.712T14 6H7q-.425 0-.712.288T6 7v2q0 .425.288.713T7 10"/>
                            </svg>
                        </template>
                        <span x-text="isSaving ? 'Сохранение...' : (releases.length > 1 ? `Сохранить всё в медиатеку (${releases.length} рел.)` : 'Сохранить в медиатеку')"></span>
                    </button>
                </div>
            </div>
        </div>
    </div>
{{ end }}
