{{ define "queue_drawer" }}
<!-- ==================== ПЛАВАЮЩИЙ МЕНЕДЖЕР ОЧЕРЕДЕЙ (QUEUE WIDGET) ==================== -->
    <div class="fixed right-4 z-40 flex flex-col items-end pointer-events-none transition-all duration-300"
         :class="$store.player?.isVisible ? 'bottom-24' : 'bottom-4'"
         x-data>
        <!-- Развернутая панель очереди (Drawer) -->
        <div
            x-show="$store.app.queue.isOpen"
            x-transition:enter="transition ease-out duration-200"
            x-transition:enter-start="opacity-0 translate-y-4 scale-95"
            x-transition:enter-end="opacity-100 translate-y-0 scale-100"
            x-transition:leave="transition ease-in duration-150"
            x-transition:leave-start="opacity-100 translate-y-0 scale-100"
            x-transition:leave-end="opacity-0 translate-y-4 scale-95"
            role="region"
            aria-label="Очередь фоновых загрузок"
            class="pointer-events-auto bg-surface-panel/95 backdrop-blur-md border border-surface-border rounded-lg shadow-2xl w-80 sm:w-96 mb-3 overflow-hidden flex flex-col max-h-[32rem]">
            
            <!-- Шапка панели -->
            <div class="p-3 bg-surface-base/90 border-b border-surface-border flex items-center justify-between">
                <div class="flex items-center space-x-2">
                    <div class="w-6 h-6 rounded bg-white/[0.08] text-white flex items-center justify-center" aria-hidden="true">
                        <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                            <path d="M4 18q-.825 0-1.412-.587T2 16V4q0-.825.588-1.412T4 2h12q.825 0 1.413.588T18 4v12q0 .825-.587 1.413T16 18zm16 4q-.825 0-1.412-.587T18 20V7q0-.425.288-.712T19 6t.713.288T20 7v13h-13q-.425 0-.712-.288T6 19t.288-.712T7 18h13z"/>
                        </svg>
                    </div>
                    <div>
                        <h4 class="text-xs font-semibold text-white">Очередь загрузок</h4>
                        <span class="text-xs text-content-muted font-mono" x-text="`Активно: ${$store.app.queue.activeCount} из ${$store.app.queue.totalCount}`"></span>
                    </div>
                </div>
                <div class="flex items-center space-x-1.5">
                    <template x-if="$store.app.queue.readyCount > 0">
                        <button
                            type="button"
                            @click="$store.app.queue.openAllReadyJobsInTagEditor()"
                            :title="`Редактировать все готовые (${$store.app.queue.readyCount})`"
                            aria-label="Редактировать все готовые релизы в тегах"
                            class="text-xs font-semibold text-zinc-950 px-2.5 py-1 rounded bg-white hover:bg-zinc-200 transition flex items-center space-x-1 focus-visible:ring-2 focus-visible:ring-white/40">
                            <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                                <path d="m21.4 14.25l-7.15 7.15q-.3.3-.675.45t-.75.15t-.75-.15t-.675-.45l-8.825-8.825q-.275-.275-.425-.637T2 11.175V4q0-.825.588-1.412T4 2h7.175q.4 0 .775.163t.65.437l8.8 8.825q.3.3.438.675t.137.75t-.137.738t-.438.662M6.5 8q.625 0 1.063-.437T8 6.5t-.437-1.062T6.5 5t-1.062.438T5 6.5t.438 1.063T6.5 8"/>
                            </svg>
                            <span>В теги (<span x-text="$store.app.queue.readyCount"></span>)</span>
                        </button>
                    </template>
                    <button
                        type="button"
                        @click="$store.app.queue.clearCompleted()"
                        title="Очистить завершенные"
                        aria-label="Очистить завершенные задачи из очереди"
                        class="text-xs text-content-secondary hover:text-white px-2 py-1 rounded bg-surface-elevated hover:bg-surface-hover border border-surface-border transition focus-visible:ring-2 focus-visible:ring-white/30">
                        Очистить
                    </button>
                    <button
                        type="button"
                        @click="$store.app.queue.isOpen = false"
                        aria-label="Закрыть панель очереди"
                        title="Закрыть"
                        class="p-1.5 text-content-muted hover:text-white rounded hover:bg-white/[0.06] transition focus-visible:ring-2 focus-visible:ring-white/30">
                        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                            <path d="m12 13.4l-4.9 4.9q-.275.275-.7.275t-.7-.275t-.275-.7t.275-.7l4.9-4.9l-4.9-4.9q-.275-.275-.275-.7t.275-.7t.7-.275t.7.275l4.9 4.9l4.9-4.9q.275-.275.7-.275t.7.275t.275.7t-.275.7L13.4 12l4.9 4.9q.275.275.275.7t-.275.7t-.7.275t-.7-.275z"/>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Список задач в очереди -->
            <div class="flex-1 overflow-y-auto divide-y divide-surface-borderSubtle p-2 space-y-1">
                <!-- Баннер быстрого массового редактирования при наличии нескольких готовых релизов -->
                <template x-if="$store.app.queue.readyCount > 1">
                    <div class="p-2.5 mb-1 bg-surface-elevated border border-white/[0.1] rounded-md flex items-center justify-between gap-2 shadow-xs">
                        <div class="min-w-0">
                            <div class="text-xs font-semibold text-white flex items-center space-x-1.5">
                                <span class="w-1.5 h-1.5 rounded-full bg-emerald-400"></span>
                                <span>Готово к тегированию:</span>
                                <span class="text-white font-mono" x-text="`${$store.app.queue.readyCount} рел.`"></span>
                            </div>
                            <div class="text-xs text-content-muted truncate">Редактируйте всю пачку одновременно</div>
                        </div>
                        <button
                            type="button"
                            @click="$store.app.queue.openAllReadyJobsInTagEditor()"
                            class="px-2.5 py-1 bg-white hover:bg-zinc-200 text-zinc-950 rounded text-xs font-semibold transition flex items-center space-x-1 flex-shrink-0 focus-visible:ring-2 focus-visible:ring-white/40">
                            <span>Редактировать всё</span>
                        </button>
                    </div>
                </template>
                <template x-if="$store.app.queue.jobs.length === 0">
                    <div class="py-8 text-center text-content-muted text-xs">
                        Очередь загрузок пуста. Добавьте ссылки на треки или альбомы.
                    </div>
                </template>
                <template x-for="j in $store.app.queue.jobs" :key="j.id">
                    <div class="p-2.5 rounded bg-surface-input border border-surface-borderSubtle hover:border-surface-border transition space-y-1.5">
                        <div class="flex items-center justify-between gap-2">
                            <div class="flex items-center space-x-1.5 min-w-0">
                                <span class="text-xs font-mono font-medium px-1.5 py-0.5 rounded uppercase tracking-wider shrink-0"
                                    :class="{
                                        'bg-amber-500/10 text-amber-300 border border-amber-500/20': j.status === 'QUEUED' || j.status === 'RESOLVING',
                                        'bg-blue-500/10 text-blue-300 border border-blue-500/20': j.status === 'DOWNLOADING',
                                        'bg-purple-500/10 text-purple-300 border border-purple-500/20': j.status === 'CONVERTING',
                                        'bg-indigo-500/10 text-indigo-300 border border-indigo-500/20': j.status === 'TAGGING',
                                        'bg-emerald-500/10 text-emerald-300 border border-emerald-500/20': j.status === 'READY',
                                        'bg-rose-500/10 text-rose-300 border border-rose-500/20': j.status === 'ERROR',
                                    }"
                                    x-text="j.status">
                                </span>
                                <template x-if="j.is_backfill">
                                    <span class="text-xs font-mono px-1.5 py-0.5 rounded bg-sky-500/10 text-sky-300 border border-sky-500/20 uppercase tracking-wider shrink-0">
                                        Дозагрузка
                                    </span>
                                </template>
                                <span class="text-xs text-content-primary font-medium truncate"
                                      x-text="j.album_title ? `${j.artist_name ? j.artist_name + ' — ' : ''}${j.album_title}` : j.url"
                                      :title="j.album_title ? `${j.artist_name ? j.artist_name + ' — ' : ''}${j.album_title}` : j.url"></span>
                            </div>
                            <span class="text-xs text-content-secondary font-mono tabular-nums shrink-0" x-text="`${Math.min(100, Math.max(0, Math.round(j.progress || 0)))}%`"></span>
                        </div>

                        <!-- Прогресс бар задачи -->
                        <div class="w-full bg-surface-base rounded-full h-1.5 overflow-hidden border border-surface-borderSubtle">
                            <div
                                class="bg-white h-1.5 rounded-full transition-all duration-300"
                                :style="`width: ${Math.min(100, Math.max(0, Math.round(j.progress || 0)))}%`"></div>
                        </div>

                        <div class="flex items-center justify-between text-xs text-content-secondary">
                            <span class="truncate mr-2 text-content-muted font-mono" x-text="j.current_step"></span>
                            <div class="flex items-center space-x-1 shrink-0">
                                <template x-if="j.status === 'READY'">
                                    <button
                                        type="button"
                                        @click="$store.app.queue.acceptJobDirectly(j.id)"
                                        class="px-2 py-1 bg-emerald-600 hover:bg-emerald-500 text-white rounded text-xs font-semibold transition focus-visible:ring-2 focus-visible:ring-emerald-400"
                                        title="Принять в медиатеку">
                                        Принять
                                    </button>
                                </template>
                                <template x-if="j.status === 'READY' && j.is_backfill">
                                    <button
                                        type="button"
                                        @click="$store.app.queue.openBackfillJobInTagEditor(j)"
                                        class="px-2 py-1 bg-white text-zinc-950 hover:bg-zinc-200 rounded text-xs font-semibold transition focus-visible:ring-2 focus-visible:ring-white/40"
                                        title="Редактировать теги всего релиза">
                                        Весь релиз
                                    </button>
                                </template>
                                <template x-if="j.status === 'READY' && !j.is_backfill">
                                    <button
                                        type="button"
                                        @click="$store.app.queue.openJobInTagEditor(j.id)"
                                        class="px-2 py-1 bg-white text-zinc-950 hover:bg-zinc-200 rounded text-xs font-semibold transition focus-visible:ring-2 focus-visible:ring-white/40"
                                        title="Редактировать теги перед переносом">
                                        В теги
                                    </button>
                                </template>
                                <template x-if="j.status !== 'READY' && j.status !== 'ERROR'">
                                    <button
                                        type="button"
                                        @click="$store.app.queue.cancelJob(j.id)"
                                        class="px-2 py-1 bg-rose-950/60 hover:bg-rose-900 text-rose-200 rounded text-xs transition border border-rose-800/40 focus-visible:ring-2 focus-visible:ring-rose-400">
                                        Отмена
                                    </button>
                                </template>
                                <template x-if="j.status === 'ERROR'">
                                    <button
                                        type="button"
                                        @click="$store.app.queue.retryJob(j.id)"
                                        class="px-2 py-1 bg-amber-600/80 hover:bg-amber-500 text-white rounded text-xs font-semibold transition focus-visible:ring-2 focus-visible:ring-amber-400"
                                        title="Повторить загрузку">
                                        Повторить
                                    </button>
                                </template>
                                <template x-if="j.status === 'ERROR'">
                                    <button
                                        type="button"
                                        @click="$store.app.queue.cancelJob(j.id)"
                                        class="px-2 py-1 bg-surface-elevated hover:bg-surface-hover text-content-secondary rounded text-xs transition border border-surface-border focus-visible:ring-2 focus-visible:ring-white/30"
                                        title="Удалить из списка">
                                        Удалить
                                    </button>
                                </template>
                            </div>
                        </div>
                    </div>
                </template>
            </div>
        </div>

        <!-- Свернутая плавающая плашка-кнопка (Pill Button) -->
        <button
            type="button"
            @click="$store.app.queue.isOpen = !$store.app.queue.isOpen"
            :aria-expanded="$store.app.queue.isOpen"
            aria-label="Панель очереди загрузок"
            class="pointer-events-auto px-3.5 py-2 bg-surface-panel hover:bg-surface-elevated border border-surface-border hover:border-white/20 rounded-md shadow-panel transition flex items-center space-x-2.5 text-xs font-medium text-content-secondary hover:text-white group focus-visible:ring-2 focus-visible:ring-white/30">
            <div class="w-2 h-2 rounded-full"
                :class="$store.app.queue.activeCount > 0 ? 'bg-emerald-400 animate-pulse' : 'bg-surface-border'"
                aria-hidden="true"></div>
            <div class="flex items-center space-x-1.5">
                <svg class="w-3.5 h-3.5 text-content-secondary group-hover:text-white" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                    <path d="M4 18q-.825 0-1.412-.587T2 16V4q0-.825.588-1.412T4 2h12q.825 0 1.413.588T18 4v12q0 .825-.587 1.413T16 18zm16 4q-.825 0-1.412-.587T18 20V7q0-.425.288-.712T19 6t.713.288T20 7v13h-13q-.425 0-.712-.288T6 19t.288-.712T7 18h13z"/>
                </svg>
                <span>Очередь:</span>
                <span class="text-white font-mono" x-text="`${$store.app.queue.activeCount} акт.`"></span>
                <template x-if="$store.app.queue.readyCount > 0">
                    <span class="text-emerald-400 font-mono text-xs font-semibold" x-text="`• ${$store.app.queue.readyCount} готов.`"></span>
                </template>
                <template x-if="$store.app.queue.totalCount > 0 && $store.app.queue.activeCount > 0">
                    <span class="text-content-muted text-xs font-mono" x-text="`(${$store.app.queue.percent}%)`"></span>
                </template>
            </div>
            <svg
                class="w-3.5 h-3.5 text-content-muted group-hover:text-white transition-transform duration-200"
                :class="$store.app.queue.isOpen ? 'rotate-180' : ''"
                viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="m12 8.4l-6 6l1.4 1.4l4.6-4.6l4.6 4.6l1.4-1.4z"/>
            </svg>
        </button>
    </div>
{{ end }}
