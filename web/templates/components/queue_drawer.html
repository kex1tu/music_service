{{ define "queue_drawer" }}
<!-- ==================== ПЛАВАЮЩИЙ МЕНЕДЖЕР ОЧЕРЕДЕЙ (QUEUE WIDGET) ==================== -->
    <div class="fixed bottom-4 right-4 z-40 flex flex-col items-end pointer-events-none" x-data>
        <!-- Развернутая панель очереди (Drawer) -->
        <div
            x-show="$store.app.queue.isOpen"
            x-transition:enter="transition ease-out duration-200"
            x-transition:enter-start="opacity-0 translate-y-4 scale-95"
            x-transition:enter-end="opacity-100 translate-y-0 scale-100"
            x-transition:leave="transition ease-in duration-150"
            x-transition:leave-start="opacity-100 translate-y-0 scale-100"
            x-transition:leave-end="opacity-0 translate-y-4 scale-95"
            class="pointer-events-auto bg-gray-900 border border-gray-800 rounded-2xl shadow-2xl w-80 sm:w-96 mb-3 overflow-hidden flex flex-col max-h-[32rem]">
            
            <!-- Шапка панели -->
            <div class="p-3.5 bg-gray-950/80 border-b border-gray-800 flex items-center justify-between">
                <div class="flex items-center space-x-2">
                    <div class="w-7 h-7 rounded-lg bg-emerald-500/10 text-emerald-400 flex items-center justify-center">
                        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M4 18q-.825 0-1.412-.587T2 16V4q0-.825.588-1.412T4 2h12q.825 0 1.413.588T18 4v12q0 .825-.587 1.413T16 18zm16 4q-.825 0-1.412-.587T18 20V7q0-.425.288-.712T19 6t.713.288T20 7v13h-13q-.425 0-.712-.288T6 19t.288-.712T7 18h13z"/>
                        </svg>
                    </div>
                    <div>
                        <h4 class="text-xs font-bold text-white">Очередь загрузок</h4>
                        <span class="text-[10px] text-gray-400" x-text="`Активно: ${$store.app.queue.activeCount} из ${$store.app.queue.totalCount}`"></span>
                    </div>
                </div>
                <div class="flex items-center space-x-1.5">
                    <template x-if="$store.app.queue.readyCount > 0">
                        <button
                            type="button"
                            @click="$store.app.queue.openAllReadyJobsInTagEditor()"
                            :title="`Редактировать все готовые (${$store.app.queue.readyCount})`"
                            class="text-[11px] font-bold text-white px-2.5 py-1 rounded-lg bg-emerald-600 hover:bg-emerald-500 transition shadow flex items-center space-x-1 animate-pulse">
                            <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor">
                                <path d="m21.4 14.25l-7.15 7.15q-.3.3-.675.45t-.75.15t-.75-.15t-.675-.45l-8.825-8.825q-.275-.275-.425-.637T2 11.175V4q0-.825.588-1.412T4 2h7.175q.4 0 .775.163t.65.437l8.8 8.825q.3.3.438.675t.137.75t-.137.738t-.438.662M6.5 8q.625 0 1.063-.437T8 6.5t-.437-1.062T6.5 5t-1.062.438T5 6.5t.438 1.063T6.5 8"/>
                            </svg>
                            <span>В теги всё (<span x-text="$store.app.queue.readyCount"></span>)</span>
                        </button>
                    </template>
                    <button
                        @click="$store.app.queue.clearCompleted()"
                        title="Очистить завершенные"
                        class="text-[11px] text-gray-400 hover:text-white px-2 py-1 rounded bg-gray-800 hover:bg-gray-700 transition">
                        Очистить
                    </button>
                    <button
                        @click="$store.app.queue.isOpen = false"
                        class="p-1 text-gray-400 hover:text-white rounded hover:bg-gray-800 transition">
                        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor">
                            <path d="m12 13.4l-4.9 4.9q-.275.275-.7.275t-.7-.275t-.275-.7t.275-.7l4.9-4.9l-4.9-4.9q-.275-.275-.275-.7t.275-.7t.7-.275t.7.275l4.9 4.9l4.9-4.9q.275-.275.7-.275t.7.275t.275.7t-.275.7L13.4 12l4.9 4.9q.275.275.275.7t-.275.7t-.7.275t-.7-.275z"/>
                        </svg>
                    </button>
                </div>
            </div>

            <!-- Список задач в очереди -->
            <div class="flex-1 overflow-y-auto divide-y divide-gray-800/60 p-2 space-y-1">
                <!-- Баннер быстрого массового редактирования при наличии нескольких готовых релизов -->
                <template x-if="$store.app.queue.readyCount > 1">
                    <div class="p-2.5 mb-1 bg-gradient-to-r from-emerald-950/90 to-teal-950/80 border border-emerald-500/40 rounded-xl flex items-center justify-between gap-2 shadow-sm">
                        <div class="min-w-0">
                            <div class="text-[11px] font-bold text-white flex items-center space-x-1.5">
                                <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                                <span>Готово к тегированию:</span>
                                <span class="text-emerald-400 font-mono" x-text="`${$store.app.queue.readyCount} рел.`"></span>
                            </div>
                            <div class="text-[10px] text-gray-400 truncate">Редактируйте всю пачку одновременно</div>
                        </div>
                        <button
                            type="button"
                            @click="$store.app.queue.openAllReadyJobsInTagEditor()"
                            class="px-2.5 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg text-xs font-bold transition flex items-center space-x-1 shadow flex-shrink-0">
                            <span>Редактировать всё</span>
                        </button>
                    </div>
                </template>
                <template x-if="$store.app.queue.jobs.length === 0">
                    <div class="py-8 text-center text-gray-500 text-xs">
                        Очередь загрузок пуста
                    </div>
                </template>
                <template x-for="j in $store.app.queue.jobs" :key="j.id">
                    <div class="p-2.5 rounded-lg bg-gray-950/40 hover:bg-gray-950/80 transition space-y-2">
                        <div class="flex items-center justify-between gap-2">
                            <div class="flex items-center space-x-2 min-w-0">
                                <span class="text-[9px] font-bold px-1.5 py-0.5 rounded uppercase tracking-wider shrink-0"
                                    :class="{
                                        'bg-yellow-500/20 text-yellow-400 border border-yellow-500/30': j.status === 'QUEUED' || j.status === 'RESOLVING',
                                        'bg-blue-500/20 text-blue-400 border border-blue-500/30': j.status === 'DOWNLOADING',
                                        'bg-purple-500/20 text-purple-400 border border-purple-500/30': j.status === 'CONVERTING',
                                        'bg-indigo-500/20 text-indigo-400 border border-indigo-500/30': j.status === 'TAGGING',
                                        'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30': j.status === 'READY',
                                        'bg-red-500/20 text-red-400 border border-red-500/30': j.status === 'ERROR',
                                    }"
                                    x-text="j.status">
                                </span>
                                <template x-if="j.is_backfill">
                                    <span class="text-[9px] font-bold px-1.5 py-0.5 rounded bg-sky-500/20 text-sky-300 border border-sky-500/30 uppercase tracking-wider shrink-0">
                                        Дозагрузка
                                    </span>
                                </template>
                                <span class="text-xs text-gray-200 font-medium truncate"
                                      x-text="j.album_title ? `${j.artist_name ? j.artist_name + ' — ' : ''}${j.album_title}` : j.url"
                                      :title="j.album_title ? `${j.artist_name ? j.artist_name + ' — ' : ''}${j.album_title}` : j.url"></span>
                            </div>
                            <span class="text-[10px] text-emerald-400 font-mono shrink-0" x-text="`${Math.min(100, Math.max(0, Math.round(j.progress || 0)))}%`"></span>
                        </div>

                        <!-- Прогресс бар задачи -->
                        <div class="w-full bg-gray-950 rounded-full h-1.5 overflow-hidden border border-gray-800">
                            <div
                                class="bg-gradient-to-r from-emerald-500 to-teal-400 h-1.5 rounded-full transition-all duration-300"
                                :style="`width: ${Math.min(100, Math.max(0, Math.round(j.progress || 0)))}%`"></div>
                        </div>

                        <div class="flex items-center justify-between text-[10px] text-gray-400">
                            <span class="truncate mr-2" x-text="j.current_step"></span>
                            <div class="flex items-center space-x-1 shrink-0">
                                <template x-if="j.status === 'READY' && j.is_backfill">
                                    <button
                                        @click="$store.app.queue.openBackfillJobInTagEditor(j)"
                                        class="px-2 py-0.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded text-[10px] font-semibold transition"
                                        title="Редактировать теги всего релиза">
                                        Весь релиз
                                    </button>
                                </template>
                                <template x-if="j.status === 'READY' && !j.is_backfill">
                                    <button
                                        @click="$store.app.queue.openJobInTagEditor(j.id)"
                                        class="px-2 py-0.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded text-[10px] font-semibold transition">
                                        В теги
                                    </button>
                                </template>
                                <template x-if="j.status !== 'READY' && j.status !== 'ERROR'">
                                    <button
                                        @click="$store.app.queue.cancelJob(j.id)"
                                        class="px-1.5 py-0.5 bg-red-800/60 hover:bg-red-700 text-red-200 rounded text-[10px] transition">
                                        Отмена
                                    </button>
                                </template>
                                <template x-if="j.status === 'ERROR'">
                                    <button
                                        @click="$store.app.queue.retryJob(j.id)"
                                        class="px-1.5 py-0.5 bg-yellow-600/80 hover:bg-yellow-500 text-white rounded text-[10px] font-semibold transition"
                                        title="Повторить загрузку">
                                        Повторить
                                    </button>
                                </template>
                                <template x-if="j.status === 'ERROR'">
                                    <button
                                        @click="$store.app.queue.cancelJob(j.id)"
                                        class="px-1.5 py-0.5 bg-gray-800 hover:bg-gray-700 text-gray-300 rounded text-[10px] transition"
                                        title="Удалить из списка">
                                        Удалить
                                    </button>
                                </template>
                            </div>
                        </div>
                    </div>
                </template>
            </div>
        </div>

        <!-- Свернутая плавающая плашка-кнопка (Pill Button) -->
        <button
            @click="$store.app.queue.isOpen = !$store.app.queue.isOpen"
            class="pointer-events-auto px-4 py-2.5 bg-gray-900 hover:bg-gray-800 border border-gray-700/80 rounded-full shadow-2xl transition flex items-center space-x-3 text-xs font-semibold text-gray-200 hover:text-white group">
            <div class="w-2.5 h-2.5 rounded-full"
                :class="$store.app.queue.activeCount > 0 ? 'bg-emerald-500 animate-pulse' : 'bg-gray-600'"></div>
            <div class="flex items-center space-x-1.5">
                <svg class="w-4 h-4 text-emerald-400" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M4 18q-.825 0-1.412-.587T2 16V4q0-.825.588-1.412T4 2h12q.825 0 1.413.588T18 4v12q0 .825-.587 1.413T16 18zm16 4q-.825 0-1.412-.587T18 20V7q0-.425.288-.712T19 6t.713.288T20 7v13h-13q-.425 0-.712-.288T6 19t.288-.712T7 18h13z"/>
                </svg>
                <span>Очередь:</span>
                <span class="text-emerald-400 font-mono" x-text="`${$store.app.queue.activeCount} акт.`"></span>
                <template x-if="$store.app.queue.readyCount > 0">
                    <span class="text-emerald-300 font-mono text-[11px] font-semibold" x-text="`• ${$store.app.queue.readyCount} готов.`"></span>
                </template>
                <template x-if="$store.app.queue.totalCount > 0 && $store.app.queue.activeCount > 0">
                    <span class="text-gray-400 text-[11px] font-normal" x-text="`(${$store.app.queue.percent}%)`"></span>
                </template>
            </div>
            <svg
                class="w-4 h-4 text-gray-400 group-hover:text-white transition-transform duration-200"
                :class="$store.app.queue.isOpen ? 'rotate-180' : ''"
                viewBox="0 0 24 24" fill="currentColor">
                <path d="m12 8.4l-6 6l1.4 1.4l4.6-4.6l4.6 4.6l1.4-1.4z"/>
            </svg>
        </button>
    </div>
{{ end }}
