{{ define "audio_player" }}
<!-- ==================== СТИКИ АУДИОПЛЕЕР (STUDIO AUDIO CONSOLE) ==================== -->
<div
    x-data
    x-show="$store.player.isVisible"
    x-transition:enter="transition ease-out duration-200 transform"
    x-transition:enter-start="translate-y-full opacity-0"
    x-transition:enter-end="translate-y-0 opacity-100"
    x-transition:leave="transition ease-in duration-150 transform"
    x-transition:leave-start="translate-y-0 opacity-100"
    x-transition:leave-end="translate-y-full opacity-0"
    class="fixed bottom-[calc(4rem+env(safe-area-inset-bottom,0px))] md:bottom-0 left-0 right-0 z-40 bg-zinc-950/90 backdrop-blur-md border-t border-white/[0.08] shadow-panel px-3 sm:px-5 py-2 sm:py-2.5 select-none"
    style="display: none;"
>
    <!-- Скрытый нативный HTML5 Audio элемент -->
    <audio
        x-ref="nativeAudio"
        x-init="$store.player.bindAudio($refs.nativeAudio)"
        @timeupdate="$store.player.onTimeUpdate()"
        @durationchange="$store.player.onDurationChange()"
        @ended="$store.player.onEnded()"
        @play="$store.player.isPlaying = true"
        @pause="$store.player.isPlaying = false"
        @error="$store.player.onError($event)"
        preload="auto"
    ></audio>

    <div class="max-w-[1600px] mx-auto flex items-center justify-between gap-3 sm:gap-4">
        
        <!-- ЛЕВАЯ КОЛОНКА: Обложка и метаданные трека -->
        <div
            @click="$store.player.openPlayerTab()"
            title="Открыть студийную консоль плеера"
            class="flex items-center space-x-2.5 min-w-0 w-1/3 sm:w-1/4 cursor-pointer group">
            <!-- Обложка трека -->
            <div class="relative w-9 h-9 sm:w-10 sm:h-10 rounded-sm bg-surface-elevated shrink-0 overflow-hidden shadow-xs border border-surface-border flex items-center justify-center group-hover:border-white/30 transition">
                <template x-if="$store.player.currentTrack && ($store.player.currentTrack.has_cover || $store.player.currentTrack.cover_url)">
                    <img
                        :src="$store.player.currentTrack.cover_url || `/api/tracks/${$store.player.currentTrack.id || $store.player.currentTrack.path}/cover?_t=${$store.player.currentTrack.id}`"
                        alt="Обложка"
                        class="w-full h-full object-cover"
                        @error="$el.style.display = 'none'; $nextTick(() => { $refs.fallbackIcon.style.display = 'block' })"
                    >
                </template>
                <div x-ref="fallbackIcon" class="text-content-muted" :style="($store.player.currentTrack && ($store.player.currentTrack.has_cover || $store.player.currentTrack.cover_url)) ? 'display: none;' : ''">
                    <svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
                    </svg>
                </div>
            </div>

            <!-- Название и Исполнитель -->
            <div class="min-w-0 flex-1">
                <div
                    class="text-xs font-semibold text-white truncate"
                    :title="$store.player.currentTrack?.title || $store.player.currentTrack?.name"
                    x-text="$store.player.currentTrack?.title || $store.player.currentTrack?.name || 'Трек не выбран'">
                </div>
                <div
                    class="text-xs text-content-secondary truncate"
                    :title="$store.player.currentTrack?.artist || 'Неизвестный исполнитель'"
                    x-text="$store.player.currentTrack?.artist || '—'">
                </div>
            </div>
        </div>

        <!-- ЦЕНТРАЛЬНАЯ КОЛОНКА: Кнопки управления и шкала воспроизведения -->
        <div class="flex-1 max-w-xl flex flex-col items-center space-y-1">
            <!-- Кнопки управления -->
            <div class="flex items-center space-x-3">
                <!-- Предыдущий трек -->
                <button
                    type="button"
                    @click="$store.player.prev()"
                    aria-label="Предыдущий трек"
                    title="Предыдущий трек"
                    class="text-content-secondary hover:text-white transition p-2 sm:p-1.5 rounded-sm hover:bg-white/[0.04] focus:outline-none focus-visible:ring-2 focus-visible:ring-white/30 touch-target-44 sm:h-auto sm:w-auto flex items-center justify-center">
                    <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                        <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z"/>
                    </svg>
                </button>

                <!-- Воспроизведение / Пауза (Solid White Button) -->
                <button
                    type="button"
                    @click="$store.player.togglePlay()"
                    :aria-label="$store.player.isPlaying ? 'Приостановить воспроизведение' : 'Начать воспроизведение'"
                    :title="$store.player.isPlaying ? 'Пауза (Пробел)' : 'Воспроизведение (Пробел)'"
                    class="w-10 h-10 sm:w-8 sm:h-8 rounded-full bg-white hover:bg-zinc-200 text-zinc-950 flex items-center justify-center transition shadow-xs focus:outline-none focus-visible:ring-2 focus-visible:ring-white/40 hover:scale-105 active:scale-95 touch-target-44 sm:h-auto sm:w-auto">
                    <template x-if="$store.player.isLoading">
                        <svg class="w-4 h-4 animate-spin" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                    </template>
                    <template x-if="!$store.player.isLoading && $store.player.isPlaying">
                        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                            <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
                        </svg>
                    </template>
                    <template x-if="!$store.player.isLoading && !$store.player.isPlaying">
                        <svg class="w-4 h-4 translate-x-0.5" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                            <path d="M8 5v14l11-7z"/>
                        </svg>
                    </template>
                </button>

                <!-- Следующий трек -->
                <button
                    type="button"
                    @click="$store.player.next()"
                    aria-label="Следующий трек"
                    title="Следующий трек"
                    class="text-content-secondary hover:text-white transition p-2 sm:p-1.5 rounded-sm hover:bg-white/[0.04] focus:outline-none focus-visible:ring-2 focus-visible:ring-white/30 touch-target-44 sm:h-auto sm:w-auto flex items-center justify-center">
                    <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                        <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/>
                    </svg>
                </button>
            </div>

            <!-- Таймлайн / Полоса перемотки -->
            <div class="w-full flex items-center space-x-2 text-xs font-mono tabular-nums text-content-muted">
                <span class="min-w-[44px] w-auto text-center whitespace-nowrap font-mono tabular-nums font-medium" x-text="$store.player.formatDuration($store.player.currentTime)">0:00</span>
                <div class="flex-1 relative flex items-center group py-0.5">
                    <input
                        type="range"
                        min="0"
                        :max="$store.player.duration || 100"
                        step="1"
                        :value="$store.player.currentTime"
                        aria-label="Перемотка трека"
                        @input="$store.player.seek(parseFloat($event.target.value))"
                        class="w-full h-1.5 bg-white/[0.08] rounded-full appearance-none cursor-pointer focus:outline-none group-hover:h-2 transition-all focus-visible:ring-2 focus-visible:ring-white/30"
                    >
                </div>
                <span class="min-w-[44px] w-auto text-center whitespace-nowrap font-mono tabular-nums font-medium" x-text="$store.player.formatDuration($store.player.duration)">0:00</span>
            </div>
        </div>

        <!-- ПРАВАЯ КОЛОНКА: Громкость и закрытие -->
        <div class="flex items-center justify-end space-x-2 w-1/4">
            <!-- Кнопка Mute / Unmute (на экранах >= sm) -->
            <button
                type="button"
                @click="$store.player.toggleMute()"
                :aria-label="$store.player.isMuted ? 'Включить звук' : 'Выключить звук'"
                :title="$store.player.isMuted ? 'Включить звук (M)' : 'Выключить звук (M)'"
                class="hidden sm:inline-flex text-content-secondary hover:text-white transition p-1.5 rounded-sm hover:bg-white/[0.04] focus:outline-none focus-visible:ring-2 focus-visible:ring-white/30">
                <template x-if="$store.player.isMuted || $store.player.volume === 0">
                    <svg class="w-4 h-4 text-rose-400" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                        <path d="M3.63 3.63a.996.996 0 000 1.41L7.29 8.7 7 9H4c-.55 0-1 .45-1 1v4c0 .55.45 1 1 1h3l3.29 3.29c.63.63 1.71.18 1.71-.71v-4.17l4.18 4.18c-.49.37-1.02.68-1.6.91-.36.15-.58.53-.58.92 0 .69.69 1.19 1.34.94.81-.31 1.56-.76 2.22-1.3l1.8 1.8c.39.39 1.02.39 1.41 0 .39-.39.39-1.02 0-1.41L5.05 3.63a.996.996 0 00-1.42 0zM19 12c0 .82-.15 1.61-.41 2.34l1.53 1.53c.56-1.17.88-2.48.88-3.87 0-4.28-2.99-7.86-7-8.77v2.06c2.89.86 5 3.54 5 6.71zm-7-8l-1.88 1.88L12 7.76zm4.5 8A4.5 4.5 0 0014 7.97v1.79l2.48 2.48c.01-.08.02-.16.02-.24z"/>
                    </svg>
                </template>
                <template x-if="!$store.player.isMuted && $store.player.volume > 0">
                    <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                        <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
                    </svg>
                </template>
            </button>

            <!-- Слайдер громкости (скрыт на мобилке) -->
            <div class="hidden sm:block w-16 sm:w-20">
                <input
                    type="range"
                    min="0"
                    max="1"
                    step="0.02"
                    :value="$store.player.isMuted ? 0 : $store.player.volume"
                    aria-label="Громкость воспроизведения"
                    @input="$store.player.setVolume(parseFloat($event.target.value))"
                    class="w-full h-1.5 bg-white/[0.08] rounded-full appearance-none cursor-pointer focus:outline-none focus-visible:ring-2 focus-visible:ring-white/30"
                    title="Громкость"
                >
            </div>

            <!-- Развернуть консоль плеера -->
            <button
                type="button"
                @click="$store.player.openPlayerTab()"
                aria-label="Развернуть вкладку плеера"
                title="Развернуть вкладку плеера"
                class="text-content-secondary hover:text-white transition p-1.5 rounded-sm hover:bg-white/[0.04] focus:outline-none focus-visible:ring-2 focus-visible:ring-white/30 touch-target-44 sm:h-auto sm:w-auto flex items-center justify-center">
                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                    <path d="M5 4h14a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zm0 4h14V6H5v2zm0 10h14V10H5v8z"/>
                </svg>
            </button>

            <!-- Закрыть плеер -->
            <button
                type="button"
                @click="$store.player.close()"
                aria-label="Закрыть панель плеера"
                title="Закрыть плеер"
                class="text-content-muted hover:text-white transition p-1.5 rounded-sm hover:bg-white/[0.04] focus:outline-none focus-visible:ring-2 focus-visible:ring-white/30 touch-target-44 sm:h-auto sm:w-auto flex items-center justify-center">
                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                    <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
                </svg>
            </button>
        </div>

    </div>
</div>
{{ end }}
