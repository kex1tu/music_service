{{ define "downloader_form" }}
<!-- Командная строка загрузки (Studio Command Bar Deck) -->
<div class="bg-surface-panel border border-surface-border rounded-lg p-3.5 sm:p-5 shadow-panel space-y-3.5"
     @drop="handleTorrentDrop($event)"
     @dragover="handleTorrentDragOver($event)">
    
    <!-- Верхняя панель: Переключатель режимов и заголовок -->
    <div class="flex flex-wrap items-center justify-between gap-2.5 pb-2 border-b border-surface-borderSubtle">
        <div class="flex items-center space-x-2">
            <h2 class="text-xs font-semibold text-white uppercase tracking-wider">Загрузка музыки</h2>
            <span class="badge-studio text-xs py-0.5 px-1.5 font-mono">MP3 320 kbps</span>
        </div>

        <!-- Сегментированный переключатель режима -->
        <div class="flex items-center space-x-1 bg-surface-input border border-surface-border p-0.5 rounded-md text-xs">
            <button
                type="button"
                @click="inputMode = 'single'; setMode('single')"
                aria-label="Режим: одна ссылка"
                :class="inputMode !== 'batch' ? 'bg-white text-zinc-950 font-semibold shadow-xs' : 'text-content-secondary hover:text-white hover:bg-white/[0.04]'"
                class="px-2.5 py-1 rounded-sm transition flex items-center space-x-1 focus-visible:ring-2 focus-visible:ring-white/30">
                <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                    <path d="M7 17q-2.075 0-3.537-1.463T2 12t1.463-3.537T7 7h3q.425 0 .713.288T11 8t-.288.713T10 9H7q-1.25 0-2.125.875T4 12t.875 2.125T7 15h3q.425 0 .713.288T11 16t-.288.713T10 17zm2-4q-.425 0-.712-.288T8 12t.288-.712T9 11h6q.425 0 .713.288T16 12t-.288.713T15 13zm5 4q-.425 0-.712-.288T13 16t.288-.712T14 15h3q1.25 0 2.125-.875T20 12t-.875-2.125T17 9h-3q-.425 0-.712-.288T13 8t.288-.712T14 7h3q2.075 0 3.538 1.463T22 12t-1.463 3.538T17 17z"/>
                </svg>
                <span>Одна ссылка</span>
            </button>
            <button
                type="button"
                @click="inputMode = 'batch'; setMode('batch')"
                aria-label="Режим: пакетный список ссылок"
                :class="inputMode === 'batch' ? 'bg-white text-zinc-950 font-semibold shadow-xs' : 'text-content-secondary hover:text-white hover:bg-white/[0.04]'"
                class="px-2.5 py-1 rounded-sm transition flex items-center space-x-1 focus-visible:ring-2 focus-visible:ring-white/30">
                <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                    <path d="M4 18q-.825 0-1.412-.587T2 16V4q0-.825.588-1.412T4 2h12q.825 0 1.413.588T18 4v12q0 .825-.587 1.413T16 18zm16 4q-.825 0-1.412-.587T18 20V7q0-.425.288-.712T19 6t.713.288T20 7v13h-13q-.425 0-.712-.288T6 19t.288-.712T7 18h13z"/>
                </svg>
                <span>Список</span>
                <template x-if="getParsedBatchUrls().length > 0">
                    <span class="px-1.5 py-0.5 bg-zinc-950 text-white rounded-sm text-xs font-mono font-bold" x-text="parsedBatchUrls.length"></span>
                </template>
            </button>
            <label class="cursor-pointer px-2.5 py-1 rounded-sm text-content-secondary hover:text-white hover:bg-white/[0.04] transition flex items-center space-x-1 focus-within:ring-2 focus-within:ring-white/30" title="Перетащите сюда или выберите .torrent файл">
                <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                    <path d="M11 16V7.85l-2.6 2.6L7 9l5-5l5 5l-1.4 1.45l-2.6-2.6V16zm-7 4q-.825 0-1.412-.587T2 18v-3h2v3h16v-3h2v3q0 .825-.587 1.413T20 20z"/>
                </svg>
                <span>.torrent</span>
                <input type="file" accept=".torrent" aria-label="Загрузить torrent-файл" @change="uploadTorrentFile($event)" class="hidden">
            </label>
        </div>
    </div>

    <!-- Основная командная форма -->
    <form @submit.prevent="submitDownload()" novalidate>
        <!-- Одиночный режим: Command Bar Raycast Style -->
        <div x-show="inputMode !== 'batch'" class="flex flex-col sm:flex-row gap-2 items-stretch sm:items-center">
            <div class="flex-1 relative flex items-center bg-surface-input border border-surface-border rounded-md focus-within:border-white/30 focus-within:ring-1 focus-within:ring-white/20 transition shadow-inner p-1">
                <div class="pl-2.5 pr-1 text-content-muted flex items-center pointer-events-none" aria-hidden="true">
                    <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                        <path d="M7 17q-2.075 0-3.537-1.463T2 12t1.463-3.537T7 7h3q.425 0 .713.288T11 8t-.288.713T10 9H7q-1.25 0-2.125.875T4 12t.875 2.125T7 15h3q.425 0 .713.288T11 16t-.288.713T10 17zm2-4q-.425 0-.712-.288T8 12t.288-.712T9 11h6q.425 0 .713.288T16 12t-.288.713T15 13zm5 4q-.425 0-.712-.288T13 16t.288-.712T14 15h3q1.25 0 2.125-.875T20 12t-.875-2.125T17 9h-3q-.425 0-.712-.288T13 8t.288-.712T14 7h3q2.075 0 3.538 1.463T22 12t-1.463 3.538T17 17z"/>
                    </svg>
                </div>
                <input
                    type="text"
                    inputmode="url"
                    x-model="url"
                    aria-label="Ссылка на трек или альбом для скачивания"
                    placeholder="Вставьте ссылку на трек, альбом (SoundCloud, Deezer, Spotify, YT, ЯМ) или magnet:..."
                    class="w-full bg-transparent border-0 px-2.5 py-1.5 text-xs sm:text-sm text-content-primary placeholder-content-muted focus:outline-none min-w-0">
                <div class="flex items-center space-x-1 pr-1 shrink-0">
                    <button
                        type="button"
                        x-show="url"
                        @click="url = ''"
                        aria-label="Очистить строку ссылки"
                        class="p-1 rounded text-content-muted hover:text-white hover:bg-surface-hover transition focus-visible:ring-2 focus-visible:ring-white/30"
                        title="Очистить поле">
                        <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                            <path d="m12 13.4l2.9 2.9q.275.275.7.275t.7-.275t.275-.7t-.275-.7L13.4 12l2.9-2.9q.275-.275.275-.7t-.275-.7t-.7-.275t-.7.275L12 10.6L9.1 7.7q-.275-.275-.7-.275t-.7.275t-.275.7t.275.7l2.9 2.9l-2.9 2.9q-.275.275-.275.7t.275.7t.7.275t.7-.275zm0 8.6q-2.075 0-3.9-.788t-3.175-2.137T2.788 15.9T2 12t.788-3.9t2.137-3.175T8.1 2.788T12 2t3.9.788t3.175 2.137T21.213 8.1T22 12t-.788 3.9t-2.137 3.175t-3.175 2.138T12 22"/>
                        </svg>
                    </button>
                    <button
                        type="button"
                        x-show="checkIsArtistUrl(url)"
                        @click="openDiscographyModal(url)"
                        aria-label="Открыть выбор релизов дискографии"
                        class="px-2 py-1 rounded text-xs bg-amber-500/15 hover:bg-amber-500/25 text-amber-300 border border-amber-500/30 transition flex items-center space-x-1 animate-pulse focus-visible:ring-2 focus-visible:ring-amber-300"
                        title="Открыть выбор релизов дискографии">
                        <svg class="w-3 h-3" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                            <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4s-4 1.79-4 4s1.79 4 4 4m0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4"/>
                        </svg>
                        <span>Дискография</span>
                    </button>
                    <button
                        type="button"
                        @click="pasteUrl()"
                        aria-label="Вставить ссылку из буфера"
                        class="px-2 py-1 rounded text-xs bg-surface-elevated hover:bg-surface-hover text-content-secondary hover:text-white border border-surface-border transition flex items-center space-x-1 focus-visible:ring-2 focus-visible:ring-white/30"
                        title="Вставить из буфера">
                        <span>Вставить</span>
                    </button>
                </div>
            </div>

            <!-- Селектор источника -->
            <div class="sm:w-44 shrink-0">
                <select
                    x-model="source"
                    aria-label="Выбор музыкального источника"
                    class="w-full bg-surface-input border border-surface-border rounded-md px-2.5 py-2 text-content-primary focus:outline-none focus:border-white/30 focus-visible:ring-2 focus-visible:ring-white/30 text-xs shadow-inner cursor-pointer font-medium">
                    <option value="auto">Автоопределение</option>
                    <option value="soundcloud">SoundCloud</option>
                    <option value="deezer">Deezer</option>
                    <option value="torrent">Торрент / Magnet</option>
                    <option value="yandex">Яндекс Музыка</option>
                    <option value="spotify">Spotify</option>
                    <option value="applemusic">Apple Music</option>
                    <option value="youtube">YouTube / YT Music</option>
                </select>
            </div>

            <!-- Кнопки действий: Предпросмотр и Скачать -->
            <div class="flex items-center space-x-2 shrink-0">
                <button
                    type="button"
                    x-show="url"
                    @click="$store.preflight && $store.preflight.open(url, source)"
                    aria-label="Предпросмотр релиза перед скачиванием"
                    class="h-9 px-3 bg-surface-elevated hover:bg-surface-hover text-content-secondary hover:text-white border border-surface-border rounded-md text-xs font-semibold transition flex items-center space-x-1.5 shadow-xs focus-visible:ring-2 focus-visible:ring-white/30"
                    title="Предпросмотр треклиста релиза и проверка базы данных">
                    <svg class="w-3.5 h-3.5 text-zinc-400" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                        <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
                    </svg>
                    <span>Предпросмотр</span>
                </button>

                <button
                    type="submit"
                    aria-label="Скачать аудио"
                    :disabled="isSubmitting || (job && job.status !== 'READY' && job.status !== 'ERROR' && inputMode === 'single')"
                    class="h-9 px-4 bg-white hover:bg-zinc-200 disabled:opacity-40 text-zinc-950 font-semibold rounded-md text-xs transition flex items-center justify-center space-x-1.5 shadow-sm active:scale-[0.98] focus-visible:ring-2 focus-visible:ring-white/40">
                    <template x-if="isSubmitting">
                        <svg class="w-3.5 h-3.5 animate-spin" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                            <path d="M8.125 21.213q-1.825-.788-3.187-2.15t-2.15-3.188T2 11.988t.788-3.875t2.15-3.175t3.187-2.15T12 2q.425 0 .713.288T13 3t-.288.713T12 4Q8.675 4 6.337 6.338T4 12t2.338 5.663T12 20t5.663-2.337T20 12q0-.425.288-.712T21 11t.713.288T22 12q0 2.05-.788 3.875t-2.15 3.188t-3.175 2.15t-3.875.787t-3.887-.787"/>
                        </svg>
                    </template>
                    <template x-if="!isSubmitting">
                        <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                            <path d="M11.625 15.513q-.175-.063-.325-.213l-3.6-3.6q-.3-.3-.288-.7t.288-.7q.3-.3.713-.312t.712.287L11 12.15V5q0-.425.288-.712T12 4t.713.288T13 5v7.15l1.875-1.875q.3-.3.713-.288t.712.313q.275.3.288.7t-.288.7l-3.6 3.6q-.15.15-.325.213t-.375.062t-.375-.062M6 20q-.825 0-1.412-.587T4 18v-2q0-.425.288-.712T5 15t.713.288T6 16v2h12v-2q0-.425.288-.712T19 15t.713.288T20 16v2q0 .825-.587 1.413T18 20z"/>
                        </svg>
                    </template>
                    <span x-text="isSubmitting ? 'Обработка...' : 'Скачать'">Скачать</span>
                </button>
            </div>
        </div>

        <!-- Пакетный режим: Список ссылок -->
        <div x-show="inputMode === 'batch'" class="space-y-2">
            <div class="relative bg-surface-input border border-surface-border rounded-md p-1 focus-within:border-white/30 focus-within:ring-1 focus-within:ring-white/20 transition shadow-inner">
                <textarea
                    x-model="batchUrlsText"
                    rows="3"
                    aria-label="Список ссылок для пакетного скачивания"
                    placeholder="Вставьте по одной ссылке на строку (от 1 до 20):&#10;https://music.yandex.ru/album/...&#10;https://open.spotify.com/album/...&#10;magnet:?xt=urn:btih:..."
                    class="w-full bg-transparent border-0 p-2 text-content-primary placeholder-content-muted focus:outline-none text-xs font-mono"></textarea>
                <div class="absolute top-2 right-2 flex items-center space-x-1">
                    <button
                        type="button"
                        x-show="batchUrlsText"
                        @click="batchUrlsText = ''"
                        aria-label="Очистить список ссылок"
                        class="p-1 rounded text-content-muted hover:text-white hover:bg-surface-hover transition focus-visible:ring-2 focus-visible:ring-white/30"
                        title="Очистить список">
                        <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                            <path d="m12 13.4l2.9 2.9q.275.275.7.275t.7-.275t.275-.7t-.275-.7L13.4 12l2.9-2.9q.275-.275.275-.7t-.275-.7t-.7-.275t-.7.275L12 10.6L9.1 7.7q-.275-.275-.7-.275t-.7.275t-.275.7t.275.7l2.9 2.9l-2.9 2.9q-.275.275-.275.7t.275.7t.7.275t.7-.275zm0 8.6q-2.075 0-3.9-.788t-3.175-2.137T2.788 15.9T2 12t.788-3.9t2.137-3.175T8.1 2.788T12 2t3.9.788t3.175 2.137T21.213 8.1T22 12t-.788 3.9t-2.137 3.175t-3.175 2.138T12 22"/>
                        </svg>
                    </button>
                    <button
                        type="button"
                        @click="pasteBatchUrls()"
                        aria-label="Вставить ссылки из буфера"
                        class="px-2 py-1 rounded text-xs bg-surface-elevated hover:bg-surface-hover text-content-secondary hover:text-white border border-surface-border transition flex items-center space-x-1 focus-visible:ring-2 focus-visible:ring-white/30"
                        title="Вставить из буфера">
                        <span>Вставить</span>
                    </button>
                </div>
            </div>

            <div class="flex items-center justify-between gap-2 pt-1">
                <div class="sm:w-44">
                    <select
                        x-model="source"
                        aria-label="Выбор источника для списка ссылок"
                        class="w-full bg-surface-input border border-surface-border rounded-md px-2.5 py-1.5 text-content-primary focus:outline-none focus:border-white/30 focus-visible:ring-2 focus-visible:ring-white/30 text-xs shadow-inner cursor-pointer font-medium">
                        <option value="auto">Автоопределение</option>
                        <option value="soundcloud">SoundCloud</option>
                        <option value="deezer">Deezer</option>
                        <option value="torrent">Торрент / Magnet</option>
                        <option value="yandex">Яндекс Музыка</option>
                        <option value="spotify">Spotify</option>
                        <option value="applemusic">Apple Music</option>
                        <option value="youtube">YouTube / YT Music</option>
                    </select>
                </div>
                <button
                    type="submit"
                    aria-label="Добавить задачи в очередь"
                    :disabled="isSubmitting"
                    class="h-9 px-4 bg-white hover:bg-zinc-200 disabled:opacity-40 text-zinc-950 font-semibold rounded-md text-xs transition flex items-center space-x-1.5 shadow-sm active:scale-[0.98] focus-visible:ring-2 focus-visible:ring-white/40">
                    <span x-text="isSubmitting ? 'Обработка...' : 'Добавить в очередь'">Добавить в очередь</span>
                </button>
            </div>
        </div>
    </form>

    {{ template "downloader_soundcloud_search" . }}
    {{ template "downloader_active" . }}
</div>
{{ end }}
