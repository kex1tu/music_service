{{ define "audit_covers" }}
<!-- СЕКЦИЯ 2: Релизы без обложек -->
<div x-show="activeSubTab === 'covers'" class="space-y-4">
    <!-- Панель пакетной дозагрузки обложек -->
    <div class="bg-surface-panel border border-surface-border rounded-xl p-4 shadow-panel flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
        <div>
            <h3 class="text-sm font-semibold text-white flex items-center space-x-2">
                <span class="w-2 h-2 rounded-full bg-yellow-400"></span>
                <span>Релизы без обложек</span>
            </h3>
            <p class="text-xs text-content-secondary mt-0.5">
                Автоматический поиск обложек высокого разрешения в iTunes (1400x1400), Deezer и Яндекс Музыке с сохранением cover.jpg и вшиванием в MP3.
            </p>
        </div>
        <div class="flex flex-wrap items-center gap-2 shrink-0">
            <!-- Кнопка: Докачать все обложки пакетом -->
            <button
                @click="backfillAllCovers()"
                :disabled="isBackfillingCovers || missingCovers.length === 0"
                aria-label="Докачать обложки для всех релизов"
                class="px-3.5 py-2 bg-brand hover:bg-brand-hover disabled:opacity-40 text-zinc-950 rounded-lg text-xs font-bold transition flex items-center space-x-1.5 shadow-lg shadow-brand/20 active:scale-95"
                title="Автопоиск и скачивание обложек для всех альбомов без обложек">
                <template x-if="isBackfillingCovers">
                    <svg class="w-3.5 h-3.5 animate-spin" aria-hidden="true" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 20q-3.35 0-5.675-2.325T4 12t2.325-5.675T12 4q1.725 0 3.3.712T18 6.75V4h2v6h-6V8h3.2q-.8-1.4-2.187-2.2T12 5Q9.075 5 7.038 7.038T5 12t2.038 4.963T12 19q2.625 0 4.588-1.7t2.312-4.3h2.05q-.375 3.475-2.95 5.738T12 20"/>
                    </svg>
                </template>
                <template x-if="!isBackfillingCovers">
                    <svg class="w-3.5 h-3.5" aria-hidden="true" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM17 13l-5 5-5-5h3V9h4v4h3z"/>
                    </svg>
                </template>
                <span x-text="isBackfillingCovers ? 'Загрузка обложек...' : ('Докачать все (' + missingCovers.length + ')')"></span>
            </button>

            <!-- Кнопка отмены пакетной дозагрузки -->
            <template x-if="isBackfillingCovers">
                <button
                    @click="cancelCoversBackfill()"
                    aria-label="Отменить загрузку обложек"
                    class="px-2.5 py-2 bg-red-500/20 hover:bg-red-500/30 text-red-400 rounded-lg text-xs font-semibold transition border border-red-500/30">
                    Отмена
                </button>
            </template>
        </div>
    </div>

    <!-- Индикатор прогресса пакетной дозагрузки -->
    <template x-if="isBackfillingCovers">
        <div class="bg-surface-elevated border border-surface-border rounded-xl p-3 text-xs space-y-2">
            <div class="flex items-center justify-between text-content-secondary">
                <span class="truncate" x-text="coversProgressStatus"></span>
                <span class="font-mono ml-2 font-semibold" x-text="coversProgressPercent + '%'"></span>
            </div>
            <div class="w-full bg-surface-base rounded-full h-1.5 overflow-hidden">
                <div class="bg-brand h-full rounded-full transition-all duration-300" :style="'width: ' + coversProgressPercent + '%'"></div>
            </div>
        </div>
    </template>

    <div class="bg-surface-panel border border-surface-border rounded-xl overflow-hidden shadow-panel">
        <template x-if="isLoading">
            <div class="p-8 text-center text-content-muted text-sm flex items-center justify-center space-x-2">
                <svg class="w-4 h-4 animate-spin text-yellow-400" aria-hidden="true" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 20q-3.35 0-5.675-2.325T4 12t2.325-5.675T12 4q1.725 0 3.3.712T18 6.75V4h2v6h-6V8h3.2q-.8-1.4-2.187-2.2T12 5Q9.075 5 7.038 7.038T5 12t2.038 4.963T12 19q2.625 0 4.588-1.7t2.312-4.3h2.05q-.375 3.475-2.95 5.738T12 20"/>
                </svg>
                <span>Загрузка данных...</span>
            </div>
        </template>
        <template x-if="!isLoading && missingCovers.length === 0">
            <div class="p-8 text-center text-content-muted text-sm">
                Отлично! У всех альбомов и папок есть файлы обложек (`cover.jpg` / вшитые теги).
            </div>
        </template>
        <template x-if="!isLoading && missingCovers.length > 0">
            <div>
                <!-- Мобильный вид (< md) -->
                <div class="md:hidden divide-y divide-surface-borderSubtle">
                    <template x-for="item in ($store.app.isDesktopLayout ? [] : missingCovers)" :key="'mob-' + item.path">
                        <div class="p-3.5 space-y-2.5">
                            <div class="flex items-start justify-between gap-2">
                                <div class="min-w-0 flex-1">
                                    <div class="text-sm font-semibold text-content-primary truncate" x-text="item.album || item.path" :title="item.album || item.path"></div>
                                    <div class="text-xs text-content-secondary truncate" x-text="item.artist || '—'" :title="item.artist"></div>
                                </div>
                                <span class="shrink-0 px-2 py-0.5 rounded bg-surface-base border border-surface-border font-mono text-[11px] text-content-secondary">
                                    <span x-text="item.track_count"></span> тр.
                                </span>
                            </div>
                            <div class="text-[11px] text-content-muted font-mono truncate" x-text="item.path" :title="item.path"></div>
                            <div class="flex items-center gap-2">
                                <button
                                    @click="backfillSingleCover(item)"
                                    :disabled="item._isFetchingCover"
                                    :aria-label="'Скачать обложку для альбома ' + (item.album || item.path)"
                                    class="flex-1 px-3 py-2 bg-amber-500/20 hover:bg-amber-500/30 text-amber-300 border border-amber-500/30 rounded text-xs font-medium transition disabled:opacity-50 flex items-center justify-center space-x-1.5">
                                    <svg x-show="!item._isFetchingCover" aria-hidden="true" class="w-3.5 h-3.5 shrink-0" viewBox="0 0 24 24" fill="currentColor">
                                        <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14zm-5.04-6.71l-2.75 3.54-1.96-2.36L6.5 17h11l-3.54-4.71z"/>
                                    </svg>
                                    <span>Скачать арт</span>
                                </button>
                                <button
                                    @click="openDirectory(item.path)"
                                    :aria-label="'Открыть папку ' + item.path"
                                    class="px-3 py-2 bg-surface-elevated hover:bg-surface-hover text-content-secondary hover:text-content-primary border border-surface-border rounded text-xs transition flex items-center space-x-1 shrink-0">
                                    <svg class="w-3.5 h-3.5" aria-hidden="true" viewBox="0 0 24 24" fill="currentColor">
                                        <path d="M4 20q-.825 0-1.412-.587T2 18V6q0-.825.588-1.412T4 4h5.175q.4 0 .763.15t.637.425L12 6h8q.825 0 1.413.588T22 8v10q0 .825-.587 1.413T20 20zm0-2h16V8h-8.825l-2-2H4zm0 0V6z"/>
                                    </svg>
                                    <span>Папка</span>
                                </button>
                            </div>
                        </div>
                    </template>
                </div>

                <!-- Десктопный вид (>= md) -->
                <div class="hidden md:block overflow-x-auto max-h-[600px]">
                <table class="w-full text-left border-collapse text-xs">
                    <thead class="bg-surface-base text-content-secondary uppercase tracking-wider font-semibold sticky top-0 z-10 border-b border-surface-border font-mono text-xs">
                        <tr>
                            <th class="p-3">Альбом / Каталог</th>
                            <th class="p-3">Исполнитель</th>
                            <th class="p-3">Треков в папке</th>
                            <th class="p-3">Путь</th>
                            <th class="p-3 text-right">Действия</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-surface-borderSubtle">
                        <template x-for="item in ($store.app.isDesktopLayout ? missingCovers : [])" :key="item.path">
                            <tr class="hover:bg-surface-elevated/60 transition">
                                <td class="p-3 font-semibold text-content-primary max-w-xs truncate" x-text="item.album || item.path" :title="item.album || item.path"></td>
                                <td class="p-3 text-content-secondary max-w-xs truncate" x-text="item.artist || '—'" :title="item.artist"></td>
                                <td class="p-3 text-content-secondary font-mono" x-text="item.track_count"></td>
                                <td class="p-3 text-content-muted font-mono text-xs max-w-xs truncate" x-text="item.path" :title="item.path"></td>
                                <td class="p-3 text-right">
                                    <div class="flex items-center justify-end space-x-1.5">
                                        <!-- Кнопка: Найти обложку -->
                                        <button
                                            @click="backfillSingleCover(item)"
                                            :disabled="item._isFetchingCover"
                                            :aria-label="'Скачать обложку для альбома ' + (item.album || item.path)"
                                            class="px-2.5 py-1 bg-brand/10 hover:bg-brand/20 text-brand rounded-lg border border-brand/30 transition text-xs font-semibold flex items-center space-x-1 active:scale-95 disabled:opacity-50"
                                            title="Автоматически найти и скачать обложку для этого альбома">
                                            <template x-if="item._isFetchingCover">
                                                <svg class="w-3.5 h-3.5 animate-spin" aria-hidden="true" viewBox="0 0 24 24" fill="currentColor">
                                                    <path d="M12 20q-3.35 0-5.675-2.325T4 12t2.325-5.675T12 4q1.725 0 3.3.712T18 6.75V4h2v6h-6V8h3.2q-.8-1.4-2.187-2.2T12 5Q9.075 5 7.038 7.038T5 12t2.038 4.963T12 19q2.625 0 4.588-1.7t2.312-4.3h2.05q-.375 3.475-2.95 5.738T12 20"/>
                                                </svg>
                                            </template>
                                            <template x-if="!item._isFetchingCover">
                                                <svg class="w-3.5 h-3.5" aria-hidden="true" viewBox="0 0 24 24" fill="currentColor">
                                                    <path d="M19.35 10.04C18.67 6.59 15.64 4 12 4 9.11 4 6.6 5.64 5.35 8.04 2.34 8.36 0 10.91 0 14c0 3.31 2.69 6 6 6h13c2.76 0 5-2.24 5-5 0-2.64-2.05-4.78-4.65-4.96zM17 13l-5 5-5-5h3V9h4v4h3z"/>
                                                </svg>
                                            </template>
                                            <span>Скачать арт</span>
                                        </button>

                                        <!-- Кнопка: Открыть папку -->
                                        <button
                                            @click="openDirectory(item.path)"
                                            :aria-label="'Открыть папку ' + (item.album || item.path)"
                                            class="px-2.5 py-1 bg-yellow-500/10 hover:bg-yellow-500/20 text-yellow-400 rounded-lg border border-yellow-500/30 transition text-xs font-semibold flex items-center space-x-1 active:scale-95">
                                            <svg class="w-3.5 h-3.5" aria-hidden="true" viewBox="0 0 24 24" fill="currentColor">
                                                <path d="M4 20q-.825 0-1.412-.587T2 18V6q0-.825.588-1.412T4 4h5.175q.4 0 .763.15t.637.425L12 6h8q.825 0 1.413.588T22 8v10q0 .825-.587 1.413T20 20zm0-2h16V8h-8.825l-2-2H4zm0 0V6z"/>
                                            </svg>
                                            <span>Папка</span>
                                        </button>
                                    </div>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
                </div>
            </div>
        </template>
    </div>
</div>
{{ end }}
