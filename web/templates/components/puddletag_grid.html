{{ define "puddletag_grid" }}
<!-- ==================== ИНТЕРАКТИВНАЯ ТАБЛИЦА-СЕТКА (DENSE DATA GRID) ==================== -->
<div class="flex-1 flex flex-col bg-surface-panel border border-surface-border rounded-lg overflow-hidden shadow-panel min-w-0">

    <!-- Панель переключения релизов (Release Pill-Tabs при открытии нескольких релизов через «В теги все») -->
    <template x-if="isDownloaderMode && releases && releases.length > 1">
        <div class="px-3 py-2 bg-surface-base/80 border-b border-surface-border flex items-center space-x-2 overflow-x-auto no-scrollbar shrink-0">
            <span class="text-[11px] font-mono uppercase text-content-muted shrink-0 mr-1">Релизы:</span>
            
            <!-- Таб: Все релизы -->
            <button
                type="button"
                @click="setActiveReleaseTab('all')"
                :class="activeReleaseTab === 'all' ? 'bg-white text-zinc-950 font-semibold shadow-xs' : 'bg-surface-elevated text-content-secondary hover:text-white border border-surface-border'"
                class="px-2.5 py-1 rounded-full text-xs transition flex items-center space-x-1.5 shrink-0">
                <span>Все релизы</span>
                <span class="text-[10px] opacity-75 font-mono" x-text="`(${tracks.length})`"></span>
            </button>

            <!-- Табы по каждому релизу -->
            <template x-for="rel in releases" :key="rel.jobId">
                <button
                    type="button"
                    @click="setActiveReleaseTab(rel.jobId)"
                    :class="activeReleaseTab === rel.jobId ? 'bg-white text-zinc-950 font-semibold shadow-xs' : 'bg-surface-elevated text-content-secondary hover:text-white border border-surface-border'"
                    class="px-2.5 py-1 rounded-full text-xs transition flex items-center space-x-1.5 shrink-0 max-w-xs truncate"
                    :title="`${rel.album_artist} — ${rel.album}`">
                    <span class="truncate" x-text="`${rel.album_artist} — ${rel.album}`"></span>
                    <span class="text-[10px] opacity-75 font-mono" x-text="`(${rel.tracksCount || 0})`"></span>
                </button>
            </template>
        </div>
    </template>

    <div class="flex-1 overflow-x-auto md:overflow-y-auto md:max-h-[calc(100vh-230px)] relative select-none">
        <table class="w-full text-left text-xs text-content-secondary border-collapse table-auto md:min-w-[900px] transition-colors"
               :class="gridDensity === 'compact' ? 'table-dense' : ''">
            <!-- Липкая шапка таблицы (Sticky Header) -->
            <thead class="sticky top-0 z-20 bg-surface-panel/95 backdrop-blur-md text-xs font-mono uppercase tracking-wider text-content-muted border-b border-surface-border">
                <tr>
                    <th class="py-2 px-0 w-12 md:w-8 text-center">
                        <label class="touch-target-44 sm:h-auto sm:w-auto flex items-center justify-center cursor-pointer m-0">
                            <input
                                type="checkbox"
                                :checked="isAllSelected"
                                @click="toggleSelectAll()"
                                aria-label="Выбрать все треки в таблице"
                                class="rounded-sm bg-surface-input border-surface-border text-white focus:ring-0 cursor-pointer w-4 h-4 sm:w-3.5 sm:h-3.5">
                        </label>
                    </th>
                    <th class="py-2 px-1 w-12 md:w-8 text-center" title="Воспроизвести">▶</th>
                    <th class="hidden md:table-cell py-2 px-1.5 w-10 text-center" title="Обложка">Арт</th>
                    <th class="hidden md:table-cell py-2 px-2 text-center cursor-pointer hover:text-white transition relative group/th"
                        :style="colWidths['track_number'] ? { width: colWidths['track_number'], minWidth: colWidths['track_number'] } : { width: '2.5rem' }"
                        @click="sortColumn = 'track_number'; sortAsc = !sortAsc">
                        # <span x-show="sortColumn === 'track_number'" x-text="sortAsc ? '▲' : '▼'"></span>
                        <div class="col-resize-handle" @mousedown="startColResize('track_number', $event)"></div>
                    </th>
                    <th class="hidden md:table-cell py-2 px-2 text-center cursor-pointer hover:text-white transition relative group/th"
                        :style="colWidths['disc_number'] ? { width: colWidths['disc_number'], minWidth: colWidths['disc_number'] } : { width: '3rem' }"
                        @click="sortColumn = 'disc_number'; sortAsc = !sortAsc">
                        Диск
                        <div class="col-resize-handle" @mousedown="startColResize('disc_number', $event)"></div>
                    </th>
                    <th class="py-2 px-2 md:px-3 md:min-w-[160px] md:w-[var(--track-title-width,auto)] cursor-pointer hover:text-white transition relative group/th"
                        :style="colWidths['title'] ? { '--track-title-width': colWidths['title'] } : {}"
                        @click="sortColumn = 'title'; sortAsc = !sortAsc">
                        Название <span x-show="sortColumn === 'title'" x-text="sortAsc ? '▲' : '▼'"></span>
                        <div class="col-resize-handle" @mousedown="startColResize('title', $event)"></div>
                    </th>
                    <th class="hidden md:table-cell py-2 px-3 min-w-[130px] cursor-pointer hover:text-white transition relative group/th"
                        :style="colWidths['artist'] ? { width: colWidths['artist'], minWidth: colWidths['artist'] } : {}"
                        @click="sortColumn = 'artist'; sortAsc = !sortAsc">
                        Исполнитель <span x-show="sortColumn === 'artist'" x-text="sortAsc ? '▲' : '▼'"></span>
                        <div class="col-resize-handle" @mousedown="startColResize('artist', $event)"></div>
                    </th>
                    <th class="hidden lg:table-cell py-2 px-3 min-w-[130px] cursor-pointer hover:text-white transition relative group/th"
                        :style="colWidths['album'] ? { width: colWidths['album'], minWidth: colWidths['album'] } : {}"
                        @click="sortColumn = 'album'; sortAsc = !sortAsc">
                        Альбом <span x-show="sortColumn === 'album'" x-text="sortAsc ? '▲' : '▼'"></span>
                        <div class="col-resize-handle" @mousedown="startColResize('album', $event)"></div>
                    </th>
                    <th class="hidden md:table-cell py-2 px-2 w-14 text-center cursor-pointer hover:text-white transition relative group/th"
                        :style="colWidths['year'] ? { width: colWidths['year'], minWidth: colWidths['year'] } : { width: '3.5rem' }"
                        @click="sortColumn = 'year'; sortAsc = !sortAsc">
                        Год <span x-show="sortColumn === 'year'" x-text="sortAsc ? '▲' : '▼'"></span>
                        <div class="col-resize-handle" @mousedown="startColResize('year', $event)"></div>
                    </th>
                    <th class="hidden lg:table-cell py-2 px-2.5 min-w-[90px] cursor-pointer hover:text-white transition relative group/th"
                        :style="colWidths['genre'] ? { width: colWidths['genre'], minWidth: colWidths['genre'] } : {}"
                        @click="sortColumn = 'genre'; sortAsc = !sortAsc">
                        Жанр
                        <div class="col-resize-handle" @mousedown="startColResize('genre', $event)"></div>
                    </th>
                    <th class="hidden md:table-cell py-2 px-2 text-right w-14 font-mono" title="Битрейт">Кбит</th>
                    <th class="py-2 px-1 w-12 md:px-2 md:w-[var(--track-duration-width,3.5rem)] text-right font-mono cursor-pointer hover:text-white transition relative group/th"
                        :style="colWidths['duration'] ? { '--track-duration-width': colWidths['duration'] } : { width: '3.5rem' }"
                        @click="sortColumn = 'duration'; sortAsc = !sortAsc">
                        Время
                        <div class="col-resize-handle" @mousedown="startColResize('duration', $event)"></div>
                    </th>
                    <th class="hidden sm:table-cell py-2 px-2 text-center w-12 font-mono" title="Текст песни">LRC</th>
                    <th class="hidden xl:table-cell py-2 px-3 min-w-[140px] font-mono text-content-muted">Имя файла</th>
                    <th class="py-2 px-0 w-12 md:w-16 md:px-2 text-center font-mono text-content-muted" title="Действия"><span class="hidden md:inline">Действ.</span></th>
                </tr>
            </thead>

            <!-- Тело таблицы со строками файлов -->
            <tbody class="divide-y divide-subtle bg-surface-panel/20 font-sans">
                <!-- Пустое состояние или Просмотр подкаталогов -->
                <template x-if="displayTracks.length === 0 && !isLoading">
                    <tr>
                        <td colspan="15" class="py-10 px-4 text-center text-content-muted">
                            <!-- Если в текущей папке есть подкаталоги -->
                            <template x-if="directories && directories.length > 0">
                                <div class="space-y-3 max-w-3xl mx-auto py-2">
                                    <div class="flex flex-col items-center justify-center space-y-1">
                                        <div class="text-xs font-semibold text-white uppercase tracking-wider">Подкаталоги медиатеки:</div>
                                        <div class="text-xs text-content-muted">Выберите папку для перехода к альбомам и трекам</div>
                                    </div>

                                    <!-- Поиск по каталогам, если их много -->
                                    <template x-if="directories.length > 9">
                                        <div class="max-w-xs mx-auto pt-1">
                                            <input
                                                type="text"
                                                x-model="dirFilter"
                                                placeholder="Быстрый поиск папки..."
                                                aria-label="Быстрый поиск папки"
                                                class="w-full bg-surface-elevated text-content-primary text-xs rounded-md px-2.5 py-1 border border-surface-border focus:border-white/30 outline-none transition font-mono">
                                        </div>
                                    </template>

                                    <!-- Сетка папок -->
                                    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-2 text-left pt-1 md:max-h-80 md:overflow-y-auto p-1">
                                        <template x-for="dir in visibleDirectories" :key="dir.path">
                                            <div class="p-2 bg-surface-elevated hover:bg-surface-hover hover:border-white/20 border border-surface-border rounded-md flex items-center space-x-2.5 transition group shadow-xs text-left">
                                                <button
                                                    type="button"
                                                    @click="navigateTo(dir.path)"
                                                    :aria-label="'Открыть папку ' + dir.name"
                                                    class="flex items-center space-x-2.5 flex-1 min-w-0 text-left active:scale-95 transition">
                                                    <div class="w-7 h-7 rounded-sm bg-surface-input flex items-center justify-center text-zinc-400 group-hover:text-white transition shrink-0">
                                                        <svg class="w-4 h-4" aria-hidden="true" viewBox="0 0 24 24" fill="currentColor">
                                                            <path d="M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/>
                                                        </svg>
                                                    </div>
                                                    <div class="min-w-0 flex-1">
                                                        <div class="font-medium text-white group-hover:text-white truncate text-xs" x-text="dir.name"></div>
                                                        <div class="text-xs text-content-muted font-mono" x-text="dir.track_count !== undefined ? `${dir.track_count} тр.` : 'Папка'"></div>
                                                    </div>
                                                </button>
                                                <button
                                                    type="button"
                                                    @click.stop="$store.releaseSourcePicker.openForLibraryDirectory(dir.path || dir.name, '', dir.name)"
                                                    title="Выбрать источник релиза (альбом / сет)"
                                                    :aria-label="'Выбрать источник релиза для папки ' + dir.name"
                                                    class="w-6 h-6 rounded text-content-muted hover:text-brand hover:bg-white/[0.08] flex items-center justify-center transition shrink-0">
                                                    <svg class="w-3.5 h-3.5 text-brand" viewBox="0 0 24 24" fill="currentColor">
                                                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 14.5c-2.49 0-4.5-2.01-4.5-4.5S9.51 7.5 12 7.5s4.5 2.01 4.5 4.5-2.01 4.5-4.5 4.5zm0-5.5c-.55 0-1 .45-1 1s.45 1 1 1 1-.45 1-1-.45-1-1-1z"/>
                                                    </svg>
                                                </button>
                                                <button
                                                    type="button"
                                                    @click.stop="promptRedownloadDirectory(dir)"
                                                    title="Скачать весь релиз/папку заново"
                                                    :aria-label="'Скачать заново папку ' + dir.name"
                                                    class="w-6 h-6 rounded text-content-muted hover:text-white hover:bg-white/[0.08] flex items-center justify-center transition shrink-0">
                                                    <svg class="w-3.5 h-3.5" aria-hidden="true" viewBox="0 0 24 24" fill="currentColor">
                                                        <path d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6c0 1.01-.25 1.97-.7 2.8l1.46 1.46A7.93 7.93 0 0 0 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6c0-1.01.25-1.97.7-2.8L5.24 7.74A7.93 7.93 0 0 0 4 12c0 4.42 3.58 8 8 8v3l4-4l-4-4v3z"/>
                                                    </svg>
                                                </button>
                                                <button
                                                    type="button"
                                                    @click.stop="promptDeleteDirectory(dir)"
                                                    title="Удалить папку"
                                                    :aria-label="'Удалить папку ' + dir.name"
                                                    class="w-6 h-6 rounded text-content-muted hover:text-rose-300 hover:bg-rose-500/15 flex items-center justify-center transition shrink-0">
                                                    <svg class="w-3.5 h-3.5" aria-hidden="true" viewBox="0 0 24 24" fill="currentColor">
                                                        <path d="M7 21q-.825 0-1.412-.587T5 19V6q-.425 0-.712-.288T4 5t.288-.712T5 4h4q0-.425.288-.712T10 3h4q.425 0 .713.288T15 4h4q.425 0 .713.288T20 5t-.288.713T19 6v13q0 .825-.587 1.413T17 21zm3.713-4.288Q11 16.426 11 16V9q0-.425-.288-.712T10 8t-.712.288T9 9v7q0 .425.288.713T10 17t.713-.288m4 0Q15 16.426 15 16V9q0-.425-.288-.712T14 8t-.712.288T13 9v7q0 .425.288.713T14 17t.713-.288"/>
                                                    </svg>
                                                </button>
                                            </div>
                                        </template>
                                    </div>
                                </div>
                            </template>

                            <!-- Если действительно пустая папка -->
                            <template x-if="!(directories && directories.length > 0)">
                                <div class="flex flex-col items-center justify-center space-y-1.5 py-6">
                                    <svg class="w-8 h-8 text-content-muted/40" aria-hidden="true" viewBox="0 0 24 24" fill="currentColor">
                                        <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55c-2.21 0-4 1.79-4 4s1.79 4 4 4s4-1.79 4-4V7h4V3z"/>
                                    </svg>
                                    <span class="text-xs font-mono text-content-muted">В текущем каталоге нет аудиофайлов</span>
                                    <button
                                        type="button"
                                        @click="$store.app.activeTab = 'downloader'"
                                        class="text-xs text-white hover:underline mt-0.5 font-medium">
                                        Перейти в Загрузчик для добавления треков →
                                    </button>
                                </div>
                            </template>
                        </td>
                    </tr>
                </template>

                <!-- Строки треков (Плотный список, h-11 / 48px) -->
                <template x-for="track in paginatedTracks" :key="track.path || track._trackIndex">
                    <tr
                        @click="selectRow(track._trackIndex, $event)"
                        class="hover:bg-white/[0.03] transition-colors cursor-pointer group h-11"
                        :class="{
                            'bg-white/[0.08] text-white font-medium': isTrackSelected(track._trackIndex),
                            'border-l-2 border-amber-400 bg-amber-500/[0.03]': isTrackDirty(track._trackIndex) && !isTrackSelected(track._trackIndex)
                        }">
                        
                        <!-- Чекбокс выбора -->
                        <td class="py-1 px-1 sm:px-2 text-center" @click.stop>
                            <label class="touch-target-44 sm:h-auto sm:w-auto flex items-center justify-center cursor-pointer m-0">
                                <input
                                    type="checkbox"
                                    :checked="isTrackSelected(track._trackIndex)"
                                    @click="selectRow(track._trackIndex, $event)"
                                    :aria-label="'Выбрать трек ' + (track.title || track.name)"
                                    class="rounded-sm bg-surface-input border-surface-border text-white focus:ring-0 cursor-pointer w-4 h-4 sm:w-3.5 sm:h-3.5">
                            </label>
                        </td>

                        <!-- Воспроизведение трека в аудиоплеере -->
                        <td class="py-1 px-1 text-center" @click.stop>
                            <div class="touch-target-44 sm:h-auto sm:w-auto flex items-center justify-center">
                                <button
                                    type="button"
                                    @click="$store.player.playTrack(track, tracks)"
                                    :aria-label="'Воспроизвести ' + (track.title || track.name)"
                                    class="w-7 h-7 sm:w-6 sm:h-6 rounded-full bg-surface-elevated hover:bg-white hover:text-zinc-950 text-content-secondary flex items-center justify-center transition border border-surface-border shadow-xs">
                                    <svg class="w-3 h-3 sm:w-2.5 sm:h-2.5 translate-x-0.5" aria-hidden="true" viewBox="0 0 24 24" fill="currentColor">
                                        <path d="M8 5v14l11-7z"/>
                                    </svg>
                                </button>
                            </div>
                        </td>

                        <!-- Обложка -->
                        <td class="hidden md:table-cell py-1 px-1.5 text-center">
                            <div class="w-7 h-7 rounded-sm bg-surface-input border border-surface-border overflow-hidden mx-auto flex items-center justify-center shadow-xs">
                                <template x-if="track.cover_preview_url">
                                    <img :src="track.cover_preview_url" alt="" class="w-full h-full object-cover">
                                </template>
                                <template x-if="!track.cover_preview_url">
                                    <svg class="w-3.5 h-3.5 text-content-muted/40" aria-hidden="true" viewBox="0 0 24 24" fill="currentColor">
                                        <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55c-2.21 0-4 1.79-4 4s1.79 4 4 4s4-1.79 4-4V7h4V3z"/>
                                    </svg>
                                </template>
                            </div>
                        </td>

                        <!-- Номер трека (Track #) -->
                        <td
                            class="hidden md:table-cell py-1.5 px-2 text-center font-mono tabular-nums text-xs"
                            :class="isCellDirty(track._trackIndex, 'track_number') ? 'text-amber-400 font-bold bg-amber-500/10' : ''"
                            @dblclick="startEdit(track._trackIndex, 'track_number', $event)">
                            <template x-if="editingCell && editingCell.index === track._trackIndex && editingCell.field === 'track_number'">
                                <input
                                    x-ref="cellEditorInput"
                                    type="text"
                                    x-model="editingCell.value"
                                    @blur="saveEdit()"
                                    @keydown="onCellKeyDown($event)"
                                    aria-label="Редактировать номер трека"
                                    class="w-10 bg-surface-input text-white border border-white/40 rounded-sm px-1 py-0.5 text-center text-xs font-mono outline-none">
                            </template>
                            <template x-if="!(editingCell && editingCell.index === track._trackIndex && editingCell.field === 'track_number')">
                                <span x-text="track.track_number ? String(track.track_number).padStart(2, '0') : '—'"></span>
                            </template>
                        </td>

                        <!-- Номер диска (Disc #) — скрыт на мобилке -->
                        <td
                            class="hidden md:table-cell py-1.5 px-2 text-center font-mono tabular-nums text-xs"
                            :class="isCellDirty(track._trackIndex, 'disc_number') ? 'text-amber-400 font-bold bg-amber-500/10' : ''"
                            @dblclick="startEdit(track._trackIndex, 'disc_number', $event)">
                            <template x-if="editingCell && editingCell.index === track._trackIndex && editingCell.field === 'disc_number'">
                                <input
                                    x-ref="cellEditorInput"
                                    type="text"
                                    x-model="editingCell.value"
                                    @blur="saveEdit()"
                                    @keydown="onCellKeyDown($event)"
                                    aria-label="Редактировать номер диска"
                                    class="w-10 bg-surface-input text-white border border-white/40 rounded-sm px-1 py-0.5 text-center text-xs font-mono outline-none">
                            </template>
                            <template x-if="!(editingCell && editingCell.index === track._trackIndex && editingCell.field === 'disc_number')">
                                <span x-text="track.disc_number || '1'"></span>
                            </template>
                        </td>

                        <!-- Название (Title) + подстрочник на мобилке -->
                        <td
                            class="py-1.5 px-3 min-w-[150px] max-w-[220px] sm:max-w-none"
                            :class="isCellDirty(track._trackIndex, 'title') ? 'text-amber-400 font-bold bg-amber-500/10' : ''"
                            @dblclick="startEdit(track._trackIndex, 'title', $event)">
                            <template x-if="editingCell && editingCell.index === track._trackIndex && editingCell.field === 'title'">
                                <input
                                    x-ref="cellEditorInput"
                                    type="text"
                                    x-model="editingCell.value"
                                    @blur="saveEdit()"
                                    @keydown="onCellKeyDown($event)"
                                    aria-label="Редактировать название трека"
                                    class="w-full bg-surface-input text-white border border-white/40 rounded-sm px-1.5 py-0.5 text-xs outline-none">
                            </template>
                            <template x-if="!(editingCell && editingCell.index === track._trackIndex && editingCell.field === 'title')">
                                <div>
                                    <span class="truncate block text-xs font-medium text-white" x-text="track.title || '—'"></span>
                                    <!-- Подстрочник метаданных для мобильных (< 768px) -->
                                    <div class="md:hidden text-xs text-content-muted font-mono truncate">
                                        <span x-text="track.artist || '—'"></span>
                                        <template x-if="track.album">
                                            <span x-text="` • ${track.album}`"></span>
                                        </template>
                                        <template x-if="track.bitrate">
                                            <span x-text="` • ${track.bitrate}k`"></span>
                                        </template>
                                    </div>
                                </div>
                            </template>
                        </td>

                        <!-- Исполнитель (Artist) — десктоп -->
                        <td
                            class="hidden md:table-cell py-1.5 px-3 min-w-[130px]"
                            :class="isCellDirty(track._trackIndex, 'artist') ? 'text-amber-400 font-bold bg-amber-500/10' : ''"
                            @dblclick="startEdit(track._trackIndex, 'artist', $event)">
                            <template x-if="editingCell && editingCell.index === track._trackIndex && editingCell.field === 'artist'">
                                <input
                                    x-ref="cellEditorInput"
                                    type="text"
                                    x-model="editingCell.value"
                                    @blur="saveEdit()"
                                    @keydown="onCellKeyDown($event)"
                                    aria-label="Редактировать исполнителя"
                                    class="w-full bg-surface-input text-white border border-white/40 rounded-sm px-1.5 py-0.5 text-xs outline-none">
                            </template>
                            <template x-if="!(editingCell && editingCell.index === track._trackIndex && editingCell.field === 'artist')">
                                <span class="truncate block text-xs" x-text="track.artist || '—'"></span>
                            </template>
                        </td>

                        <!-- Альбом (Album) — десктоп lg -->
                        <td
                            class="hidden lg:table-cell py-1.5 px-3 min-w-[130px]"
                            :class="isCellDirty(track._trackIndex, 'album') ? 'text-amber-400 font-bold bg-amber-500/10' : ''"
                            @dblclick="startEdit(track._trackIndex, 'album', $event)">
                            <template x-if="editingCell && editingCell.index === track._trackIndex && editingCell.field === 'album'">
                                <input
                                    x-ref="cellEditorInput"
                                    type="text"
                                    x-model="editingCell.value"
                                    @blur="saveEdit()"
                                    @keydown="onCellKeyDown($event)"
                                    aria-label="Редактировать альбом"
                                    class="w-full bg-surface-input text-white border border-white/40 rounded-sm px-1.5 py-0.5 text-xs outline-none">
                            </template>
                            <template x-if="!(editingCell && editingCell.index === track._trackIndex && editingCell.field === 'album')">
                                <span class="truncate block text-xs text-content-muted" x-text="track.album || '—'"></span>
                            </template>
                        </td>

                        <!-- Год (Year) — скрыт на мобилке -->
                        <td
                            class="hidden md:table-cell py-1.5 px-2 text-center font-mono tabular-nums text-xs"
                            :class="isCellDirty(track._trackIndex, 'year') ? 'text-amber-400 font-bold bg-amber-500/10' : ''"
                            @dblclick="startEdit(track._trackIndex, 'year', $event)">
                            <template x-if="editingCell && editingCell.index === track._trackIndex && editingCell.field === 'year'">
                                <input
                                    x-ref="cellEditorInput"
                                    type="text"
                                    x-model="editingCell.value"
                                    @blur="saveEdit()"
                                    @keydown="onCellKeyDown($event)"
                                    aria-label="Редактировать год выпуска"
                                    class="w-14 bg-surface-input text-white border border-white/40 rounded-sm px-1 py-0.5 text-center text-xs font-mono outline-none">
                            </template>
                            <template x-if="!(editingCell && editingCell.index === track._trackIndex && editingCell.field === 'year')">
                                <span x-text="track.year || '—'"></span>
                            </template>
                        </td>

                        <!-- Жанр (Genre) — скрыт на мобилке -->
                        <td
                            class="hidden lg:table-cell py-1.5 px-2.5 min-w-[90px]"
                            :class="isCellDirty(track._trackIndex, 'genre') ? 'text-amber-400 font-bold bg-amber-500/10' : ''"
                            @dblclick="startEdit(track._trackIndex, 'genre', $event)">
                            <template x-if="editingCell && editingCell.index === track._trackIndex && editingCell.field === 'genre'">
                                <input
                                    x-ref="cellEditorInput"
                                    type="text"
                                    x-model="editingCell.value"
                                    @blur="saveEdit()"
                                    @keydown="onCellKeyDown($event)"
                                    aria-label="Редактировать жанр"
                                    class="w-full bg-surface-input text-white border border-white/40 rounded-sm px-1.5 py-0.5 text-xs outline-none">
                            </template>
                            <template x-if="!(editingCell && editingCell.index === track._trackIndex && editingCell.field === 'genre')">
                                <span class="truncate block text-xs text-content-muted" x-text="track.genre || '—'"></span>
                            </template>
                        </td>

                        <!-- Битрейт — скрыт на мобилке -->
                        <td class="hidden md:table-cell py-1.5 px-2 text-right font-mono tabular-nums text-xs text-content-muted">
                            <span x-text="track.bitrate ? `${track.bitrate}k` : '320k'"></span>
                        </td>

                        <!-- Время -->
                        <td class="py-1.5 px-2 text-right font-mono tabular-nums text-xs text-content-secondary" x-text="formatDuration(track.duration)"></td>

                        <!-- Статус текста (Lyrics) — скрыт на самых узких экранах -->
                        <td class="hidden sm:table-cell py-1.5 px-2 text-center">
                            <span
                                class="badge-studio text-xs py-0.5 px-1.5 border uppercase inline-block font-mono"
                                :class="{
                                    'text-white border-white/30': track.lyrics_status === 'lrc',
                                    'text-sky-300 border-sky-500/30': track.lyrics_status === 'txt',
                                    'text-content-muted/50 border-transparent': track.lyrics_status === 'none' || !track.lyrics_status
                                }"
                                x-text="track.lyrics_status === 'lrc' ? 'LRC' : (track.lyrics_status === 'txt' ? 'TXT' : '—')">
                            </span>
                        </td>

                        <!-- Имя файла на диске -->
                        <td class="hidden xl:table-cell py-1.5 px-3 font-mono text-xs text-content-muted truncate max-w-xs" x-text="track.name"></td>

                        <!-- Действия над треком: десктопные кнопки при ховере и мобильное контекстное меню -->
                        <td class="py-1 px-1 sm:px-2 text-center" @click.stop>
                            <!-- Десктопные кнопки при наведении (md:flex) -->
                            <div class="hidden md:flex opacity-0 group-hover:opacity-100 focus-within:opacity-100 transition-opacity items-center justify-center space-x-1">
                                <button
                                    type="button"
                                    @click="promptRedownloadTrack(track)"
                                    title="Скачать трек заново (поставить в загрузки)"
                                    :aria-label="'Скачать заново ' + (track.title || track.name)"
                                    class="w-6 h-6 rounded-sm bg-surface-elevated hover:bg-white hover:text-zinc-950 text-content-muted flex items-center justify-center transition border border-surface-border shadow-xs">
                                    <svg class="w-3.5 h-3.5" aria-hidden="true" viewBox="0 0 24 24" fill="currentColor">
                                        <path d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6c0 1.01-.25 1.97-.7 2.8l1.46 1.46A7.93 7.93 0 0 0 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6c0-1.01.25-1.97.7-2.8L5.24 7.74A7.93 7.93 0 0 0 4 12c0 4.42 3.58 8 8 8v3l4-4l-4-4v3z"/>
                                    </svg>
                                </button>
                                <button
                                    type="button"
                                    @click="promptDeleteTrack(track)"
                                    title="Удалить трек с диска"
                                    :aria-label="'Удалить трек ' + (track.title || track.name)"
                                    class="w-6 h-6 rounded-sm bg-surface-elevated hover:bg-rose-500/20 text-content-muted hover:text-rose-300 flex items-center justify-center transition border border-surface-border hover:border-rose-500/40 shadow-xs">
                                    <svg class="w-3.5 h-3.5" aria-hidden="true" viewBox="0 0 24 24" fill="currentColor">
                                        <path d="M7 21q-.825 0-1.412-.587T5 19V6q-.425 0-.712-.288T4 5t.288-.712T5 4h4q0-.425.288-.712T10 3h4q.425 0 .713.288T15 4h4q.425 0 .713.288T20 5t-.288.713T19 6v13q0 .825-.587 1.413T17 21zm3.713-4.288Q11 16.426 11 16V9q0-.425-.288-.712T10 8t-.712.288T9 9v7q0 .425.288.713T10 17t.713-.288m4 0Q15 16.426 15 16V9q0-.425-.288-.712T14 8t-.712.288T13 9v7q0 .425.288.713T14 17t.713-.288"/>
                                    </svg>
                                </button>
                            </div>

                            <!-- Мобильное контекстное меню (md:hidden) -->
                            <div class="relative md:hidden flex justify-center">
                                <button
                                    type="button"
                                    @click.stop="toggleMobileTrackMenu(track._trackIndex)"
                                    class="touch-target-44 p-2 text-content-muted hover:text-white rounded-md flex items-center justify-center transition"
                                    title="Действия над треком"
                                    :aria-label="'Действия над треком ' + (track.title || track.name)">
                                    <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor">
                                        <path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/>
                                    </svg>
                                </button>

                                <!-- Выпадающий список мобильного меню -->
                                <div
                                    x-show="mobileTrackMenuIndex === track._trackIndex"
                                    @click.outside="closeMobileTrackMenu()"
                                    x-transition:enter="transition ease-out duration-150"
                                    x-transition:enter-start="opacity-0 scale-95"
                                    x-transition:enter-end="opacity-100 scale-100"
                                    x-transition:leave="transition ease-in duration-100"
                                    x-transition:leave-start="opacity-100 scale-100"
                                    x-transition:leave-end="opacity-0 scale-95"
                                    class="absolute right-0 top-full mt-1 w-48 rounded-md bg-surface-elevated border border-surface-border shadow-panel py-1 z-30 divide-y divide-white/[0.06] text-left"
                                    x-cloak>
                                    <div class="py-1">
                                        <button
                                            type="button"
                                            @click="openTrackInInspector(track._trackIndex, $event)"
                                            class="w-full text-left px-3 py-2 text-xs text-white hover:bg-white/[0.06] flex items-center space-x-2">
                                            <svg class="w-3.5 h-3.5 text-zinc-300" viewBox="0 0 24 24" fill="currentColor"><path d="m21.4 14.25l-7.15 7.15q-.3.3-.675.45t-.75.15t-.75-.15t-.675-.45l-8.825-8.825q-.275-.275-.425-.637T2 11.175V4q0-.825.588-1.412T4 2h7.175q.4 0 .775.163t.65.437l8.8 8.825q.3.3.438.675t.137.75t-.137.738t-.438.662M6.5 8q.625 0 1.063-.437T8 6.5t-.437-1.062T6.5 5t-1.062.438T5 6.5t.438 1.063T6.5 8"/></svg>
                                            <span>Редактировать теги</span>
                                        </button>
                                        <button
                                            type="button"
                                            @click="closeMobileTrackMenu(); $store.app.openLyricsModal(track)"
                                            class="w-full text-left px-3 py-2 text-xs text-content-primary hover:bg-white/[0.06] flex items-center space-x-2">
                                            <svg class="w-3.5 h-3.5 text-zinc-300" viewBox="0 0 24 24" fill="currentColor"><path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55c-2.21 0-4 1.79-4 4s1.79 4 4 4s4-1.79 4-4V7h4V3z"/></svg>
                                            <span>Текст песни (.lrc)</span>
                                        </button>
                                        <button
                                            type="button"
                                            @click="closeMobileTrackMenu(); promptRedownloadTrack(track)"
                                            class="w-full text-left px-3 py-2 text-xs text-content-primary hover:bg-white/[0.06] flex items-center space-x-2">
                                            <svg class="w-3.5 h-3.5 text-zinc-300" viewBox="0 0 24 24" fill="currentColor"><path d="M12 4V1L8 5l4 4V6c3.31 0 6 2.69 6 6c0 1.01-.25 1.97-.7 2.8l1.46 1.46A7.93 7.93 0 0 0 20 12c0-4.42-3.58-8-8-8zm0 14c-3.31 0-6-2.69-6-6c0-1.01.25-1.97.7-2.8L5.24 7.74A7.93 7.93 0 0 0 4 12c0 4.42 3.58 8 8 8v3l4-4l-4-4v3z"/></svg>
                                            <span>Перекачать заново</span>
                                        </button>
                                    </div>
                                    <div class="py-1">
                                        <button
                                            type="button"
                                            @click="closeMobileTrackMenu(); promptDeleteTrack(track)"
                                            class="w-full text-left px-3 py-2 text-xs text-rose-300 hover:bg-rose-500/10 flex items-center space-x-2">
                                            <svg class="w-3.5 h-3.5 text-rose-400" viewBox="0 0 24 24" fill="currentColor"><path d="M7 21q-.825 0-1.412-.587T5 19V6q-.425 0-.712-.288T4 5t.288-.712T5 4h4q0-.425.288-.712T10 3h4q.425 0 .713.288T15 4h4q.425 0 .713.288T20 5t-.288.713T19 6v13q0 .825-.587 1.413T17 21zm3.713-4.288Q11 16.426 11 16V9q0-.425-.288-.712T10 8t-.712.288T9 9v7q0 .425.288.713T10 17t.713-.288m4 0Q15 16.426 15 16V9q0-.425-.288-.712T14 8t-.712.288T13 9v7q0 .425.288.713T14 17t.713-.288"/></svg>
                                            <span>Удалить с диска</span>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </td>
                    </tr>
                </template>
            </tbody>
        </table>
    </div>

    <!-- Действия с выбранными треками -->
    <div x-show="selectedTracksCount > 0"
         class="flex flex-wrap items-center gap-2 border-t border-surface-border px-3 py-2"
         x-cloak>
        <div class="flex items-center space-x-1.5 text-xs text-white font-medium pr-2 border-r border-surface-border">
            <span>Выбрано:</span>
            <span class="font-bold font-mono text-white tabular-nums" x-text="selectedTracksCount"></span>
        </div>
        <button type="button"
                @click="openMobileTagInspector()"
                class="touch-target-44 sm:h-8 px-2.5 sm:px-3 rounded-md bg-white hover:bg-zinc-200 text-zinc-950 font-semibold text-xs transition flex items-center space-x-1.5 shadow-xs"
                title="Редактировать теги выбранных треков">
            <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor"><path d="m21.4 14.25l-7.15 7.15q-.3.3-.675.45t-.75.15t-.75-.15t-.675-.45l-8.825-8.825q-.275-.275-.425-.637T2 11.175V4q0-.825.588-1.412T4 2h7.175q.4 0 .775.163t.65.437l8.8 8.825q.3.3.438.675t.137.75t-.137.738t-.438.662M6.5 8q.625 0 1.063-.437T8 6.5t-.437-1.062T6.5 5t-1.062.438T5 6.5t.438 1.063T6.5 8"/></svg>
            <span>Теги</span>
        </button>
        <button type="button"
                @click="promptDeleteSelected()"
                class="touch-target-44 sm:h-8 px-2.5 sm:px-3 rounded-md bg-rose-500/20 hover:bg-rose-500/30 text-rose-300 font-semibold text-xs border border-rose-500/40 transition flex items-center space-x-1.5"
                title="Удалить выбранные треки с диска">
            <svg class="w-3.5 h-3.5 text-rose-400" viewBox="0 0 24 24" fill="currentColor"><path d="M7 21q-.825 0-1.412-.587T5 19V6q-.425 0-.712-.288T4 5t.288-.712T5 4h4q0-.425.288-.712T10 3h4q.425 0 .713.288T15 4h4q.425 0 .713.288T20 5t-.288.713T19 6v13q0 .825-.587 1.413T17 21zm3.713-4.288Q11 16.426 11 16V9q0-.425-.288-.712T10 8t-.712.288T9 9v7q0 .425.288.713T10 17t.713-.288m4 0Q15 16.426 15 16V9q0-.425-.288-.712T14 8t-.712.288T13 9v7q0 .425.288.713T14 17t.713-.288"/></svg>
            <span class="hidden sm:inline">Удалить</span>
            <span class="sm:hidden">Уд.</span>
        </button>
        <button type="button"
                @click="clearTrackSelection()"
                class="touch-target-44 sm:h-8 px-2 text-content-muted hover:text-white text-xs transition"
                title="Снять выбор">
            ✕
        </button>
    </div>

    <!-- Нижняя строка состояния (Status Bar) -->
    <div class="bg-surface-panel border-t border-surface-border px-3 sm:px-4 py-1.5 flex flex-wrap items-center justify-between text-xs font-mono text-content-muted gap-2">
        <div class="flex items-center space-x-3">
            <span>
                Выбрано: <strong class="text-white" x-text="selectedTracksCount"></strong> из <strong class="text-white" x-text="tracks.length"></strong>
            </span>
            <template x-if="selectedTracksCount > 0">
                <span>
                    Длительность: <strong class="text-white" x-text="selectedTracksDuration"></strong>
                </span>
            </template>
        </div>

        <!-- Панель пагинации -->
        <div class="flex items-center space-x-2" x-show="totalFiltered > 0">
            <span class="text-content-secondary hidden sm:inline" x-text="`Показано ${paginationInfo}`"></span>
            <div class="flex items-center space-x-1" x-show="totalPages > 1">
                <button
                    type="button"
                    @click="setPage(1)"
                    :disabled="currentPage === 1"
                    title="В начало"
                    aria-label="Перейти на первую страницу"
                    class="px-2 py-0.5 bg-surface-elevated hover:bg-surface-hover disabled:opacity-30 rounded-sm border border-surface-border text-white text-xs transition">
                    «
                </button>
                <button
                    type="button"
                    @click="prevPage()"
                    :disabled="currentPage === 1"
                    title="Назад"
                    aria-label="Перейти на предыдущую страницу"
                    class="px-2 py-0.5 bg-surface-elevated hover:bg-surface-hover disabled:opacity-30 rounded-sm border border-surface-border text-white text-xs transition">
                    ‹
                </button>
                <span class="px-1 text-xs text-white font-semibold tabular-nums">
                    <span x-text="currentPage"></span> / <span x-text="totalPages"></span>
                </span>
                <button
                    type="button"
                    @click="nextPage()"
                    :disabled="currentPage === totalPages"
                    title="Вперед"
                    aria-label="Перейти на следующую страницу"
                    class="px-2 py-0.5 bg-surface-elevated hover:bg-surface-hover disabled:opacity-30 rounded-sm border border-surface-border text-white text-xs transition">
                    ›
                </button>
                <button
                    type="button"
                    @click="setPage(totalPages)"
                    :disabled="currentPage === totalPages"
                    title="В конец"
                    aria-label="Перейти на последнюю страницу"
                    class="px-2 py-0.5 bg-surface-elevated hover:bg-surface-hover disabled:opacity-30 rounded-sm border border-surface-border text-white text-xs transition">
                    »
                </button>
            </div>
            <div class="flex items-center space-x-1 ml-1">
                <span class="hidden md:inline text-xs">На стр:</span>
                <select
                    x-model="pageSize"
                    @change="currentPage = 1"
                    aria-label="Количество треков на странице"
                    class="bg-surface-elevated text-content-primary text-xs rounded-sm px-1 py-0.5 border border-surface-border outline-none transition cursor-pointer">
                    <option value="50">50</option>
                    <option value="100">100</option>
                    <option value="200">200</option>
                    <option value="500">500</option>
                    <option value="0">Все</option>
                </select>
            </div>
        </div>

        <div class="flex items-center space-x-3">
            <template x-if="hasDirtyChanges">
                <span class="text-amber-300 font-semibold flex items-center space-x-1">
                    <span class="w-1.5 h-1.5 rounded-full bg-amber-400 animate-pulse"></span>
                    <span>Не сохранено: <strong x-text="dirtyIndices.size"></strong></span>
                </span>
            </template>
            <span class="hidden sm:inline text-xs">Ctrl+S</span>
        </div>
    </div>
</div>
{{ end }}
