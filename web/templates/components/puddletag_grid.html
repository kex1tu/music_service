{{ define "puddletag_grid" }}
<!-- ==================== ИНТЕРАКТИВНАЯ ТАБЛИЦА-СЕТКА (SPREADSHEET DATA GRID) ==================== -->
<div class="flex-1 flex flex-col bg-surface-panel border border-surface-border rounded-xl overflow-hidden shadow-xl min-w-0">
    <div class="flex-1 overflow-x-auto overflow-y-auto max-h-[calc(100vh-250px)] relative select-none">
        <table class="w-full text-left text-xs text-content-secondary border-collapse table-auto min-w-[1100px]">
            <!-- Липкая шапка таблицы (Sticky Header) -->
            <thead class="sticky top-0 z-20 bg-surface-base/95 backdrop-blur-sm text-[11px] font-mono uppercase tracking-wider text-content-muted border-b border-surface-border">
                <tr>
                    <th class="py-2.5 px-2 w-8 text-center">
                        <input
                            type="checkbox"
                            :checked="isAllSelected"
                            @click="toggleSelectAll()"
                            class="rounded bg-surface-input border-surface-border text-brand focus:ring-0 cursor-pointer">
                    </th>
                    <th class="py-2.5 px-1.5 w-8 text-center" title="Воспроизвести">▶</th>
                    <th class="py-2.5 px-1.5 w-10 text-center" title="Обложка">Арт</th>
                    <th class="py-2.5 px-2 w-12 text-center cursor-pointer hover:text-brand transition" @click="sortColumn = 'track_number'; sortAsc = !sortAsc">
                        # <span x-show="sortColumn === 'track_number'" x-text="sortAsc ? '▲' : '▼'"></span>
                    </th>
                    <th class="py-2.5 px-2 w-12 text-center cursor-pointer hover:text-brand transition" @click="sortColumn = 'disc_number'; sortAsc = !sortAsc">
                        Диск
                    </th>
                    <th class="py-2.5 px-3 min-w-[180px] cursor-pointer hover:text-brand transition" @click="sortColumn = 'title'; sortAsc = !sortAsc">
                        Название композиции <span x-show="sortColumn === 'title'" x-text="sortAsc ? '▲' : '▼'"></span>
                    </th>
                    <th class="py-2.5 px-3 min-w-[150px] cursor-pointer hover:text-brand transition" @click="sortColumn = 'artist'; sortAsc = !sortAsc">
                        Исполнитель <span x-show="sortColumn === 'artist'" x-text="sortAsc ? '▲' : '▼'"></span>
                    </th>
                    <th class="py-2.5 px-3 min-w-[150px] cursor-pointer hover:text-brand transition" @click="sortColumn = 'album'; sortAsc = !sortAsc">
                        Альбом <span x-show="sortColumn === 'album'" x-text="sortAsc ? '▲' : '▼'"></span>
                    </th>
                    <th class="py-2.5 px-2 w-16 text-center cursor-pointer hover:text-brand transition" @click="sortColumn = 'year'; sortAsc = !sortAsc">
                        Год <span x-show="sortColumn === 'year'" x-text="sortAsc ? '▲' : '▼'"></span>
                    </th>
                    <th class="py-2.5 px-2.5 min-w-[110px] cursor-pointer hover:text-brand transition" @click="sortColumn = 'genre'; sortAsc = !sortAsc">
                        Жанр
                    </th>
                    <th class="py-2.5 px-2 text-right w-16 font-mono" title="Битрейт">Кбит</th>
                    <th class="py-2.5 px-2 text-right w-16 font-mono cursor-pointer hover:text-brand transition" @click="sortColumn = 'duration'; sortAsc = !sortAsc">
                        Время
                    </th>
                    <th class="py-2.5 px-2 text-center w-14 font-mono" title="Текст песни">LRC</th>
                    <th class="py-2.5 px-3 min-w-[180px] font-mono text-content-muted">Имя файла</th>
                    <th class="py-2.5 px-2 text-center w-10 font-mono text-content-muted" title="Удалить трек">Уд.</th>
                </tr>
            </thead>

            <!-- Тело таблицы со строками файлов -->
            <tbody class="divide-y divide-surface-borderSubtle bg-surface-panel/30 font-sans">
                <!-- Пустое состояние или Просмотр подкаталогов -->
                <template x-if="displayTracks.length === 0 && !isLoading">
                    <tr>
                        <td colspan="15" class="py-10 px-4 text-center text-content-muted">
                            <!-- Если в текущей папке есть подкаталоги (например, в корне медиатеки) -->
                            <template x-if="directories && directories.length > 0">
                                <div class="space-y-4 max-w-3xl mx-auto py-2">
                                    <div class="flex flex-col items-center justify-center space-y-1">
                                        <div class="text-sm font-bold text-content-primary">В этой папке находятся подкаталоги исполнителей и альбомов:</div>
                                        <div class="text-xs text-content-muted">Выберите нужную папку для перехода или нажмите кнопку ниже, чтобы загрузить сразу все треки</div>
                                    </div>

                                    <!-- Кнопка рекурсивного открытия всей медиатеки в сетку -->
                                    <div class="pt-1">
                                        <button
                                            type="button"
                                            @click="recursiveMode = true; loadDirectory(currentPath)"
                                            class="px-6 py-2.5 bg-brand hover:bg-brand-hover text-white text-xs font-bold rounded-xl transition shadow-md shadow-brand/20 active:scale-95 inline-flex items-center space-x-2">
                                            <span>⚡ Загрузить все треки в таблицу (Включить «Включая подпапки»)</span>
                                        </button>
                                    </div>

                                    <!-- Поиск по каталогам, если их много -->
                                    <template x-if="directories.length > 9">
                                        <div class="max-w-md mx-auto pt-2">
                                            <input
                                                type="text"
                                                x-model="dirFilter"
                                                placeholder="Быстрый поиск папки..."
                                                class="w-full bg-surface-elevated text-content-primary text-xs rounded-lg px-3 py-1.5 border border-surface-border focus:border-brand outline-none transition font-mono">
                                        </div>
                                    </template>

                                    <!-- Сетка папок -->
                                    <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-2.5 text-left pt-1 max-h-96 overflow-y-auto p-1">
                                        <template x-for="dir in visibleDirectories" :key="dir.path">
                                            <div class="p-3 bg-surface-elevated hover:bg-surface-hover hover:border-brand/70 border border-surface-border rounded-xl flex items-center space-x-3 transition group shadow-sm text-left">
                                                <button
                                                    type="button"
                                                    @click="navigateTo(dir.path)"
                                                    class="flex items-center space-x-3 flex-1 min-w-0 text-left active:scale-95 transition">
                                                    <div class="w-9 h-9 rounded-lg bg-surface-input flex items-center justify-center text-amber-400 group-hover:scale-110 transition shrink-0">
                                                        <svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor">
                                                            <path d="M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/>
                                                        </svg>
                                                    </div>
                                                    <div class="min-w-0 flex-1">
                                                        <div class="font-bold text-content-primary group-hover:text-brand truncate text-xs" x-text="dir.name"></div>
                                                        <div class="text-[11px] text-content-muted font-mono" x-text="dir.track_count !== undefined ? `${dir.track_count} треков` : 'Папка'"></div>
                                                    </div>
                                                </button>
                                                <button
                                                    type="button"
                                                    @click.stop="promptDeleteDirectory(dir)"
                                                    title="Удалить папку"
                                                    class="w-7 h-7 rounded-lg text-content-muted hover:text-red-400 hover:bg-red-500/15 flex items-center justify-center transition shrink-0">
                                                    <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor">
                                                        <path d="M7 21q-.825 0-1.412-.587T5 19V6q-.425 0-.712-.288T4 5t.288-.712T5 4h4q0-.425.288-.712T10 3h4q.425 0 .713.288T15 4h4q.425 0 .713.288T20 5t-.288.713T19 6v13q0 .825-.587 1.413T17 21zm3.713-4.288Q11 16.426 11 16V9q0-.425-.288-.712T10 8t-.712.288T9 9v7q0 .425.288.713T10 17t.713-.288m4 0Q15 16.426 15 16V9q0-.425-.288-.712T14 8t-.712.288T13 9v7q0 .425.288.713T14 17t.713-.288"/>
                                                    </svg>
                                                </button>
                                            </div>
                                        </template>
                                    </div>
                                </div>
                            </template>

                            <!-- Если действительно пустая папка -->
                            <template x-if="!(directories && directories.length > 0)">
                                <div class="flex flex-col items-center justify-center space-y-2 py-8">
                                    <svg class="w-10 h-10 text-content-muted/40" viewBox="0 0 24 24" fill="currentColor">
                                        <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55c-2.21 0-4 1.79-4 4s1.79 4 4 4s4-1.79 4-4V7h4V3z"/>
                                    </svg>
                                    <span class="text-xs font-mono">В текущем каталоге нет аудиофайлов</span>
                                    <button
                                        type="button"
                                        @click="$store.app.activeTab = 'downloader'"
                                        class="text-xs text-brand hover:underline mt-1 font-medium">
                                        Перейти в Загрузчик для добавления треков →
                                    </button>
                                </div>
                            </template>
                        </td>
                    </tr>
                </template>

                <!-- Строки треков -->
                <template x-for="track in paginatedTracks" :key="track.path || track._trackIndex">
                    <tr
                        @click="selectRow(track._trackIndex, $event)"
                        class="hover:bg-surface-elevated/70 transition-colors cursor-pointer group"
                        :class="{
                            'bg-brand/15 text-white font-medium': isTrackSelected(track._trackIndex),
                            'border-l-2 border-brand bg-brand-muted/20': isTrackDirty(track._trackIndex) && !isTrackSelected(track._trackIndex)
                        }">
                        
                        <!-- Чекбокс выбора -->
                        <td class="py-1.5 px-2 text-center" @click.stop>
                            <input
                                type="checkbox"
                                :checked="isTrackSelected(track._trackIndex)"
                                @click="selectRow(track._trackIndex, $event)"
                                class="rounded bg-surface-input border-surface-border text-brand focus:ring-0 cursor-pointer">
                        </td>

                        <!-- Воспроизведение трека в аудиоплеере -->
                        <td class="py-1.5 px-1.5 text-center" @click.stop>
                            <button
                                type="button"
                                @click="$store.player.playTrack(track, tracks)"
                                class="w-6 h-6 rounded-full bg-surface-input hover:bg-brand text-content-secondary hover:text-white flex items-center justify-center transition border border-surface-border shadow-sm">
                                <svg class="w-3 h-3 translate-x-0.5" viewBox="0 0 24 24" fill="currentColor">
                                    <path d="M8 5v14l11-7z"/>
                                </svg>
                            </button>
                        </td>

                        <!-- Обложка -->
                        <td class="py-1 px-1.5 text-center">
                            <div class="w-7 h-7 rounded bg-surface-input border border-surface-border overflow-hidden mx-auto flex items-center justify-center shadow-sm">
                                <template x-if="track.cover_preview_url">
                                    <img :src="track.cover_preview_url" class="w-full h-full object-cover">
                                </template>
                                <template x-if="!track.cover_preview_url">
                                    <svg class="w-3.5 h-3.5 text-content-muted/50" viewBox="0 0 24 24" fill="currentColor">
                                        <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55c-2.21 0-4 1.79-4 4s1.79 4 4 4s4-1.79 4-4V7h4V3z"/>
                                    </svg>
                                </template>
                            </div>
                        </td>

                        <!-- Номер трека (Track #) -->
                        <td
                            class="py-1.5 px-2 text-center font-mono"
                            :class="isCellDirty(track._trackIndex, 'track_number') ? 'text-amber-400 font-bold bg-amber-500/10' : ''"
                            @dblclick="startEdit(track._trackIndex, 'track_number', $event)">
                            <template x-if="editingCell && editingCell.index === track._trackIndex && editingCell.field === 'track_number'">
                                <input
                                    x-ref="cellEditorInput"
                                    type="text"
                                    x-model="editingCell.value"
                                    @blur="saveEdit()"
                                    @keydown="onCellKeyDown($event)"
                                    class="w-10 bg-surface-input text-white border border-brand rounded px-1 py-0.5 text-center text-xs font-mono outline-none">
                            </template>
                            <template x-if="!(editingCell && editingCell.index === track._trackIndex && editingCell.field === 'track_number')">
                                <span x-text="track.track_number ? String(track.track_number).padStart(2, '0') : '—'"></span>
                            </template>
                        </td>

                        <!-- Номер диска (Disc #) -->
                        <td
                            class="py-1.5 px-2 text-center font-mono"
                            :class="isCellDirty(track._trackIndex, 'disc_number') ? 'text-amber-400 font-bold bg-amber-500/10' : ''"
                            @dblclick="startEdit(track._trackIndex, 'disc_number', $event)">
                            <template x-if="editingCell && editingCell.index === track._trackIndex && editingCell.field === 'disc_number'">
                                <input
                                    x-ref="cellEditorInput"
                                    type="text"
                                    x-model="editingCell.value"
                                    @blur="saveEdit()"
                                    @keydown="onCellKeyDown($event)"
                                    class="w-10 bg-surface-input text-white border border-brand rounded px-1 py-0.5 text-center text-xs font-mono outline-none">
                            </template>
                            <template x-if="!(editingCell && editingCell.index === track._trackIndex && editingCell.field === 'disc_number')">
                                <span x-text="track.disc_number || '1'"></span>
                            </template>
                        </td>

                        <!-- Название (Title) -->
                        <td
                            class="py-1.5 px-3 min-w-[180px]"
                            :class="isCellDirty(track._trackIndex, 'title') ? 'text-amber-400 font-bold bg-amber-500/10' : ''"
                            @dblclick="startEdit(track._trackIndex, 'title', $event)">
                            <template x-if="editingCell && editingCell.index === track._trackIndex && editingCell.field === 'title'">
                                <input
                                    x-ref="cellEditorInput"
                                    type="text"
                                    x-model="editingCell.value"
                                    @blur="saveEdit()"
                                    @keydown="onCellKeyDown($event)"
                                    class="w-full bg-surface-input text-white border border-brand rounded px-1.5 py-0.5 text-xs outline-none">
                            </template>
                            <template x-if="!(editingCell && editingCell.index === track._trackIndex && editingCell.field === 'title')">
                                <span class="truncate block" x-text="track.title || '—'"></span>
                            </template>
                        </td>

                        <!-- Исполнитель (Artist) -->
                        <td
                            class="py-1.5 px-3 min-w-[150px]"
                            :class="isCellDirty(track._trackIndex, 'artist') ? 'text-amber-400 font-bold bg-amber-500/10' : ''"
                            @dblclick="startEdit(track._trackIndex, 'artist', $event)">
                            <template x-if="editingCell && editingCell.index === track._trackIndex && editingCell.field === 'artist'">
                                <input
                                    x-ref="cellEditorInput"
                                    type="text"
                                    x-model="editingCell.value"
                                    @blur="saveEdit()"
                                    @keydown="onCellKeyDown($event)"
                                    class="w-full bg-surface-input text-white border border-brand rounded px-1.5 py-0.5 text-xs outline-none">
                            </template>
                            <template x-if="!(editingCell && editingCell.index === track._trackIndex && editingCell.field === 'artist')">
                                <span class="truncate block" x-text="track.artist || '—'"></span>
                            </template>
                        </td>

                        <!-- Альбом (Album) -->
                        <td
                            class="py-1.5 px-3 min-w-[150px]"
                            :class="isCellDirty(track._trackIndex, 'album') ? 'text-amber-400 font-bold bg-amber-500/10' : ''"
                            @dblclick="startEdit(track._trackIndex, 'album', $event)">
                            <template x-if="editingCell && editingCell.index === track._trackIndex && editingCell.field === 'album'">
                                <input
                                    x-ref="cellEditorInput"
                                    type="text"
                                    x-model="editingCell.value"
                                    @blur="saveEdit()"
                                    @keydown="onCellKeyDown($event)"
                                    class="w-full bg-surface-input text-white border border-brand rounded px-1.5 py-0.5 text-xs outline-none">
                            </template>
                            <template x-if="!(editingCell && editingCell.index === track._trackIndex && editingCell.field === 'album')">
                                <span class="truncate block" x-text="track.album || '—'"></span>
                            </template>
                        </td>

                        <!-- Год (Year) -->
                        <td
                            class="py-1.5 px-2 text-center font-mono"
                            :class="isCellDirty(track._trackIndex, 'year') ? 'text-amber-400 font-bold bg-amber-500/10' : ''"
                            @dblclick="startEdit(track._trackIndex, 'year', $event)">
                            <template x-if="editingCell && editingCell.index === track._trackIndex && editingCell.field === 'year'">
                                <input
                                    x-ref="cellEditorInput"
                                    type="text"
                                    x-model="editingCell.value"
                                    @blur="saveEdit()"
                                    @keydown="onCellKeyDown($event)"
                                    class="w-14 bg-surface-input text-white border border-brand rounded px-1 py-0.5 text-center text-xs font-mono outline-none">
                            </template>
                            <template x-if="!(editingCell && editingCell.index === track._trackIndex && editingCell.field === 'year')">
                                <span x-text="track.year || '—'"></span>
                            </template>
                        </td>

                        <!-- Жанр (Genre) -->
                        <td
                            class="py-1.5 px-2.5 min-w-[110px]"
                            :class="isCellDirty(track._trackIndex, 'genre') ? 'text-amber-400 font-bold bg-amber-500/10' : ''"
                            @dblclick="startEdit(track._trackIndex, 'genre', $event)">
                            <template x-if="editingCell && editingCell.index === track._trackIndex && editingCell.field === 'genre'">
                                <input
                                    x-ref="cellEditorInput"
                                    type="text"
                                    x-model="editingCell.value"
                                    @blur="saveEdit()"
                                    @keydown="onCellKeyDown($event)"
                                    class="w-full bg-surface-input text-white border border-brand rounded px-1.5 py-0.5 text-xs outline-none">
                            </template>
                            <template x-if="!(editingCell && editingCell.index === track._trackIndex && editingCell.field === 'genre')">
                                <span class="truncate block" x-text="track.genre || '—'"></span>
                            </template>
                        </td>

                        <!-- Битрейт -->
                        <td class="py-1.5 px-2 text-right font-mono text-[11px] text-content-muted">
                            <span x-text="track.bitrate ? `${track.bitrate}k` : '320k'"></span>
                        </td>

                        <!-- Время -->
                        <td class="py-1.5 px-2 text-right font-mono text-content-secondary" x-text="formatDuration(track.duration)"></td>

                        <!-- Статус текста (Lyrics) -->
                        <td class="py-1.5 px-2 text-center">
                            <span
                                class="text-[9px] font-mono font-bold px-1.5 py-0.5 rounded uppercase border inline-block"
                                :class="{
                                    'bg-brand-muted text-brand border-brand/30': track.lyrics_status === 'lrc',
                                    'bg-sky-500/10 text-sky-400 border-sky-500/30': track.lyrics_status === 'txt',
                                    'text-content-muted/40 border-transparent': track.lyrics_status === 'none' || !track.lyrics_status
                                }"
                                x-text="track.lyrics_status === 'lrc' ? 'LRC' : (track.lyrics_status === 'txt' ? 'TXT' : '—')">
                            </span>
                        </td>

                        <!-- Имя файла на диске -->
                        <td class="py-1.5 px-3 font-mono text-[11px] text-content-muted truncate max-w-xs" x-text="track.name"></td>

                        <!-- Удаление трека -->
                        <td class="py-1.5 px-2 text-center" @click.stop>
                            <button
                                type="button"
                                @click="promptDeleteTrack(track)"
                                title="Удалить трек с диска"
                                class="w-6 h-6 rounded bg-surface-input hover:bg-red-500/20 text-content-muted hover:text-red-400 flex items-center justify-center transition border border-surface-border hover:border-red-500/40 shadow-sm mx-auto">
                                <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor">
                                    <path d="M7 21q-.825 0-1.412-.587T5 19V6q-.425 0-.712-.288T4 5t.288-.712T5 4h4q0-.425.288-.712T10 3h4q.425 0 .713.288T15 4h4q.425 0 .713.288T20 5t-.288.713T19 6v13q0 .825-.587 1.413T17 21zm3.713-4.288Q11 16.426 11 16V9q0-.425-.288-.712T10 8t-.712.288T9 9v7q0 .425.288.713T10 17t.713-.288m4 0Q15 16.426 15 16V9q0-.425-.288-.712T14 8t-.712.288T13 9v7q0 .425.288.713T14 17t.713-.288"/>
                                </svg>
                            </button>
                        </td>
                    </tr>
                </template>
            </tbody>
        </table>
    </div>

    <!-- Нижняя строка состояния (Status Bar) -->
    <div class="bg-surface-base/90 border-t border-surface-border px-4 py-2 flex flex-wrap items-center justify-between text-xs font-mono text-content-muted gap-2">
        <div class="flex items-center space-x-3">
            <span>
                Выбрано: <strong class="text-content-primary" x-text="selectedTracksCount"></strong> из <strong class="text-content-primary" x-text="tracks.length"></strong>
            </span>
            <template x-if="selectedTracksCount > 0">
                <span>
                    Длительность: <strong class="text-brand" x-text="selectedTracksDuration"></strong>
                </span>
            </template>
        </div>

        <!-- Панель пагинации -->
        <div class="flex items-center space-x-2" x-show="totalFiltered > 0">
            <span class="text-content-secondary hidden sm:inline" x-text="`Показано ${paginationInfo}`"></span>
            <div class="flex items-center space-x-1" x-show="totalPages > 1">
                <button
                    type="button"
                    @click="setPage(1)"
                    :disabled="currentPage === 1"
                    title="В начало"
                    class="px-2 py-0.5 bg-surface-elevated hover:bg-surface-hover disabled:opacity-30 rounded border border-surface-border text-content-primary text-[11px] transition">
                    «
                </button>
                <button
                    type="button"
                    @click="prevPage()"
                    :disabled="currentPage === 1"
                    title="Назад"
                    class="px-2 py-0.5 bg-surface-elevated hover:bg-surface-hover disabled:opacity-30 rounded border border-surface-border text-content-primary text-[11px] transition">
                    ‹
                </button>
                <span class="px-1.5 text-[11px] text-content-primary font-bold">
                    <span x-text="currentPage"></span> / <span x-text="totalPages"></span>
                </span>
                <button
                    type="button"
                    @click="nextPage()"
                    :disabled="currentPage === totalPages"
                    title="Вперед"
                    class="px-2 py-0.5 bg-surface-elevated hover:bg-surface-hover disabled:opacity-30 rounded border border-surface-border text-content-primary text-[11px] transition">
                    ›
                </button>
                <button
                    type="button"
                    @click="setPage(totalPages)"
                    :disabled="currentPage === totalPages"
                    title="В конец"
                    class="px-2 py-0.5 bg-surface-elevated hover:bg-surface-hover disabled:opacity-30 rounded border border-surface-border text-content-primary text-[11px] transition">
                    »
                </button>
            </div>
            <div class="flex items-center space-x-1 ml-2">
                <span class="hidden md:inline text-[11px]">На стр:</span>
                <select
                    x-model="pageSize"
                    @change="currentPage = 1"
                    class="bg-surface-elevated text-content-primary text-[11px] rounded px-1.5 py-0.5 border border-surface-border outline-none transition cursor-pointer">
                    <option value="50">50</option>
                    <option value="100">100</option>
                    <option value="200">200</option>
                    <option value="500">500</option>
                    <option value="0">Все</option>
                </select>
            </div>
        </div>

        <div class="flex items-center space-x-4">
            <template x-if="hasDirtyChanges">
                <span class="text-amber-400 font-bold flex items-center space-x-1">
                    <span class="w-2 h-2 rounded-full bg-amber-400 animate-pulse"></span>
                    <span>Несохраненных изменений: <strong x-text="dirtyIndices.size"></strong></span>
                </span>
            </template>
            <span class="hidden sm:inline">Ctrl+S для сохранения</span>
        </div>
    </div>
</div>
{{ end }}
