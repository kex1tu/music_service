{{ define "downloader" }}

<section x-show="$store.app.activeTab === 'downloader'" x-data="downloaderComponent()" class="space-y-6 animate-fade-in">
    <!-- Карточка формы загрузки и активной задачи -->
    {{ template "downloader_form" . }}

    <!-- Секция очереди загрузок -->
    {{ template "downloader_queue" . }}

    <!-- Информационные карточки поддерживаемых источников -->
    {{ template "downloader_sources" . }}

    <!-- Модальное окно селектора дискографии артиста -->
    {{ template "downloader_discography" . }}
</section>
{{ end }}
