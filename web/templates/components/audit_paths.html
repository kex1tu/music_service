{{ define "audit_paths" }}
<!-- СЕКЦИЯ 5: Некорректные пути файлов -->
<div x-show="activeSubTab === 'paths'" class="space-y-4">
    <div class="bg-gray-900/80 border border-amber-800/40 rounded-xl p-4 flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
        <div>
            <h3 class="text-sm font-semibold text-white">Файлы с нарушением канонической структуры</h3>
            <p class="text-xs text-gray-400 mt-0.5">
                Канонический формат хранения треков: <code class="text-amber-300 font-mono">{Альбом}/{Номер:02d}. {Название}.mp3</code>. Вы можете исправить пути автоматически кнопкой справа.
            </p>
        </div>
        <button
            @click="fixAllPaths()"
            :disabled="isFixingPaths || (invalidPaths.length === 0 && (summary.invalid_paths_count || 0) === 0)"
            class="px-4 py-2 bg-gradient-to-r from-amber-600 to-emerald-600 hover:from-amber-500 hover:to-emerald-500 disabled:opacity-50 text-white rounded-lg text-xs font-semibold transition flex items-center space-x-2 shadow-lg shrink-0">
            <svg class="w-4 h-4" :class="{'animate-spin': isFixingPaths}" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 20q-3.35 0-5.675-2.325T4 12t2.325-5.675T12 4q1.725 0 3.3.712T18 6.75V4h2v6h-6V8h3.2q-.8-1.4-2.187-2.2T12 5Q9.075 5 7.038 7.038T5 12t2.038 4.963T12 19q2.625 0 4.588-1.7t2.312-4.3h2.05q-.375 3.475-2.95 5.738T12 20"/>
            </svg>
            <span x-text="isFixingPaths ? 'Исправление путей...' : 'Исправить все пути'"></span>
        </button>
    </div>

    <div class="bg-gray-900 border border-gray-800 rounded-xl overflow-hidden shadow-xl">
        <template x-if="isLoading">
            <div class="p-8 text-center text-gray-400 text-sm flex items-center justify-center space-x-2">
                <svg class="w-4 h-4 animate-spin text-amber-400" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 20q-3.35 0-5.675-2.325T4 12t2.325-5.675T12 4q1.725 0 3.3.712T18 6.75V4h2v6h-6V8h3.2q-.8-1.4-2.187-2.2T12 5Q9.075 5 7.038 7.038T5 12t2.038 4.963T12 19q2.625 0 4.588-1.7t2.312-4.3h2.05q-.375 3.475-2.95 5.738T12 20"/>
                </svg>
                <span>Загрузка данных...</span>
            </div>
        </template>
        <template x-if="!isLoading && invalidPaths.length === 0">
            <div class="p-8 text-center text-gray-500 text-sm">
                Отлично! Все файлы медиатеки разложены по каноническому стандарту.
            </div>
        </template>
        <template x-if="!isLoading && invalidPaths.length > 0">
            <div class="overflow-x-auto max-h-[600px]">
                <table class="w-full text-left border-collapse text-xs">
                    <thead class="bg-gray-950 text-gray-400 uppercase tracking-wider font-semibold sticky top-0 z-10 border-b border-gray-800">
                        <tr>
                            <th class="p-3">Текущий путь</th>
                            <th class="p-3">Причина нарушения</th>
                            <th class="p-3">Рекомендуемый путь</th>
                            <th class="p-3 text-right">Действия</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-800/60">
                        <template x-for="item in invalidPaths.slice(0, 100)" :key="item.path">
                            <tr class="hover:bg-gray-800/40 transition">
                                <td class="p-3 font-mono text-amber-300 max-w-xs truncate" x-text="item.path" :title="item.path"></td>
                                <td class="p-3 text-gray-400" x-text="item.reason || 'Нарушение формата имени или каталога'"></td>
                                <td class="p-3 font-mono text-emerald-400 max-w-xs truncate" x-text="item.suggested_path" :title="item.suggested_path"></td>
                                <td class="p-3 text-right space-x-1.5 whitespace-nowrap">
                                    <button
                                        @click="fixPath(item)"
                                        :disabled="item._isFixing"
                                        class="px-2.5 py-1 bg-emerald-700/80 hover:bg-emerald-600 text-white rounded text-[11px] font-medium transition disabled:opacity-50">
                                        <span x-text="item._isFixing ? '...' : 'Исправить'"></span>
                                    </button>
                                    <button
                                        @click="openDirectory(item.path.split('/').slice(0, -1).join('/'))"
                                        class="px-2.5 py-1 bg-gray-800 hover:bg-gray-700 text-gray-300 rounded text-[11px] transition">
                                        В папку
                                    </button>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
                <template x-if="invalidPaths.length > 100">
                    <div class="p-3 bg-gray-950/60 border-t border-gray-800 text-center text-xs text-gray-400">
                        Показано первых 100 файлов из <span class="font-mono text-amber-300" x-text="invalidPaths.length"></span>. Кнопка «Исправить все пути» обработает все найденные файлы.
                    </div>
                </template>
            </div>
        </template>
    </div>
</div>
{{ end }}
