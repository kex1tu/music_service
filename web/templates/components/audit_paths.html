{{ define "audit_paths" }}
<!-- СЕКЦИЯ 5: Некорректные пути файлов -->
<div x-show="activeSubTab === 'paths'" class="space-y-4">
    <div class="bg-surface-panel border border-surface-border rounded-xl p-4 shadow-panel flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
        <div>
            <h3 class="text-sm font-bold text-content-primary">Файлы с нарушением канонической структуры</h3>
            <p class="text-xs text-content-secondary mt-0.5">
                Канонический формат хранения треков: <code class="text-amber-300 font-mono">{Альбом}/{Номер:02d}. {Название}.mp3</code>. Вы можете исправить пути автоматически кнопкой справа.
            </p>
        </div>
        <button
            @click="fixAllPaths()"
            :disabled="isFixingPaths || (invalidPaths.length === 0 && (summary.invalid_paths_count || 0) === 0)"
            aria-label="Исправить все пути файлов согласно канонической структуре"
            class="px-4 py-2 bg-gradient-to-r from-brand to-amber-500 hover:opacity-90 disabled:opacity-50 text-white rounded-lg text-xs font-semibold transition flex items-center space-x-2 shadow-lg shrink-0">
            <svg class="w-4 h-4" :class="{'animate-spin': isFixingPaths}" aria-hidden="true" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 20q-3.35 0-5.675-2.325T4 12t2.325-5.675T12 4q1.725 0 3.3.712T18 6.75V4h2v6h-6V8h3.2q-.8-1.4-2.187-2.2T12 5Q9.075 5 7.038 7.038T5 12t2.038 4.963T12 19q2.625 0 4.588-1.7t2.312-4.3h2.05q-.375 3.475-2.95 5.738T12 20"/>
            </svg>
            <span x-text="isFixingPaths ? 'Исправление путей...' : 'Исправить все пути'"></span>
        </button>
    </div>

    <div class="bg-surface-panel border border-surface-border rounded-xl overflow-hidden shadow-panel">
        <template x-if="isLoading">
            <div class="p-8 text-center text-content-muted text-sm flex items-center justify-center space-x-2">
                <svg class="w-4 h-4 animate-spin text-amber-400" aria-hidden="true" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 20q-3.35 0-5.675-2.325T4 12t2.325-5.675T12 4q1.725 0 3.3.712T18 6.75V4h2v6h-6V8h3.2q-.8-1.4-2.187-2.2T12 5Q9.075 5 7.038 7.038T5 12t2.038 4.963T12 19q2.625 0 4.588-1.7t2.312-4.3h2.05q-.375 3.475-2.95 5.738T12 20"/>
                </svg>
                <span>Загрузка данных...</span>
            </div>
        </template>
        <template x-if="!isLoading && invalidPaths.length === 0">
            <div class="p-8 text-center text-content-muted text-sm">
                Отлично! Все файлы медиатеки разложены по каноническому стандарту.
            </div>
        </template>
        <template x-if="!isLoading && invalidPaths.length > 0">
            <div>
                <!-- Мобильный вид (< md) -->
                <div class="md:hidden divide-y divide-surface-borderSubtle">
                    <template x-for="item in ($store.app.isDesktopLayout ? [] : invalidPaths.slice(0, 100))" :key="'mob-' + item.path">
                        <div class="p-3.5 space-y-2">
                            <div class="text-xs font-mono text-amber-300 break-all" x-text="item.path"></div>
                            <div class="text-xs text-content-secondary" x-text="item.reason || 'Нарушение формата имени или каталога'"></div>
                            <div class="text-xs font-mono text-brand break-all bg-surface-base/70 border border-surface-border/60 rounded p-2" x-text="item.suggested_path"></div>
                            <div class="flex items-center gap-2 pt-1">
                                <button
                                    @click="fixPath(item)"
                                    :disabled="item._isFixing"
                                    :aria-label="'Исправить путь файла ' + item.path"
                                    class="flex-1 px-3 py-2 bg-brand hover:bg-brand-hover text-zinc-950 rounded text-xs font-bold transition disabled:opacity-50 shadow-sm active:scale-95">
                                    <span x-text="item._isFixing ? '...' : 'Исправить'"></span>
                                </button>
                                <button
                                    @click="openDirectory(item.path.split('/').slice(0, -1).join('/'))"
                                    :aria-label="'Открыть папку файла ' + item.path"
                                    class="px-3 py-2 bg-surface-elevated hover:bg-surface-hover text-content-primary border border-surface-border rounded text-xs transition shrink-0">
                                    В папку
                                </button>
                            </div>
                        </div>
                    </template>
                </div>

                <!-- Десктопный вид (>= md) -->
                <div class="hidden md:block overflow-x-auto max-h-[600px]">
                <table class="w-full text-left border-collapse text-xs">
                    <thead class="bg-surface-base text-content-secondary uppercase tracking-wider font-semibold sticky top-0 z-10 border-b border-surface-border font-mono text-xs">
                        <tr>
                            <th class="p-3">Текущий путь</th>
                            <th class="p-3">Причина нарушения</th>
                            <th class="p-3">Рекомендуемый путь</th>
                            <th class="p-3 text-right">Действия</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-surface-borderSubtle">
                        <template x-for="item in ($store.app.isDesktopLayout ? invalidPaths.slice(0, 100) : [])" :key="item.path">
                            <tr class="hover:bg-surface-elevated/60 transition">
                                <td class="p-3 font-mono text-amber-300 max-w-xs truncate" x-text="item.path" :title="item.path"></td>
                                <td class="p-3 text-content-secondary" x-text="item.reason || 'Нарушение формата имени или каталога'"></td>
                                <td class="p-3 font-mono text-brand max-w-xs truncate" x-text="item.suggested_path" :title="item.suggested_path"></td>
                                <td class="p-3 text-right space-x-1.5 whitespace-nowrap">
                                    <button
                                        @click="fixPath(item)"
                                        :disabled="item._isFixing"
                                        :aria-label="'Исправить путь файла ' + item.path"
                                        class="px-2.5 py-1 bg-brand hover:bg-brand-hover text-zinc-950 rounded text-xs font-bold transition disabled:opacity-50 shadow-sm active:scale-95">
                                        <span x-text="item._isFixing ? '...' : 'Исправить'"></span>
                                    </button>
                                    <button
                                        @click="openDirectory(item.path.split('/').slice(0, -1).join('/'))"
                                        :aria-label="'Открыть папку файла ' + item.path"
                                        class="px-2.5 py-1 bg-surface-elevated hover:bg-surface-hover text-content-primary border border-surface-border rounded text-xs transition">
                                        В папку
                                    </button>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
                </div>
                <template x-if="invalidPaths.length > 100">
                    <div class="p-3 bg-surface-base border-t border-surface-border text-center text-xs text-content-muted">
                        Показано первых 100 файлов из <span class="font-mono text-amber-300" x-text="invalidPaths.length"></span>. Кнопка «Исправить все пути» обработает все найденные файлы.
                    </div>
                </template>
            </div>
        </template>
    </div>
</div>
{{ end }}
