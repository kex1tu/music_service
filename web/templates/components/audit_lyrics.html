{{ define "audit_lyrics" }}
<!-- СЕКЦИЯ 1: Треки без текстов -->
<div x-show="activeSubTab === 'lyrics'" class="space-y-4">
    <!-- Панель пакетного поиска текстов -->
    <div class="bg-gray-900/80 border border-purple-800/40 rounded-xl p-4 flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
        <div>
            <h3 class="text-sm font-semibold text-white">Пакетный автопоиск текстов</h3>
            <p class="text-xs text-gray-400 mt-0.5">
                Сервер последовательно запросит тексты через LRCLIB и Genius для всех треков коллекции без .lrc/.txt.
            </p>
        </div>
        <button
            @click="startBatchLyricsFetch()"
            :disabled="lyricsProgress.is_running || missingLyrics.length === 0"
            class="px-4 py-2 bg-purple-600 hover:bg-purple-500 disabled:opacity-50 text-white text-xs font-semibold rounded-lg transition shadow flex items-center space-x-2 shrink-0">
            <template x-if="lyricsProgress.is_running">
                <svg class="w-3.5 h-3.5 animate-spin" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M8.125 21.213q-1.825-.788-3.187-2.15t-2.15-3.188T2 11.988t.788-3.875t2.15-3.175t3.187-2.15T12 2q.425 0 .713.288T13 3t-.288.713T12 4Q8.675 4 6.337 6.338T4 12t2.338 5.663T12 20t5.663-2.337T20 12q0-.425.288-.712T21 11t.713.288T22 12q0 2.05-.788 3.875t-2.15 3.188t-3.175 2.15t-3.875.787t-3.887-.787"/>
                </svg>
            </template>
            <template x-if="!lyricsProgress.is_running">
                <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10H7v-2h10v2zm0-4H7V7h10v2z"/>
                </svg>
            </template>
            <span x-text="lyricsProgress.is_running ? 'Идет поиск...' : 'Найти недостающие тексты для всех'"></span>
        </button>
    </div>

    <!-- Прогресс фонового поиска текстов -->
    <template x-if="lyricsProgress.is_running">
        <div class="bg-gray-900 border border-purple-700/50 rounded-xl p-4 space-y-2">
            <div class="flex items-center justify-between text-xs">
                <span class="text-purple-300 font-medium truncate mr-2" x-text="`Обработка: ${lyricsProgress.current_track || '...'}`"></span>
                <span class="text-gray-400 font-mono shrink-0" x-text="`${lyricsProgress.current}/${lyricsProgress.total} (${lyricsProgress.total > 0 ? Math.round(lyricsProgress.current / lyricsProgress.total * 100) : 0}%)`"></span>
            </div>
            <div class="w-full bg-gray-950 rounded-full h-2 overflow-hidden border border-gray-800">
                <div class="bg-gradient-to-r from-purple-500 to-indigo-500 h-2 rounded-full transition-all duration-300"
                    :style="`width: ${lyricsProgress.total > 0 ? (lyricsProgress.current / lyricsProgress.total * 100) : 0}%`"></div>
            </div>
            <div class="flex items-center space-x-4 text-[11px] text-gray-400 pt-1">
                <span>Найдено текстов: <strong class="text-emerald-400" x-text="lyricsProgress.found"></strong></span>
                <span>Не найдено: <strong class="text-red-400" x-text="lyricsProgress.failed"></strong></span>
            </div>
        </div>
    </template>

    <!-- Таблица треков без текстов -->
    <div class="bg-gray-900 border border-gray-800 rounded-xl overflow-hidden shadow-xl">
        <template x-if="isLoading">
            <div class="p-8 text-center text-gray-400 text-sm flex items-center justify-center space-x-2">
                <svg class="w-4 h-4 animate-spin text-purple-400" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 20q-3.35 0-5.675-2.325T4 12t2.325-5.675T12 4q1.725 0 3.3.712T18 6.75V4h2v6h-6V8h3.2q-.8-1.4-2.187-2.2T12 5Q9.075 5 7.038 7.038T5 12t2.038 4.963T12 19q2.625 0 4.588-1.7t2.312-4.3h2.05q-.375 3.475-2.95 5.738T12 20"/>
                </svg>
                <span>Загрузка данных...</span>
            </div>
        </template>
        <template x-if="!isLoading && missingLyrics.length === 0">
            <div class="p-8 text-center text-gray-500 text-sm">
                Отлично! У всех треков в медиатеке уже есть тексты песен.
            </div>
        </template>
        <template x-if="!isLoading && missingLyrics.length > 0">
            <div class="overflow-x-auto max-h-[600px]">
                <table class="w-full text-left border-collapse text-xs">
                    <thead class="bg-gray-950 text-gray-400 uppercase tracking-wider font-semibold sticky top-0 z-10 border-b border-gray-800">
                        <tr>
                            <th class="p-3">Трек</th>
                            <th class="p-3">Исполнитель</th>
                            <th class="p-3">Альбом</th>
                            <th class="p-3">Папка</th>
                            <th class="p-3 text-right">Действия</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-800/60">
                        <template x-for="item in missingLyrics" :key="item.path">
                            <tr class="hover:bg-gray-800/40 transition">
                                <td class="p-3 font-medium text-white max-w-xs truncate" x-text="item.title" :title="item.title"></td>
                                <td class="p-3 text-gray-300 max-w-xs truncate" x-text="item.artist" :title="item.artist"></td>
                                <td class="p-3 text-gray-400 max-w-xs truncate" x-text="item.album || '—'" :title="item.album"></td>
                                <td class="p-3 text-gray-500 font-mono text-[11px] max-w-xs truncate" x-text="item.directory" :title="item.directory"></td>
                                <td class="p-3 text-right">
                                    <div class="flex items-center justify-end space-x-2">
                                        <button
                                            @click="openLyricsForTrack(item)"
                                            class="px-2.5 py-1 bg-purple-600/20 hover:bg-purple-600/30 text-purple-300 rounded border border-purple-500/30 transition text-[11px] font-medium flex items-center space-x-1">
                                            <svg class="w-3 h-3" viewBox="0 0 24 24" fill="currentColor">
                                                <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10H7v-2h10v2zm0-4H7V7h10v2z"/>
                                            </svg>
                                            <span>Найти текст</span>
                                        </button>
                                        <button
                                            @click="openDirectory(item.directory)"
                                            title="Открыть папку"
                                            class="p-1 hover:bg-gray-800 text-gray-400 hover:text-white rounded transition">
                                            <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor">
                                                <path d="M4 20q-.825 0-1.412-.587T2 18V6q0-.825.588-1.412T4 4h5.175q.4 0 .763.15t.637.425L12 6h8q.825 0 1.413.588T22 8v10q0 .825-.587 1.413T20 20zm0-2h16V8h-8.825l-2-2H4zm0 0V6z"/>
                                            </svg>
                                        </button>
                                    </div>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>
        </template>
    </div>
</div>
{{ end }}
