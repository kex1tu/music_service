{{ define "audit_genres" }}
<!-- СЕКЦИЯ 6: Жанры на проверку -->
<div x-show="activeSubTab === 'genres'" class="space-y-4">
    <div class="bg-surface-panel border border-surface-border rounded-xl p-4 shadow-panel flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
        <div>
            <h3 class="text-sm font-bold text-content-primary">Русскоязычные и нелатинские жанры</h3>
            <p class="text-xs text-content-secondary mt-0.5">
                В медиатеке поддерживаются только стандартизированные международные жанры на английском языке.
            </p>
        </div>
        <button
            @click="autoRetagGenres()"
            :disabled="isRetaggingGenres || nonEnGenres.length === 0"
            aria-label="Автоматически переписать русскоязычные жанры на канонические EN"
            class="px-4 py-2 bg-gradient-to-r from-rose-600 to-amber-600 hover:from-rose-500 hover:to-amber-500 disabled:opacity-50 text-white rounded-lg text-xs font-semibold transition flex items-center space-x-2 shadow-lg shrink-0">
            <svg class="w-4 h-4" :class="{'animate-spin': isRetaggingGenres}" aria-hidden="true" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 20q-3.35 0-5.675-2.325T4 12t2.325-5.675T12 4q1.725 0 3.3.712T18 6.75V4h2v6h-6V8h3.2q-.8-1.4-2.187-2.2T12 5Q9.075 5 7.038 7.038T5 12t2.038 4.963T12 19q2.625 0 4.588-1.7t2.312-4.3h2.05q-.375 3.475-2.95 5.738T12 20"/>
            </svg>
            <span x-text="isRetaggingGenres ? 'Перезапись тегов...' : 'Переписать теги (авто)'"></span>
        </button>
    </div>

    <div class="bg-surface-panel border border-surface-border rounded-xl overflow-hidden shadow-panel">
        <template x-if="isLoading">
            <div class="p-8 text-center text-content-muted text-sm flex items-center justify-center space-x-2">
                <svg class="w-4 h-4 animate-spin text-rose-400" aria-hidden="true" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 20q-3.35 0-5.675-2.325T4 12t2.325-5.675T12 4q1.725 0 3.3.712T18 6.75V4h2v6h-6V8h3.2q-.8-1.4-2.187-2.2T12 5Q9.075 5 7.038 7.038T5 12t2.038 4.963T12 19q2.625 0 4.588-1.7t2.312-4.3h2.05q-.375 3.475-2.95 5.738T12 20"/>
                </svg>
                <span>Загрузка данных...</span>
            </div>
        </template>
        <template x-if="!isLoading && nonEnGenres.length === 0">
            <div class="p-8 text-center text-content-muted text-sm">
                Все жанры соответствуют международным англоязычным стандартам.
            </div>
        </template>
        <template x-if="!isLoading && nonEnGenres.length > 0">
            <div class="overflow-x-auto max-h-[600px]">
                <table class="w-full text-left border-collapse text-xs">
                    <thead class="bg-surface-base text-content-secondary uppercase tracking-wider font-semibold sticky top-0 z-10 border-b border-surface-border font-mono text-xs">
                        <tr>
                            <th class="p-3">Трек</th>
                            <th class="p-3">Текущий жанр</th>
                            <th class="p-3">Канонический EN жанр</th>
                            <th class="p-3">Статус исправления</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-surface-borderSubtle">
                        <template x-for="item in nonEnGenres" :key="item.path + item.current_genre">
                            <tr class="hover:bg-surface-elevated/60 transition">
                                <td class="p-3 font-mono text-content-secondary max-w-xs truncate" x-text="item.path" :title="item.path"></td>
                                <td class="p-3 font-medium" :class="item.is_auto_fixed ? 'text-content-secondary' : 'text-rose-400'" x-text="item.current_genre"></td>
                                <td class="p-3 font-medium text-brand" x-text="item.canonical_genre || '—'"></td>
                                <td class="p-3">
                                    <template x-if="item.is_auto_fixed">
                                        <span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-brand/10 text-brand border border-brand/30 font-mono">
                                            Автозаменено
                                        </span>
                                    </template>
                                    <template x-if="!item.is_auto_fixed">
                                        <span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-rose-500/10 text-rose-400 border border-rose-500/20">
                                            Требует правки
                                        </span>
                                    </template>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
            </div>
        </template>
    </div>
</div>
{{ end }}
