{{ define "audit_tags" }}
<!-- СЕКЦИЯ 7: Сверка тегов медиатеки -->
<div x-show="activeSubTab === 'tags'" class="space-y-4">
    <!-- Шапка секции и панель фильтров/действий -->
    <div class="bg-surface-panel border border-surface-border rounded-xl p-4 shadow-panel flex flex-col md:flex-row items-start md:items-center justify-between gap-4">
        <div>
            <h3 class="text-sm font-semibold text-white flex items-center space-x-2">
                <span class="w-2 h-2 rounded-full bg-brand"></span>
                <span>Сверка и очистка метаданных (ID3v2.4)</span>
            </h3>
            <p class="text-xs text-gray-400 mt-0.5">
                Обнаружение клипового мусора, нераспарсенных соавторов (feat.), каналов вместо артистов и сверка с каталогами (Яндекс Музыка, YouTube Music, Deezer, iTunes).
            </p>
        </div>
        <div class="flex flex-wrap items-center gap-2 shrink-0">
            <!-- Кнопка: Исправить безопасные дефекты (local fast, no network) -->
            <button
                @click="fixSafeTagIssues()"
                :disabled="isFixingSafeTags || safeIssuesCount() === 0"
                class="px-3 py-2 px-3 py-2 bg-brand hover:bg-brand-hover disabled:opacity-40 text-white rounded-lg text-xs font-semibold transition flex items-center space-x-1.5 shadow-lg shadow-brand/20 active:scale-95"
                title="Быстрое детерминированное локальное исправление клипового мусора, номеров треков и topic-каналов">
                <template x-if="isFixingSafeTags">
                    <svg class="w-3.5 h-3.5 animate-spin" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 20q-3.35 0-5.675-2.325T4 12t2.325-5.675T12 4q1.725 0 3.3.712T18 6.75V4h2v6h-6V8h3.2q-.8-1.4-2.187-2.2T12 5Q9.075 5 7.038 7.038T5 12t2.038 4.963T12 19q2.625 0 4.588-1.7t2.312-4.3h2.05q-.375 3.475-2.95 5.738T12 20"/>
                    </svg>
                </template>
                <template x-if="!isFixingSafeTags">
                    <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
                    </svg>
                </template>
                <span x-text="isFixingSafeTags ? 'Исправление...' : ('Безопасные (' + safeIssuesCount() + ')')"></span>
            </button>

            <!-- Кнопка: Исправить выбранные -->
            <button
                @click="fixSelectedTagIssues()"
                :disabled="isFixingSelectedTags || selectedPaths.length === 0"
                class="px-3 py-2 bg-sky-600 hover:bg-sky-500 disabled:opacity-40 text-white rounded-lg text-xs font-semibold transition flex items-center space-x-1.5 shadow"
                title="Применить предложенные теги только к отмеченным галочками трекам">
                <template x-if="isFixingSelectedTags">
                    <svg class="w-3.5 h-3.5 animate-spin" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 20q-3.35 0-5.675-2.325T4 12t2.325-5.675T12 4q1.725 0 3.3.712T18 6.75V4h2v6h-6V8h3.2q-.8-1.4-2.187-2.2T12 5Q9.075 5 7.038 7.038T5 12t2.038 4.963T12 19q2.625 0 4.588-1.7t2.312-4.3h2.05q-.375 3.475-2.95 5.738T12 20"/>
                    </svg>
                </template>
                <template x-if="!isFixingSelectedTags">
                    <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M19 3H5c-1.11 0-2 .9-2 2v14c0 1.1.89 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-9 14l-5-5 1.41-1.41L10 14.17l7.59-7.59L19 8l-9 9z"/>
                    </svg>
                </template>
                <span x-text="isFixingSelectedTags ? 'Применение...' : ('Применить к выбранным (' + selectedPaths.length + ')')"></span>
            </button>

            <!-- Кнопка: Исправить все дефекты -->
            <button
                @click="fixAllTagIssues()"
                :disabled="isFixingAllTags || tagIssuesTotalCount === 0"
                class="px-3 py-2 bg-surface-elevated hover:bg-surface-hover border border-surface-border disabled:opacity-40 text-content-primary rounded-lg text-xs font-semibold transition flex items-center space-x-1.5 shadow">
                <template x-if="isFixingAllTags">
                    <svg class="w-3.5 h-3.5 animate-spin" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 20q-3.35 0-5.675-2.325T4 12t2.325-5.675T12 4q1.725 0 3.3.712T18 6.75V4h2v6h-6V8h3.2q-.8-1.4-2.187-2.2T12 5Q9.075 5 7.038 7.038T5 12t2.038 4.963T12 19q2.625 0 4.588-1.7t2.312-4.3h2.05q-.375 3.475-2.95 5.738T12 20"/>
                    </svg>
                </template>
                <template x-if="!isFixingAllTags">
                    <svg class="w-3.5 h-3.5 text-brand" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/>
                    </svg>
                </template>
                <span x-text="isFixingAllTags ? 'Исправление всех...' : 'Исправить все'"></span>
            </button>
        </div>
    </div>

    <!-- Фильтры по типам проблем -->
    <div class="flex flex-wrap items-center gap-2">
        <span class="text-xs text-gray-500 mr-1">Фильтр:</span>
        <button
            @click="filterTagIssues('all')"
            :class="tagIssuesFilter === 'all' ? 'bg-brand/20 text-brand border-brand/50 font-semibold' : 'bg-surface-elevated text-content-muted border-surface-border hover:text-content-primary'"
            class="px-2.5 py-1 rounded text-[11px] font-medium border transition">
            Все дефекты
        </button>
        <button
            @click="filterTagIssues('dirty_title')"
            :class="tagIssuesFilter === 'dirty_title' ? 'bg-brand/20 text-brand border-brand/50 font-semibold' : 'bg-surface-elevated text-content-muted border-surface-border hover:text-content-primary'"
            class="px-2.5 py-1 rounded text-[11px] font-medium border transition">
            Мусор в названии
        </button>
        <button
            @click="filterTagIssues('unparsed_feat')"
            :class="tagIssuesFilter === 'unparsed_feat' ? 'bg-brand/20 text-brand border-brand/50 font-semibold' : 'bg-surface-elevated text-content-muted border-surface-border hover:text-content-primary'"
            class="px-2.5 py-1 rounded text-[11px] font-medium border transition">
            Нераспарсенные соавторы (feat.)
        </button>
        <button
            @click="filterTagIssues('label_as_artist')"
            :class="tagIssuesFilter === 'label_as_artist' ? 'bg-brand/20 text-brand border-brand/50 font-semibold' : 'bg-surface-elevated text-content-muted border-surface-border hover:text-content-primary'"
            class="px-2.5 py-1 rounded text-[11px] font-medium border transition">
            Канал Topic / Лейбл
        </button>
        <button
            @click="filterTagIssues('missing_tags')"
            :class="tagIssuesFilter === 'missing_tags' ? 'bg-brand/20 text-brand border-brand/50 font-semibold' : 'bg-surface-elevated text-content-muted border-surface-border hover:text-content-primary'"
            class="px-2.5 py-1 rounded text-[11px] font-medium border transition">
            Пропущенный год / альбом
        </button>
    </div>

    <!-- Таблица треков с дефектами -->
    <div class="bg-surface-panel border border-surface-border rounded-xl overflow-hidden shadow-panel">
        <template x-if="tagIssuesLoading">
            <div class="p-8 text-center text-gray-400 text-sm flex items-center justify-center space-x-2">
                <svg class="w-4 h-4 animate-spin text-brand" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 20q-3.35 0-5.675-2.325T4 12t2.325-5.675T12 4q1.725 0 3.3.712T18 6.75V4h2v6h-6V8h3.2q-.8-1.4-2.187-2.2T12 5Q9.075 5 7.038 7.038T5 12t2.038 4.963T12 19q2.625 0 4.588-1.7t2.312-4.3h2.05q-.375 3.475-2.95 5.738T12 20"/>
                </svg>
                <span>Анализ метаданных коллекции...</span>
            </div>
        </template>
        <template x-if="!tagIssuesLoading && tagIssues.length === 0">
            <div class="p-8 text-center text-gray-500 text-sm">
                Отлично! Все теги соответствуют стандарту ID3v2.4 и не содержат клипового мусора.
            </div>
        </template>
        <template x-if="!tagIssuesLoading && tagIssues.length > 0">
            <div class="overflow-x-auto max-h-[650px]">
                <table class="w-full text-left border-collapse text-xs">
                    <thead class="bg-surface-base text-content-secondary uppercase tracking-wider font-semibold sticky top-0 z-10 border-b border-surface-border font-mono text-[11px]">
                        <tr>
                            <th class="p-3 w-10 text-center">
                                <input
                                    type="checkbox"
                                    :checked="tagIssues.length > 0 && selectedPaths.length === tagIssues.length"
                                    @change="toggleSelectAll()"
                                    class="w-4 h-4 rounded border-surface-border bg-surface-input text-brand focus:ring-0 focus:ring-offset-0 cursor-pointer"
                                    title="Выбрать все" />
                            </th>
                            <th class="p-3">Текущие метаданные</th>
                            <th class="p-3">Обнаруженные дефекты</th>
                            <th class="p-3">Предлагаемые чистые теги</th>
                            <th class="p-3 text-right">Действия</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-800/60">
                        <template x-for="item in tagIssues" :key="item.file_path">
                            <tr class="hover:bg-gray-800/40 transition" :class="isSelected(item.file_path) ? 'bg-sky-950/20' : ''">
                                <!-- Чекбокс выбора -->
                                <td class="p-3 w-10 text-center">
                                    <input
                                        type="checkbox"
                                        :checked="isSelected(item.file_path)"
                                        @change="toggleSelectItem(item.file_path)"
                                        class="w-4 h-4 rounded border-surface-border bg-surface-input text-brand focus:ring-0 focus:ring-offset-0 cursor-pointer" />
                                </td>

                                <!-- Текущие метаданные -->
                                <td class="p-3 max-w-xs">
                                    <div class="font-medium text-white truncate" x-text="item.title" :title="item.title"></div>
                                    <div class="text-[11px] text-gray-400 truncate mt-0.5" x-text="item.artist" :title="item.artist"></div>
                                    <div class="text-[10px] text-gray-500 truncate font-mono mt-0.5" x-text="item.file_path" :title="item.file_path"></div>
                                </td>

                                <!-- Обнаруженные дефекты (бейджи) -->
                                <td class="p-3 whitespace-nowrap">
                                    <div class="flex flex-col gap-1.5">
                                        <!-- Уровень серьезности (Severity) -->
                                        <div>
                                            <span
                                                class="px-2 py-0.5 rounded text-[10px] font-bold uppercase tracking-wider"
                                                :class="{
                                                    'bg-brand-muted text-brand border border-brand/30': item.severity === 'safe_autofix',
                                                    'bg-amber-500/20 text-amber-300 border border-amber-500/30': item.severity === 'review_needed',
                                                    'bg-blue-500/20 text-blue-300 border border-blue-500/30': item.severity === 'info'
                                                }"
                                                x-text="{
                                                    'safe_autofix': 'Безопасно (Авто)',
                                                    'review_needed': 'Требует внимания',
                                                    'info': 'Инфо'
                                                }[item.severity] || item.severity">
                                            </span>
                                        </div>
                                        <!-- Список дефектов -->
                                        <div class="flex flex-wrap gap-1">
                                            <template x-for="iss in item.issues" :key="iss">
                                                <span
                                                    class="px-2 py-0.5 rounded text-[10px] font-medium"
                                                    :class="{
                                                        'bg-red-500/10 text-red-400 border border-red-500/20': iss === 'dirty_title',
                                                        'bg-purple-500/10 text-purple-400 border border-purple-500/20': iss === 'unparsed_feat',
                                                        'bg-amber-500/10 text-amber-400 border border-amber-500/20': iss === 'label_as_artist',
                                                        'bg-blue-500/10 text-blue-400 border border-blue-500/20': iss === 'artist_in_title',
                                                        'bg-brand/10 text-brand border border-brand/20': iss === 'literal_backslash_artist',
                                                        'bg-gray-500/10 text-gray-400 border border-gray-500/20': iss === 'missing_year' || iss === 'missing_album' || iss === 'track_num_in_title'
                                                    }"
                                                    x-text="{
                                                        'dirty_title': 'Клиповый мусор',
                                                        'unparsed_feat': 'Нераспарсен feat',
                                                        'label_as_artist': 'Канал / Лейбл',
                                                        'artist_in_title': 'Дубль артиста',
                                                        'literal_backslash_artist': 'Navidrome \\\\',
                                                        'track_num_in_title': 'Номер в названии',
                                                        'missing_year': 'Нет года',
                                                        'missing_album': 'Нет альбома'
                                                    }[iss] || iss">
                                                </span>
                                            </template>
                                        </div>
                                    </div>
                                </td>

                                <!-- Предлагаемые чистые теги -->
                                <td class="p-3 max-w-xs">
                                    <div class="font-medium text-brand truncate" x-text="item.proposed.title" :title="item.proposed.title"></div>
                                    <div class="text-[11px] text-teal-400/90 truncate mt-0.5 flex items-center space-x-1" :title="item.proposed.artist">
                                        <span x-text="item.proposed.artist"></span>
                                    </div>
                                    <template x-if="item.proposed.album && item.proposed.album !== item.album">
                                        <div class="text-[10px] text-gray-400 truncate mt-0.5" x-text="'Альбом: ' + item.proposed.album"></div>
                                    </template>
                                </td>

                                <!-- Действия -->
                                <td class="p-3 text-right space-x-1.5 whitespace-nowrap">
                                    <button
                                        @click="fixTagIssue(item)"
                                        :disabled="isFixingTagIssue[item.file_path]"
                                        class="px-2.5 py-1 bg-brand/20 hover:bg-brand/30 text-brand border border-brand/30 rounded text-[11px] font-semibold transition disabled:opacity-50 inline-flex items-center space-x-1 active:scale-95">
                                        <span x-text="isFixingTagIssue[item.file_path] ? '...' : 'Исправить'"></span>
                                    </button>
                                    <button
                                        @click="openTagDiffModal(item)"
                                        class="px-2.5 py-1 bg-sky-700/80 hover:bg-sky-600 text-white rounded text-[11px] font-medium transition inline-flex items-center space-x-1">
                                        <span>Сверка</span>
                                    </button>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
                <template x-if="tagIssuesTotalCount > tagIssues.length">
                    <div class="p-3 bg-surface-base border-t border-surface-border text-center text-xs text-content-muted">
                        Показано первых <span class="font-mono text-brand" x-text="tagIssues.length"></span> треков из <span class="font-mono text-brand" x-text="tagIssuesTotalCount"></span>.
                    </div>
                </template>
            </div>
        </template>
    </div>

    <!-- ==================== МОДАЛЬНОЕ ОКНО: DIFF СВЕРКА С ОНЛАЙН КАТАЛОГАМИ ==================== -->
    <div
        x-show="tagDiffModalOpen"
        x-cloak
        class="fixed inset-0 z-50 overflow-y-auto bg-black/80 backdrop-blur-sm flex items-center justify-center p-4"
        @keydown.escape.window="closeTagDiffModal()">
        
        <div
            @click.outside="closeTagDiffModal()"
            class="bg-surface-panel border border-surface-border rounded-2xl w-full max-w-4xl shadow-panel overflow-hidden flex flex-col max-h-[90vh]">
            
            <!-- Заголовок модального окна -->
            <div class="p-5 border-b border-surface-border flex items-center justify-between bg-surface-base/80">
                <div class="flex items-center space-x-3">
                    <span class="w-8 h-8 rounded-lg bg-sky-500/10 text-sky-400 flex items-center justify-center">
                        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
                        </svg>
                    </span>
                    <div>
                        <h3 class="text-base font-semibold text-white">Сверка метаданных с онлайн-каталогами</h3>
                        <p class="text-xs text-gray-400 mt-0.5 truncate max-w-lg" x-text="activeDiffItem ? activeDiffItem.file_path : ''"></p>
                    </div>
                </div>
                <button
                    @click="closeTagDiffModal()"
                    class="p-2 text-gray-400 hover:text-white rounded-lg hover:bg-gray-800 transition">
                    <svg class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                </button>
            </div>

            <!-- Тело модального окна -->
            <div class="p-6 overflow-y-auto space-y-6 flex-1">
                <template x-if="catalogSearchLoading">
                    <div class="py-16 text-center text-gray-400 space-y-3">
                        <svg class="w-6 h-6 animate-spin text-sky-400 mx-auto" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M12 20q-3.35 0-5.675-2.325T4 12t2.325-5.675T12 4q1.725 0 3.3.712T18 6.75V4h2v6h-6V8h3.2q-.8-1.4-2.187-2.2T12 5Q9.075 5 7.038 7.038T5 12t2.038 4.963T12 19q2.625 0 4.588-1.7t2.312-4.3h2.05q-.375 3.475-2.95 5.738T12 20"/>
                        </svg>
                        <p class="text-sm">Поиск совпадений в Яндекс Музыке, YouTube Music, Deezer и iTunes...</p>
                    </div>
                </template>

                <template x-if="!catalogSearchLoading && catalogDiffMatches.length === 0">
                    <div class="py-12 text-center text-gray-500">
                        <p class="text-sm">Совпадений в каталогах не найдено. Вы можете применить локально вычисленные теги.</p>
                    </div>
                </template>

                <template x-if="!catalogSearchLoading && catalogDiffMatches.length > 0">
                    <div class="space-y-6">
                        <!-- Выбор источника / релиза из каталога -->
                        <div>
                            <label class="block text-xs font-semibold text-gray-400 uppercase tracking-wider mb-2">
                                Найденные совпадения в каталогах (<span x-text="catalogDiffMatches.length"></span>)
                            </label>
                            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3">
                                <template x-for="(match, idx) in catalogDiffMatches" :key="idx">
                                    <div
                                        @click="selectedMatchIndex = idx"
                                        :class="selectedMatchIndex === idx ? 'border-brand ring-1 ring-brand/50 bg-surface-elevated' : 'border-surface-border bg-surface-base hover:border-brand'"
                                        class="p-3 border rounded-xl cursor-pointer transition flex space-x-3 items-center">
                                        <template x-if="match.cover_url">
                                            <img :src="match.cover_url" class="w-12 h-12 rounded-lg object-cover bg-surface-input shrink-0 border border-surface-border" />
                                        </template>
                                        <template x-if="!match.cover_url">
                                            <div class="w-12 h-12 rounded-lg bg-surface-input border border-surface-border flex items-center justify-center text-content-muted shrink-0">
                                                <svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor">
                                                    <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
                                                </svg>
                                            </div>
                                        </template>
                                        <div class="overflow-hidden min-w-0 flex-1">
                                            <div class="flex items-center space-x-1.5 flex-wrap gap-y-1">
                                                <span
                                                    class="px-1.5 py-0.2 rounded text-[9px] uppercase font-bold tracking-wider"
                                                    :class="{
                                                        'bg-amber-500/10 text-amber-400 border border-amber-500/20': match.source === 'yandex',
                                                        'bg-red-500/10 text-red-400 border border-red-500/20': match.source === 'youtube_music',
                                                        'bg-sky-500/10 text-sky-400 border border-sky-500/20': match.source === 'deezer',
                                                        'bg-pink-500/10 text-pink-400 border border-pink-500/20': match.source === 'itunes'
                                                    }"
                                                    x-text="match.source === 'yandex' ? 'Yandex' : (match.source === 'youtube_music' ? 'YT Music' : (match.source === 'deezer' ? 'Deezer' : 'iTunes'))">
                                                </span>
                                                <!-- Процент совпадения MatchScore -->
                                                <template x-if="match.match_score">
                                                    <span
                                                        class="px-1.5 py-0.2 rounded text-[9px] font-bold"
                                                        :class="match.match_score >= 80 ? 'bg-brand-muted text-brand border border-brand/30' : (match.match_score >= 50 ? 'bg-amber-500/20 text-amber-300 border border-amber-500/30' : 'bg-red-500/20 text-red-300 border border-red-500/30')"
                                                        x-text="match.match_score + '% совпадение'">
                                                    </span>
                                                </template>
                                                <!-- Длительность -->
                                                <template x-if="match.duration && match.duration > 0">
                                                    <span class="text-[10px] text-gray-400 font-mono" x-text="Math.floor(match.duration / 60) + ':' + String(match.duration % 60).padStart(2, '0')"></span>
                                                </template>
                                                <span class="text-[10px] text-gray-500" x-text="match.year ? match.year : ''"></span>
                                            </div>
                                            <div class="text-xs font-medium text-white truncate mt-1" x-text="match.title"></div>
                                            <div class="text-[11px] text-gray-400 truncate" x-text="match.artist"></div>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </div>

                        <!-- Diff Таблица Сравнения -->
                        <template x-if="catalogDiffMatches[selectedMatchIndex]">
                            <div class="border border-surface-border rounded-xl overflow-hidden bg-surface-base">
                                <table class="w-full text-left border-collapse text-xs">
                                    <thead class="bg-surface-base text-content-secondary uppercase tracking-wider font-semibold border-b border-surface-border font-mono text-[11px]">
                                        <tr>
                                            <th class="p-3 w-1/4">Поле тега</th>
                                            <th class="p-3 w-3/8 text-gray-400">Текущее в файле</th>
                                            <th class="p-3 w-3/8 text-sky-400">В каталоге (Новое)</th>
                                        </tr>
                                    </thead>
                                    <tbody class="divide-y divide-gray-800/60">
                                        <!-- Название -->
                                        <tr>
                                            <td class="p-3 font-semibold text-gray-400">Название песни</td>
                                            <td class="p-3 text-gray-300" x-text="activeDiffItem.title"></td>
                                            <td
                                                class="p-3 font-semibold"
                                                :class="catalogDiffMatches[selectedMatchIndex].title !== activeDiffItem.title ? 'text-brand bg-brand-muted' : 'text-gray-300'"
                                                x-text="catalogDiffMatches[selectedMatchIndex].title">
                                            </td>
                                        </tr>

                                        <!-- Артисты -->
                                        <tr>
                                            <td class="p-3 font-semibold text-gray-400">Исполнители (Multi-Artist)</td>
                                            <td class="p-3 text-gray-300" x-text="activeDiffItem.artist"></td>
                                            <td
                                                class="p-3 font-semibold"
                                                :class="catalogDiffMatches[selectedMatchIndex].artist !== activeDiffItem.artist ? 'text-brand bg-brand-muted' : 'text-gray-300'"
                                                x-text="catalogDiffMatches[selectedMatchIndex].artist">
                                            </td>
                                        </tr>

                                        <!-- Альбом -->
                                        <tr>
                                            <td class="p-3 font-semibold text-gray-400">Альбом</td>
                                            <td class="p-3 text-gray-300" x-text="activeDiffItem.album"></td>
                                            <td
                                                class="p-3 font-semibold"
                                                :class="catalogDiffMatches[selectedMatchIndex].album !== activeDiffItem.album ? 'text-brand bg-brand-muted' : 'text-gray-300'"
                                                x-text="catalogDiffMatches[selectedMatchIndex].album">
                                            </td>
                                        </tr>

                                        <!-- Год -->
                                        <tr>
                                            <td class="p-3 font-semibold text-gray-400">Год выпуска</td>
                                            <td class="p-3 text-gray-300" x-text="activeDiffItem.year || 'Не указан'"></td>
                                            <td
                                                class="p-3 font-semibold"
                                                :class="catalogDiffMatches[selectedMatchIndex].year && catalogDiffMatches[selectedMatchIndex].year !== activeDiffItem.year ? 'text-brand bg-brand-muted' : 'text-gray-300'"
                                                x-text="catalogDiffMatches[selectedMatchIndex].year || '—'">
                                            </td>
                                        </tr>

                                        <!-- Номер трека -->
                                        <tr>
                                            <td class="p-3 font-semibold text-gray-400">Номер дорожки</td>
                                            <td class="p-3 text-gray-300" x-text="activeDiffItem.track_number || 1"></td>
                                            <td
                                                class="p-3 font-semibold"
                                                :class="catalogDiffMatches[selectedMatchIndex].track_number && catalogDiffMatches[selectedMatchIndex].track_number !== activeDiffItem.track_number ? 'text-brand bg-brand-muted' : 'text-gray-300'"
                                                x-text="catalogDiffMatches[selectedMatchIndex].track_number || 1">
                                            </td>
                                        </tr>

                                        <!-- Студийная обложка -->
                                        <tr>
                                            <td class="p-3 font-semibold text-gray-400">Студийная обложка</td>
                                            <td class="p-3 text-gray-500">Встроенная в MP3</td>
                                            <td class="p-3">
                                                <template x-if="catalogDiffMatches[selectedMatchIndex].cover_url">
                                                    <div class="flex items-center space-x-2">
                                                        <img :src="catalogDiffMatches[selectedMatchIndex].cover_url" class="w-10 h-10 rounded border border-gray-700 object-cover" />
                                                        <span class="text-xs text-brand font-medium">Будет загружена студийная обложка (1000×1000)</span>
                                                    </div>
                                                </template>
                                                <template x-if="!catalogDiffMatches[selectedMatchIndex].cover_url">
                                                    <span class="text-gray-500">Без обложки</span>
                                                </template>
                                            </td>
                                        </tr>
                                    </tbody>
                                </table>
                            </div>
                        </template>
                    </div>
                </template>
            </div>

            <!-- Подвал модального окна -->
            <div class="p-5 border-t border-surface-border flex items-center justify-between bg-surface-base/80">
                <button
                    @click="closeTagDiffModal()"
                    class="px-4 py-2 bg-gray-800 hover:bg-gray-700 text-gray-300 rounded-lg text-xs font-medium transition">
                    Отмена
                </button>
                <div class="flex items-center space-x-3">
                    <button
                        @click="fixTagIssue(activeDiffItem); closeTagDiffModal()"
                        class="px-4 py-2 bg-surface-elevated hover:bg-surface-hover text-brand border border-brand/30 rounded-lg text-xs font-semibold transition active:scale-95">
                        Применить локальное исправление
                    </button>
                    <button
                        @click="applyDiffMatch(catalogDiffMatches[selectedMatchIndex])"
                        :disabled="isApplyingCatalog || catalogDiffMatches.length === 0 || !catalogDiffMatches[selectedMatchIndex]"
                        class="px-5 py-2 bg-gradient-to-r from-brand to-amber-500 hover:opacity-90 disabled:opacity-50 text-white rounded-lg text-xs font-semibold transition shadow-lg flex items-center space-x-2">
                        <template x-if="isApplyingCatalog">
                            <svg class="w-4 h-4 animate-spin" viewBox="0 0 24 24" fill="currentColor">
                                <path d="M12 20q-3.35 0-5.675-2.325T4 12t2.325-5.675T12 4q1.725 0 3.3.712T18 6.75V4h2v6h-6V8h3.2q-.8-1.4-2.187-2.2T12 5Q9.075 5 7.038 7.038T5 12t2.038 4.963T12 19q2.625 0 4.588-1.7t2.312-4.3h2.05q-.375 3.475-2.95 5.738T12 20"/>
                            </svg>
                        </template>
                        <span x-text="isApplyingCatalog ? 'Запись тегов...' : 'Применить каталожные теги'"></span>
                    </button>
                </div>
            </div>

        </div>
    </div>
</div>
{{ end }}
