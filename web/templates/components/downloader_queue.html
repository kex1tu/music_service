{{ define "downloader_queue" }}
<!-- ==================== СЕКЦИЯ: ОЧЕРЕДЬ ЗАГРУЗОК (DENSE STUDIO QUEUE) ==================== -->
<div class="bg-surface-panel border border-surface-border rounded-lg p-3.5 sm:p-5 shadow-panel space-y-3">
    <!-- Шапка очереди и метрики -->
    <div class="flex flex-wrap items-center justify-between gap-2.5 pb-2.5 border-b border-surface-borderSubtle">
        <div class="flex items-center space-x-2.5">
            <div class="w-7 h-7 rounded-md bg-white/[0.06] text-white flex items-center justify-center border border-white/[0.08] shadow-xs">
                <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M4 18q-.825 0-1.412-.587T2 16V4q0-.825.588-1.412T4 2h12q.825 0 1.413.588T18 4v12q0 .825-.587 1.413T16 18zm16 4q-.825 0-1.412-.587T18 20V7q0-.425.288-.712T19 6t.713.288T20 7v13h-13q-.425 0-.712-.288T6 19t.288-.712T7 18h13z"/>
                </svg>
            </div>
            <div>
                <div class="flex items-center space-x-2">
                    <h3 class="text-xs font-semibold text-white uppercase tracking-wider">Очередь задач</h3>
                    <template x-if="$store.app.queue.isPaused">
                        <span class="badge-studio text-[9px] text-amber-300 border-amber-500/30 animate-pulse">Пауза</span>
                    </template>
                </div>
                <p class="text-[11px] text-content-muted font-mono tabular-nums mt-0.5">
                    Активно: <span class="text-white font-semibold" x-text="$store.app.queue.activeCount"></span>
                    <template x-if="$store.app.queue.readyCount > 0">
                        <span> • Готово: <span class="text-emerald-400 font-semibold" x-text="$store.app.queue.readyCount"></span></span>
                    </template>
                    <template x-if="$store.app.queue.totalCount > 0">
                        <span> • Всего: <span class="text-content-secondary" x-text="$store.app.queue.totalCount"></span></span>
                    </template>
                </p>
            </div>
        </div>

        <!-- Кнопки управления всей очередью -->
        <div class="flex flex-wrap items-center gap-1.5">
            <!-- Кнопка Пауза / Возобновить -->
            <button
                type="button"
                @click="$store.app.queue.isPaused ? $store.app.queue.resumeQueue() : $store.app.queue.pauseQueue()"
                class="px-2.5 py-1 rounded-md text-xs font-medium transition flex items-center space-x-1 border"
                :class="$store.app.queue.isPaused ? 'bg-emerald-500/15 text-emerald-300 border-emerald-500/30 hover:bg-emerald-500/25' : 'bg-surface-elevated hover:bg-surface-hover text-content-secondary hover:text-white border-surface-border'"
                :title="$store.app.queue.isPaused ? 'Возобновить обработку очереди' : 'Приостановить запуск новых задач'">
                <template x-if="!$store.app.queue.isPaused">
                    <svg class="w-3 h-3" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M14 19V5h4v14zm-8 0V5h4v14z"/>
                    </svg>
                </template>
                <template x-if="$store.app.queue.isPaused">
                    <svg class="w-3 h-3" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M8 19V5l11 7z"/>
                    </svg>
                </template>
                <span x-text="$store.app.queue.isPaused ? 'Возобновить' : 'Пауза'"></span>
            </button>

            <!-- Кнопка Повторить ошибки -->
            <template x-if="$store.app.queue.errorCount > 0">
                <button
                    type="button"
                    @click="$store.app.queue.retryAllFailed()"
                    class="px-2.5 py-1 bg-amber-500/15 hover:bg-amber-500/25 text-amber-300 border border-amber-500/30 rounded-md text-xs font-medium transition flex items-center space-x-1"
                    title="Перезапустить все задачи с ошибкой">
                    <svg class="w-3 h-3" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 20q-3.35 0-5.675-2.325T4 12t2.325-5.675T12 4q1.725 0 3.3.712T18 6.75V4h2v6h-6V8h3.2q-.8-1.4-2.187-2.2T12 5Q9.075 5 7.038 7.037T5 12t2.038 4.963T12 19q2.425 0 4.313-1.463T18.65 14h2.075q-.475 3.275-2.875 5.138T12 20"/>
                    </svg>
                    <span>Ошибки (<span x-text="$store.app.queue.errorCount"></span>)</span>
                </button>
            </template>

            <!-- Кнопка Редактировать всё -->
            <template x-if="$store.app.queue.readyCount > 0">
                <button
                    type="button"
                    @click="$store.app.queue.openAllReadyJobsInTagEditor()"
                    class="px-3 py-1 bg-white hover:bg-zinc-200 text-zinc-950 rounded-md text-xs font-semibold transition flex items-center space-x-1 shadow-xs"
                    title="Открыть все готовые релизы в редакторе тегов">
                    <svg class="w-3 h-3" viewBox="0 0 24 24" fill="currentColor">
                        <path d="m21.4 14.25l-7.15 7.15q-.3.3-.675.45t-.75.15t-.75-.15t-.675-.45l-8.825-8.825q-.275-.275-.425-.637T2 11.175V4q0-.825.588-1.412T4 2h7.175q.4 0 .775.163t.65.437l8.8 8.825q.3.3.438.675t.137.75t-.137.738t-.438.662M6.5 8q.625 0 1.063-.437T8 6.5t-.437-1.062T6.5 5t-1.062.438T5 6.5t.438 1.063T6.5 8"/>
                    </svg>
                    <span>В теги всё (<span x-text="$store.app.queue.readyCount"></span>)</span>
                </button>
            </template>

            <!-- Кнопка Очистить завершенные -->
            <button
                type="button"
                @click="$store.app.queue.clearCompleted()"
                class="px-2.5 py-1 bg-surface-elevated hover:bg-surface-hover text-content-secondary hover:text-white border border-surface-border rounded-md text-xs transition"
                title="Очистить завершенные и ошибочные задачи">
                Очистить
            </button>
        </div>
    </div>

    <!-- Табличный список задач (Dense List) -->
    <div class="border border-surface-border rounded-md overflow-hidden bg-surface-base/40 divide-y divide-subtle">
        <template x-if="!$store.app.queue.jobs || $store.app.queue.jobs.length === 0">
            <div class="py-8 px-4 text-center text-content-muted text-xs">
                <span>Очередь загрузок пуста. Вставьте ссылку выше, чтобы начать скачивание.</span>
            </div>
        </template>

        <template x-for="j in $store.app.queue.jobs" :key="j.id">
            <div class="p-2.5 sm:px-3 sm:py-2.5 hover:bg-white/[0.03] transition-colors space-y-2 group">
                <div class="flex flex-wrap sm:flex-nowrap items-center justify-between gap-2.5 min-w-0">
                    
                    <!-- Колонка 1: Статус + Название + Шаг -->
                    <div class="flex items-center space-x-2.5 min-w-0 flex-1">
                        <span class="text-[9px] font-mono font-bold px-1.5 py-0.5 rounded-sm uppercase tracking-wider shrink-0 border"
                            :class="{
                                'bg-amber-500/10 text-amber-300 border-amber-500/30': j.status === 'QUEUED' || j.status === 'RESOLVING',
                                'bg-sky-500/10 text-sky-300 border-sky-500/30': j.status === 'DOWNLOADING',
                                'bg-purple-500/10 text-purple-300 border-purple-500/30': j.status === 'CONVERTING',
                                'bg-indigo-500/10 text-indigo-300 border-indigo-500/30': j.status === 'TAGGING',
                                'bg-emerald-500/10 text-emerald-300 border-emerald-500/30': j.status === 'READY',
                                'bg-amber-500/15 text-amber-200 border-amber-500/30': j.status === 'PARTIAL_READY',
                                'bg-rose-500/10 text-rose-300 border-rose-500/30': j.status === 'ERROR',
                                'bg-white/[0.04] text-content-muted border-white/[0.08]': j.status === 'CANCELLED',
                            }"
                            x-text="j.status">
                        </span>
                        <template x-if="j.is_backfill">
                            <span class="text-[9px] font-mono px-1 py-0.2 rounded-sm bg-sky-500/15 text-sky-300 border border-sky-500/30 uppercase tracking-wider shrink-0">
                                Дозагрузка
                            </span>
                        </template>
                        <div class="min-w-0 flex-1">
                            <div class="text-xs font-medium text-white truncate"
                                x-text="j.album_title ? `${j.artist_name ? j.artist_name + ' — ' : ''}${j.album_title}` : j.url"
                                :title="j.album_title ? `${j.artist_name ? j.artist_name + ' — ' : ''}${j.album_title}` : j.url">
                            </div>
                            <div class="text-[10px] text-content-muted font-mono truncate"
                                :class="j.status === 'ERROR' ? 'text-rose-400' : ''"
                                x-text="j.status === 'ERROR' ? `Ошибка: ${j.error || 'Сбой'}` : (j.current_step || 'Обработка...')">
                            </div>
                        </div>
                    </div>

                    <!-- Колонка 2: Прогресс-бар + Метрики -->
                    <div class="flex items-center space-x-2 shrink-0">
                        <template x-if="j.tracks && j.tracks.length > 0">
                            <button
                                type="button"
                                @click="toggleJobTracks(j.id)"
                                class="px-1.5 py-0.5 rounded-sm text-[10px] font-mono transition flex items-center space-x-1 border shadow-xs"
                                :class="isJobTracksExpanded(j.id) ? 'bg-white/10 text-white border-white/20' : 'bg-surface-elevated hover:bg-surface-hover text-content-secondary hover:text-white border-surface-border'"
                                title="Показать / скрыть треки задачи">
                                <span>Треки (<span x-text="j.tracks.length"></span>)</span>
                                <svg class="w-3 h-3 transition-transform duration-200" :class="{ 'rotate-180': isJobTracksExpanded(j.id) }" viewBox="0 0 24 24" fill="currentColor">
                                    <path d="M12 15.375L6 9.375l1.4-1.4l4.6 4.6l4.6-4.6l1.4 1.4z"/>
                                </svg>
                            </button>
                        </template>

                        <div class="w-16 sm:w-24 bg-white/[0.04] rounded-full h-1 overflow-hidden border border-white/[0.05]">
                            <div
                                class="bg-white h-1 rounded-full transition-all duration-300"
                                :style="`width: ${Math.min(100, Math.max(0, Math.round(j.progress || 0)))}%`"></div>
                        </div>

                        <span class="text-xs text-white font-mono font-semibold tabular-nums w-10 text-right" x-text="`${Math.min(100, Math.max(0, Math.round(j.progress || 0)))}%`"></span>
                    </div>

                    <!-- Колонка 3: Кнопки действий (Адаптивный ховер по правилу 1) -->
                    <div class="opacity-100 md:opacity-0 md:group-hover:opacity-100 focus-within:opacity-100 transition-opacity flex items-center space-x-1 shrink-0">
                        <template x-if="(j.status === 'READY' || j.status === 'PARTIAL_READY') && j.is_backfill">
                            <button
                                type="button"
                                @click="$store.app.queue.openBackfillJobInTagEditor(j)"
                                class="px-2 py-1 bg-white hover:bg-zinc-200 text-zinc-950 rounded-sm text-xs font-semibold transition shadow-xs"
                                title="Редактировать теги всего релиза">
                                Весь релиз
                            </button>
                        </template>
                        <template x-if="(j.status === 'READY' || j.status === 'PARTIAL_READY') && !j.is_backfill">
                            <div class="flex items-center space-x-1">
                                <button
                                    type="button"
                                    @click="$store.app.queue.acceptJobDirectly(j.id)"
                                    class="px-2 py-1 bg-white hover:bg-zinc-200 text-zinc-950 rounded-sm text-xs font-semibold transition shadow-xs flex items-center space-x-1"
                                    title="Принять релиз в медиатеку в 1 клик">
                                    <svg class="w-3 h-3" viewBox="0 0 24 24" fill="currentColor">
                                        <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
                                    </svg>
                                    <span>Принять</span>
                                </button>
                                <button
                                    type="button"
                                    @click="$store.app.queue.openJobInTagEditor(j.id)"
                                    class="px-2 py-1 bg-surface-elevated hover:bg-surface-hover text-content-secondary hover:text-white rounded-sm text-xs font-medium border border-surface-border transition shadow-xs flex items-center space-x-1"
                                    title="Открыть в редакторе тегов">
                                    <span>В теги</span>
                                </button>
                            </div>
                        </template>
                        <template x-if="j.status === 'PARTIAL_READY'">
                            <button
                                type="button"
                                @click="$store.app.queue.cancelJob(j.id)"
                                class="px-2 py-1 bg-surface-elevated hover:bg-rose-500/20 text-content-muted hover:text-rose-200 rounded-sm text-xs border border-surface-border transition"
                                title="Отменить оставшиеся / удалить">
                                Отмена
                            </button>
                        </template>
                        <template x-if="j.status !== 'READY' && j.status !== 'PARTIAL_READY' && j.status !== 'ERROR' && j.status !== 'CANCELLED'">
                            <button
                                type="button"
                                @click="$store.app.queue.cancelJob(j.id)"
                                class="px-2 py-1 bg-rose-500/10 hover:bg-rose-500/20 text-rose-300 rounded-sm text-xs border border-rose-500/30 transition">
                                Отмена
                            </button>
                        </template>
                        <template x-if="j.status === 'ERROR'">
                            <button
                                type="button"
                                @click="$store.app.queue.retryJob(j.id)"
                                class="px-2 py-1 bg-amber-500/15 hover:bg-amber-500/25 text-amber-300 rounded-sm text-xs font-medium border border-amber-500/30 transition shadow-xs"
                                title="Повторить загрузку">
                                Повторить
                            </button>
                        </template>
                        <template x-if="j.status === 'ERROR' || j.status === 'CANCELLED'">
                            <button
                                type="button"
                                @click="$store.app.queue.cancelJob(j.id)"
                                class="px-2 py-1 bg-surface-elevated hover:bg-surface-hover text-content-muted hover:text-white rounded-sm text-xs border border-surface-border transition"
                                title="Удалить из списка">
                                Удалить
                            </button>
                        </template>
                    </div>

                </div>

                <!-- Раскрывающийся список треков задачи из очереди -->
                <template x-if="j.tracks && j.tracks.length > 0 && isJobTracksExpanded(j.id)">
                    <div class="pt-2 border-t border-surface-borderSubtle space-y-1.5 animate-fade-in pl-2 sm:pl-4">
                        <template x-for="(track, tIdx) in j.tracks" :key="track.track_id || tIdx">
                            <div class="p-1.5 rounded-sm bg-surface-base/80 border border-surface-borderSubtle space-y-1"
                                :class="{ 'border-white/20': isVersionsOpen(track.track_id) }">
                                <div class="flex flex-wrap sm:flex-nowrap items-center justify-between gap-1.5">
                                    <div class="flex items-center space-x-2 min-w-0 flex-1">
                                        <span class="w-4 text-center text-[10px] font-mono text-content-muted shrink-0" x-text="track.track_number || (tIdx + 1)"></span>
                                        <div class="min-w-0 flex-1">
                                            <div class="text-xs font-medium text-white truncate" x-text="track.title"></div>
                                            <div class="text-[10px] text-content-muted truncate" x-text="track.artist"></div>
                                        </div>
                                    </div>
                                    <div class="flex items-center space-x-1.5 shrink-0">
                                        <span class="text-[10px] font-mono tabular-nums text-content-muted" x-text="window.AppFormatters ? window.AppFormatters.formatDuration(track.duration) : track.duration + 'с'"></span>

                                        <!-- Телеметрия качества звука (Cutoff & Spek) -->
                                        <template x-if="track.audio_quality">
                                            <span
                                                class="badge-studio text-[8px] py-0 px-1 border shrink-0 transition"
                                                :class="{
                                                    'text-emerald-300 border-emerald-500/30': track.audio_quality.quality_tier === 'true_320k' || track.audio_quality.quality_tier === 'lossless',
                                                    'text-sky-300 border-sky-500/30': track.audio_quality.quality_tier === 'hq_opus',
                                                    'text-amber-300 border-amber-500/30': track.audio_quality.quality_tier === 'upscaled_128k'
                                                }"
                                                :title="track.audio_quality.description">
                                                <span x-text="track.audio_quality.source_codec.toUpperCase() + (track.audio_quality.source_bitrate > 0 ? ' ' + Math.round(track.audio_quality.source_bitrate/1000) + 'k' : '')"></span>
                                                <span>•</span>
                                                <span x-text="'~' + (track.audio_quality.cutoff_hz/1000).toFixed(1) + ' kHz'"></span>
                                            </span>
                                        </template>

                                        <!-- Бейдж оригинальности -->
                                        <template x-if="track.version_status">
                                            <span
                                                class="badge-studio text-[8px] py-0 px-1 border shrink-0 transition"
                                                :class="getVersionBadge(track.version_status).badgeClass"
                                                :title="getVersionBadge(track.version_status).tooltip">
                                                <span x-text="getVersionBadge(track.version_status).label"></span>
                                            </span>
                                        </template>

                                        <!-- Кнопка Выбрать источник вручную (Source Picker) -->
                                        <button
                                            type="button"
                                            @click.stop="$store.sourcePicker.openForQueueTrack(j, track)"
                                            class="px-1.5 py-0.5 rounded-sm text-[9px] font-mono transition flex items-center space-x-1 border shadow-xs"
                                            :class="track.status === 'waiting_source' || track.status === 'error' ? 'bg-amber-500/20 text-amber-300 border-amber-500/40 hover:bg-amber-500/30 animate-pulse' : 'bg-surface-elevated hover:bg-surface-hover text-content-secondary hover:text-white border-surface-border'"
                                            title="Выбрать источник вручную">
                                            <span x-text="track.status === 'waiting_source' || track.status === 'error' ? 'Выбрать источник' : 'Источник'"></span>
                                        </button>

                                        <!-- Кнопка версий -->
                                        <template x-if="track.candidates && track.candidates.length > 1">
                                            <button
                                                type="button"
                                                @click.stop="toggleVersions(track.track_id)"
                                                class="px-1.5 py-0.5 rounded-sm text-[9px] font-mono transition flex items-center space-x-1 border shadow-xs"
                                                :class="isVersionsOpen(track.track_id) ? 'bg-white/10 text-white border-white/30' : 'bg-surface-elevated hover:bg-surface-hover text-content-secondary hover:text-white border-surface-border'"
                                                title="Выбрать альтернативную версию">
                                                <span>Версии (<span x-text="track.candidates.length"></span>)</span>
                                            </button>
                                        </template>
                                    </div>
                                </div>

                                <!-- Quick-Listen Spots -->
                                <template x-if="track.quick_listen_spots && track.quick_listen_spots.length > 0">
                                    <div class="flex flex-wrap items-center gap-1 mt-1 pt-0.5 border-t border-surface-borderSubtle">
                                        <span class="text-[9px] text-content-muted font-mono">Проверить:</span>
                                        <template x-for="spot in track.quick_listen_spots" :key="spot.time_sec">
                                            <button type="button"
                                                    @click.stop="$store.player.playCensorshipSpot('/api/stream?path=' + encodeURIComponent(track.converted_path || ''), spot, track.title, track.artist)"
                                                    :title="`Строка: '${spot.line_text}'`"
                                                    :class="spot.category === 'DRUG_COAP_6_13' ? 'bg-rose-500/15 hover:bg-rose-500/25 text-rose-300 border-rose-500/30' : (spot.category === 'SUSPECT_MARKER' ? 'bg-amber-500/15 hover:bg-amber-500/25 text-amber-300 border-amber-500/30' : 'bg-purple-500/15 hover:bg-purple-500/25 text-purple-300 border-purple-500/30')"
                                                    class="px-1 py-0.2 rounded-sm text-[8px] font-mono border transition-colors flex items-center gap-0.5">
                                                <span>▶</span>
                                                <span x-text="spot.time_str"></span>
                                                <span class="font-sans" x-text="`«${spot.word}»`"></span>
                                            </button>
                                        </template>
                                    </div>
                                </template>

                                <!-- Кандидаты версии -->
                                <template x-if="isVersionsOpen(track.track_id)">
                                    <div class="p-1.5 rounded-sm bg-surface-panel border border-surface-borderSubtle space-y-1 mt-1 animate-fade-in">
                                        <div class="space-y-0.5 max-h-40 overflow-y-auto pr-0.5">
                                            <template x-for="(cand, cIdx) in track.candidates" :key="cand.url || cIdx">
                                                <div
                                                    class="p-1 rounded-sm border transition flex flex-wrap sm:flex-nowrap items-center justify-between gap-1"
                                                    :class="cand.url === track.audio_source_url ? 'bg-white/[0.08] border-white/20' : 'bg-surface-elevated/60 border-surface-border'">
                                                    <div class="min-w-0 flex-1">
                                                        <span class="text-xs text-white truncate block" x-text="cand.title"></span>
                                                        <span class="text-[9px] font-mono text-content-muted" x-text="`Длит: ${window.AppFormatters ? window.AppFormatters.formatDuration(cand.duration) : cand.duration + 'с'} • Δ: ${formatDelta(cand.delta_seconds)}`"></span>
                                                    </div>
                                                    <div class="shrink-0">
                                                        <template x-if="cand.url === track.audio_source_url">
                                                            <span class="text-[10px] text-white font-mono font-semibold px-1">Выбрана</span>
                                                        </template>
                                                        <template x-if="cand.url !== track.audio_source_url">
                                                            <button
                                                                type="button"
                                                                @click="switchTrackVersion(track, cand.url)"
                                                                :disabled="switchingTrackId === track.track_id"
                                                                class="px-1.5 py-0.5 bg-surface-elevated hover:bg-white hover:text-zinc-950 text-content-secondary rounded-sm text-[10px] font-mono border border-surface-border transition">
                                                                Выбрать
                                                            </button>
                                                        </template>
                                                    </div>
                                                </div>
                                            </template>
                                        </div>
                                    </div>
                                </template>

                            </div>
                        </template>
                    </div>
                </template>

            </div>
        </template>
    </div>
</div>
{{ end }}
