{{ define "downloader_queue" }}
<!-- ==================== СЕКЦИЯ: ОЧЕРЕДЬ ЗАГРУЗОК ==================== -->
<div class="bg-surface-panel border border-surface-border rounded-2xl p-6 shadow-panel space-y-4">
    <div class="flex flex-wrap items-center justify-between gap-3 border-b border-surface-border pb-4">
        <div class="flex items-center space-x-3">
            <div class="w-8 h-8 rounded-lg bg-brand-muted text-brand flex items-center justify-center border border-brand/20">
                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M4 18q-.825 0-1.412-.587T2 16V4q0-.825.588-1.412T4 2h12q.825 0 1.413.588T18 4v12q0 .825-.587 1.413T16 18zm16 4q-.825 0-1.412-.587T18 20V7q0-.425.288-.712T19 6t.713.288T20 7v13h-13q-.425 0-.712-.288T6 19t.288-.712T7 18h13z"/>
                </svg>
            </div>
            <div>
                <h3 class="text-base font-bold text-white tracking-tight">Список задач в очереди</h3>
                <p class="text-xs text-content-muted mt-0.5">
                    Активно: <span class="text-brand font-semibold" x-text="$store.app.queue.activeCount"></span>
                    <template x-if="$store.app.queue.readyCount > 0">
                        <span> • Готово: <span class="text-brand font-semibold" x-text="$store.app.queue.readyCount"></span></span>
                    </template>
                    <template x-if="$store.app.queue.totalCount > 0">
                        <span> • Всего треков: <span class="text-content-secondary font-mono" x-text="$store.app.queue.totalCount"></span></span>
                    </template>
                </p>
            </div>
        </div>
        <div class="flex items-center space-x-2">
            <template x-if="$store.app.queue.readyCount > 0">
                <button
                    type="button"
                    @click="$store.app.queue.openAllReadyJobsInTagEditor()"
                    class="px-3.5 py-1.5 bg-brand hover:bg-brand-hover text-white rounded-lg text-xs font-bold transition flex items-center space-x-1.5 shadow-md shadow-brand/20 animate-pulse"
                    title="Открыть все готовые релизы в редакторе тегов">
                    <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor">
                        <path d="m21.4 14.25l-7.15 7.15q-.3.3-.675.45t-.75.15t-.75-.15t-.675-.45l-8.825-8.825q-.275-.275-.425-.637T2 11.175V4q0-.825.588-1.412T4 2h7.175q.4 0 .775.163t.65.437l8.8 8.825q.3.3.438.675t.137.75t-.137.738t-.438.662M6.5 8q.625 0 1.063-.437T8 6.5t-.437-1.062T6.5 5t-1.062.438T5 6.5t.438 1.063T6.5 8"/>
                    </svg>
                    <span>Редактировать всё (<span x-text="$store.app.queue.readyCount"></span>)</span>
                </button>
            </template>
            <button
                type="button"
                @click="$store.app.queue.clearCompleted()"
                class="px-3 py-1.5 bg-surface-elevated hover:bg-surface-hover text-content-secondary hover:text-white border border-surface-border rounded-lg text-xs transition"
                title="Очистить завершенные и ошибочные задачи">
                Очистить завершённые
            </button>
        </div>
    </div>

    <!-- Список карточек задач -->
    <div class="space-y-2.5">
        <template x-if="!$store.app.queue.jobs || $store.app.queue.jobs.length === 0">
            <div class="py-10 text-center text-content-muted text-xs border border-dashed border-surface-border rounded-xl">
                <svg class="w-8 h-8 mx-auto text-surface-border mb-2" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M4 18q-.825 0-1.412-.587T2 16V4q0-.825.588-1.412T4 2h12q.825 0 1.413.588T18 4v12q0 .825-.587 1.413T16 18zm16 4q-.825 0-1.412-.587T18 20V7q0-.425.288-.712T19 6t.713.288T20 7v13h-13q-.425 0-.712-.288T6 19t.288-.712T7 18h13z"/>
                </svg>
                <span>Очередь загрузок пуста. Вставьте ссылку выше, чтобы начать скачивание.</span>
            </div>
        </template>

        <template x-for="j in $store.app.queue.jobs" :key="j.id">
            <div class="p-3.5 rounded-xl bg-surface-input border border-surface-border hover:border-brand/40 transition space-y-2.5 shadow-sm">
                <div class="flex flex-wrap items-center justify-between gap-2">
                    <div class="flex items-center space-x-2.5 min-w-0 flex-1">
                        <span class="text-[10px] font-bold px-2 py-0.5 rounded uppercase tracking-wider shrink-0"
                            :class="{
                                'bg-yellow-500/20 text-yellow-400 border border-yellow-500/30': j.status === 'QUEUED' || j.status === 'RESOLVING',
                                'bg-blue-500/20 text-blue-400 border border-blue-500/30': j.status === 'DOWNLOADING',
                                'bg-purple-500/20 text-purple-400 border border-purple-500/30': j.status === 'CONVERTING',
                                'bg-indigo-500/20 text-indigo-400 border border-indigo-500/30': j.status === 'TAGGING',
                                'bg-brand-muted text-brand border border-brand/30': j.status === 'READY',
                                'bg-red-500/20 text-red-400 border border-red-500/30': j.status === 'ERROR',
                                'bg-surface-elevated text-content-muted border border-surface-border': j.status === 'CANCELLED',
                            }"
                            x-text="j.status">
                        </span>
                        <template x-if="j.is_backfill">
                            <span class="text-[10px] font-bold px-1.5 py-0.5 rounded bg-sky-500/20 text-sky-300 border border-sky-500/30 uppercase tracking-wider shrink-0">
                                Дозагрузка
                            </span>
                        </template>
                        <div class="min-w-0 flex-1">
                            <div class="text-xs font-semibold text-content-primary truncate"
                                x-text="j.album_title ? `${j.artist_name ? j.artist_name + ' — ' : ''}${j.album_title}` : j.url"
                                :title="j.album_title ? `${j.artist_name ? j.artist_name + ' — ' : ''}${j.album_title}` : j.url">
                            </div>
                        </div>
                    </div>
                    <div class="flex items-center space-x-2 shrink-0">
                        <template x-if="j.total_tracks > 1">
                            <span class="text-[11px] text-content-muted font-mono" x-text="`(${j.completed_tracks}/${j.total_tracks})`"></span>
                        </template>
                        <span class="text-xs text-brand font-bold font-mono" x-text="`${Math.min(100, Math.max(0, Math.round(j.progress || 0)))}%`"></span>
                    </div>
                </div>

                <!-- Прогресс-бар задачи -->
                <div class="w-full bg-surface-base rounded-full h-1.5 overflow-hidden border border-surface-borderSubtle">
                    <div
                        class="bg-gradient-to-r from-brand to-amber-400 h-1.5 rounded-full transition-all duration-300 shadow-sm shadow-brand/40"
                        :style="`width: ${Math.min(100, Math.max(0, Math.round(j.progress || 0)))}%`"></div>
                </div>

                <!-- Подвал карточки: текущий шаг и кнопки действий -->
                <div class="flex items-center justify-between text-xs text-content-muted pt-0.5">
                    <div class="min-w-0 flex-1 mr-3 truncate text-[11px]">
                        <template x-if="j.status === 'ERROR'">
                            <span class="text-red-400 font-medium truncate" x-text="`Ошибка: ${j.error || 'Сбой загрузки'}`"></span>
                        </template>
                        <template x-if="j.status !== 'ERROR'">
                            <span class="text-content-secondary truncate" x-text="j.current_step || 'Обработка...'"></span>
                        </template>
                    </div>
                    <div class="flex items-center space-x-2 shrink-0">
                        <template x-if="j.status === 'READY' && j.is_backfill">
                            <button
                                type="button"
                                @click="$store.app.queue.openBackfillJobInTagEditor(j)"
                                class="px-2.5 py-1 bg-brand hover:bg-brand-hover text-white rounded-md text-xs font-semibold transition shadow-sm"
                                title="Редактировать теги всего релиза">
                                Весь релиз
                            </button>
                        </template>
                        <template x-if="j.status === 'READY' && !j.is_backfill">
                            <button
                                type="button"
                                @click="$store.app.queue.openJobInTagEditor(j.id)"
                                class="px-2.5 py-1 bg-brand hover:bg-brand-hover text-white rounded-md text-xs font-semibold transition shadow-sm flex items-center space-x-1">
                                <svg class="w-3 h-3" viewBox="0 0 24 24" fill="currentColor">
                                    <path d="m21.4 14.25l-7.15 7.15q-.3.3-.675.45t-.75.15t-.75-.15t-.675-.45l-8.825-8.825q-.275-.275-.425-.637T2 11.175V4q0-.825.588-1.412T4 2h7.175q.4 0 .775.163t.65.437l8.8 8.825q.3.3.438.675t.137.75t-.137.738t-.438.662M6.5 8q.625 0 1.063-.437T8 6.5t-.437-1.062T6.5 5t-1.062.438T5 6.5t.438 1.063T6.5 8"/>
                                </svg>
                                <span>В теги</span>
                            </button>
                        </template>
                        <template x-if="j.status !== 'READY' && j.status !== 'ERROR' && j.status !== 'CANCELLED'">
                            <button
                                type="button"
                                @click="$store.app.queue.cancelJob(j.id)"
                                class="px-2 py-1 bg-red-900/60 hover:bg-red-800 text-red-200 rounded-md text-xs border border-red-700/50 transition">
                                Отмена
                            </button>
                        </template>
                        <template x-if="j.status === 'ERROR'">
                            <button
                                type="button"
                                @click="$store.app.queue.retryJob(j.id)"
                                class="px-2.5 py-1 bg-amber-600 hover:bg-amber-500 text-white rounded-md text-xs font-semibold transition shadow-sm"
                                title="Повторить загрузку">
                                Повторить
                            </button>
                        </template>
                        <template x-if="j.status === 'ERROR' || j.status === 'CANCELLED'">
                            <button
                                type="button"
                                @click="$store.app.queue.cancelJob(j.id)"
                                class="px-2 py-1 bg-surface-elevated hover:bg-surface-hover text-content-muted hover:text-white rounded-md text-xs border border-surface-border transition"
                                title="Удалить из списка">
                                Удалить
                            </button>
                        </template>
                    </div>
                </div>
            </div>
        </template>
    </div>
</div>
{{ end }}
