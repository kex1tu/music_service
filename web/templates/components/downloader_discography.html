{{ define "downloader_discography" }}
<!-- ==================== МОДАЛЬНОЕ ОКНО: СЕЛЕКТОР ДИСКОГРАФИИ АРТИСТА ==================== -->
<div
    x-show="showDiscographyModal"
    x-cloak
    @click.self="closeDiscographyModal()"
    @keydown.escape.window="closeDiscographyModal()"
    class="fixed inset-0 z-50 flex items-center justify-center modal-backdrop p-4">
    <div
        @click.stop
        class="bg-gray-900 border border-gray-800 rounded-2xl w-full max-w-4xl max-h-[90vh] flex flex-col shadow-2xl overflow-hidden animate-scale-in">

        <!-- Шапка модального окна дискографии -->
        <div class="px-6 py-4 border-b border-gray-800 flex items-center justify-between bg-gray-950/80 flex-shrink-0">
            <div class="flex items-center space-x-3.5 min-w-0">
                <template x-if="discographyData && discographyData.artist_avatar">
                    <img :src="discographyData.artist_avatar" class="w-12 h-12 rounded-full object-cover border border-gray-700 shadow-md flex-shrink-0">
                </template>
                <template x-if="!discographyData || !discographyData.artist_avatar">
                    <div class="w-12 h-12 rounded-full bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 flex items-center justify-center font-bold text-lg flex-shrink-0">
                        <svg class="w-6 h-6" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4s-4 1.79-4 4s1.79 4 4 4m0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4"/>
                        </svg>
                    </div>
                </template>
                <div class="min-w-0">
                    <div class="flex items-center space-x-2">
                        <h3 class="text-base font-bold text-white truncate" x-text="discographyData?.artist_name || 'Дискография исполнителя'"></h3>
                        <span
                            class="px-2 py-0.5 rounded text-[10px] font-bold uppercase tracking-wider border flex-shrink-0"
                            :class="{
                                'bg-pink-500/20 text-pink-300 border-pink-500/30': discographyData?.source === 'deezer',
                                'bg-emerald-500/20 text-emerald-300 border-emerald-500/30': discographyData?.source === 'spotify',
                                'bg-yellow-500/20 text-yellow-300 border-yellow-500/30': discographyData?.source === 'yandex',
                                'bg-red-500/20 text-red-300 border-red-500/30': discographyData?.source === 'applemusic' || discographyData?.source === 'youtube',
                                'bg-gray-800 text-gray-300 border-gray-700': !discographyData?.source,
                            }"
                            x-text="discographyData?.source ? discographyData.source.toUpperCase() : ''">
                        </span>
                    </div>
                    <p class="text-xs text-gray-400 mt-0.5">
                        Найдено релизов: <span class="text-emerald-400 font-semibold" x-text="discographyData?.total_releases || 0"></span>
                    </p>
                </div>
            </div>
            <button
                type="button"
                @click="closeDiscographyModal()"
                class="text-gray-400 hover:text-white p-1.5 rounded-lg hover:bg-gray-800 transition flex-shrink-0"
                title="Закрыть (Esc)">
                <svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor">
                    <path d="m12 13.4l-4.9 4.9q-.275.275-.7.275t-.7-.275t-.275-.7t.275-.7l4.9-4.9l-4.9-4.9q-.275-.275-.275-.7t.275-.7t.7-.275t.7.275l4.9 4.9l4.9-4.9q.275-.275.7-.275t.7.275t.275.7t-.275.7L13.4 12l4.9 4.9q.275.275.275.7t-.275.7t-.7.275t-.7-.275z"/>
                </svg>
            </button>
        </div>

        <!-- Панель фильтров и быстрого поиска -->
        <div class="px-6 py-3 border-b border-gray-800 bg-gray-900/60 flex flex-wrap items-center justify-between gap-3 flex-shrink-0">
            <!-- Фильтры по типам -->
            <div class="flex items-center space-x-1 text-xs">
                <button
                    type="button"
                    @click="discographyFilter = 'all'"
                    :class="discographyFilter === 'all' ? 'bg-emerald-600/30 text-emerald-300 border-emerald-500/50' : 'bg-gray-800/80 text-gray-400 hover:text-gray-200 border-gray-700/60'"
                    class="px-2.5 py-1 rounded-md border font-medium transition">
                    Все
                </button>
                <button
                    type="button"
                    @click="discographyFilter = 'album'"
                    :class="discographyFilter === 'album' ? 'bg-emerald-600/30 text-emerald-300 border-emerald-500/50' : 'bg-gray-800/80 text-gray-400 hover:text-gray-200 border-gray-700/60'"
                    class="px-2.5 py-1 rounded-md border font-medium transition">
                    Альбомы
                </button>
                <button
                    type="button"
                    @click="discographyFilter = 'single'"
                    :class="discographyFilter === 'single' ? 'bg-emerald-600/30 text-emerald-300 border-emerald-500/50' : 'bg-gray-800/80 text-gray-400 hover:text-gray-200 border-gray-700/60'"
                    class="px-2.5 py-1 rounded-md border font-medium transition">
                    Синглы & EP
                </button>
                <button
                    type="button"
                    @click="discographyFilter = 'compilation'"
                    :class="discographyFilter === 'compilation' ? 'bg-emerald-600/30 text-emerald-300 border-emerald-500/50' : 'bg-gray-800/80 text-gray-400 hover:text-gray-200 border-gray-700/60'"
                    class="px-2.5 py-1 rounded-md border font-medium transition">
                    Сборники
                </button>
            </div>

            <!-- Поиск и групповой выбор -->
            <div class="flex items-center space-x-2 flex-1 sm:flex-initial justify-end">
                <div class="relative w-44 sm:w-56">
                    <input
                        type="text"
                        x-model="discographySearch"
                        placeholder="Фильтр по названию..."
                        class="w-full bg-gray-950 border border-gray-800 rounded-lg pl-7 pr-2 py-1 text-xs text-white placeholder-gray-500 focus:outline-none focus:border-emerald-500">
                    <svg class="w-3.5 h-3.5 absolute left-2 top-2 text-gray-500 pointer-events-none" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M9.5 16q-2.725 0-4.612-1.888T3 9.5t1.888-4.612T9.5 3t4.613 1.888T16 9.5q0 1.1-.35 2.075T14.7 13.3l5.6 5.6q.275.275.275.7t-.275.7t-.7.275t-.7-.275l-5.6-5.6q-.75.6-1.725.95T9.5 16m0-2q1.875 0 3.188-1.312T14 9.5t-1.312-3.187T9.5 5T6.313 6.313T5 9.5t1.313 3.188T9.5 14"/>
                    </svg>
                </div>
                <button
                    type="button"
                    @click="selectAllFiltered(true)"
                    class="px-2.5 py-1 rounded text-xs text-emerald-400 hover:text-emerald-300 hover:bg-gray-800 transition"
                    title="Выбрать все отфильтрованные релизы">
                    Выбрать все
                </button>
                <button
                    type="button"
                    @click="selectAllFiltered(false)"
                    class="px-2 py-1 rounded text-xs text-gray-400 hover:text-gray-200 hover:bg-gray-800 transition"
                    title="Снять выделение">
                    Снять
                </button>
            </div>
        </div>

        <!-- Сетка релизов дискографии -->
        <div class="flex-1 overflow-y-auto p-4 sm:p-6 min-h-[250px]">
            <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-3">
                <template x-for="rel in filteredReleases()" :key="rel.id">
                    <div
                        class="border rounded-xl p-2.5 flex items-center space-x-3 cursor-pointer transition select-none group/item"
                        :class="selectedReleaseIds[rel.id] ? 'border-emerald-500/70 bg-emerald-950/20' : 'border-gray-800 bg-gray-950/50 hover:border-gray-700 hover:bg-gray-850'"
                        @click="toggleRelease(rel.id)">
                        <input
                            type="checkbox"
                            :checked="selectedReleaseIds[rel.id]"
                            @click.stop="toggleRelease(rel.id)"
                            class="rounded bg-gray-900 border-gray-700 text-emerald-500 focus:ring-0 focus:ring-offset-0 flex-shrink-0 cursor-pointer">
                        <div class="w-12 h-12 rounded-lg bg-gray-900 border border-gray-800 overflow-hidden flex-shrink-0 relative">
                            <template x-if="rel.cover_url">
                                <img :src="rel.cover_url" class="w-full h-full object-cover" loading="lazy">
                            </template>
                            <template x-if="!rel.cover_url">
                                <div class="w-full h-full flex items-center justify-center text-gray-600">
                                    <svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor">
                                        <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55c-2.21 0-4 1.79-4 4s1.79 4 4 4s4-1.79 4-4V7h4V3z"/>
                                    </svg>
                                </div>
                            </template>
                        </div>
                        <div class="min-w-0 flex-1">
                            <h4 class="text-xs font-semibold text-white truncate group-hover/item:text-emerald-400 transition" :title="rel.title" x-text="rel.title"></h4>
                            <div class="flex items-center space-x-2 text-[11px] text-gray-400 mt-0.5">
                                <span x-show="rel.year" x-text="rel.year"></span>
                                <span x-show="rel.year" class="text-gray-600">•</span>
                                <span class="uppercase text-[9px] px-1.5 py-0.5 rounded bg-gray-800 text-gray-300 font-medium" x-text="rel.type || 'album'"></span>
                                <template x-if="rel.track_count">
                                    <span class="text-gray-500 font-mono text-[10px]" x-text="`${rel.track_count} тр.`"></span>
                                </template>
                            </div>
                        </div>
                    </div>
                </template>
            </div>
            <template x-if="filteredReleases().length === 0">
                <div class="py-12 text-center text-gray-500 text-xs">
                    Релизы не найдены по заданным критериям фильтрации
                </div>
            </template>
        </div>

        <!-- Подвал модального окна -->
        <div class="px-6 py-4 border-t border-gray-800 bg-gray-950 flex items-center justify-between flex-shrink-0">
            <div class="text-xs text-gray-400">
                Выбрано релизов: <span class="font-bold text-emerald-400" x-text="getSelectedCount()"></span> из <span x-text="discographyData?.total_releases || 0"></span>
            </div>
            <div class="flex items-center space-x-3">
                <button
                    type="button"
                    @click="closeDiscographyModal()"
                    class="px-4 py-2 bg-gray-800 hover:bg-gray-700 text-gray-300 text-xs font-semibold rounded-lg transition">
                    Отмена
                </button>
                <button
                    type="button"
                    @click="submitDiscographyBatch()"
                    :disabled="getSelectedCount() === 0 || isSubmitting"
                    class="px-6 py-2 bg-emerald-600 hover:bg-emerald-500 disabled:opacity-50 text-white text-xs font-bold rounded-lg transition flex items-center space-x-2 shadow-lg shadow-emerald-600/30">
                    <template x-if="isSubmitting">
                        <svg class="w-3.5 h-3.5 animate-spin" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M8.125 21.213q-1.825-.788-3.187-2.15t-2.15-3.188T2 11.988t.788-3.875t2.15-3.175t3.187-2.15T12 2q.425 0 .713.288T13 3t-.288.713T12 4Q8.675 4 6.337 6.338T4 12t2.338 5.663T12 20t5.663-2.337T20 12q0-.425.288-.712T21 11t.713.288T22 12q0 2.05-.788 3.875t-2.15 3.188t-3.175 2.15t-3.875.787t-3.887-.787"/>
                        </svg>
                    </template>
                    <template x-if="!isSubmitting">
                        <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M11 16V7.85l-2.6 2.6L7 9l5-5l5 5l-1.4 1.45l-2.6-2.6V16zm-7 4q-.825 0-1.412-.587T2 18v-3h2v3h16v-3h2v3q0 .825-.587 1.413T20 20z"/>
                        </svg>
                    </template>
                    <span x-text="`Скачать выбранное (${getSelectedCount()})`"></span>
                </button>
            </div>
        </div>
    </div>
</div>
{{ end }}
