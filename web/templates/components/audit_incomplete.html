{{ define "audit_incomplete" }}
<!-- СЕКЦИЯ 4: Неполные релизы -->
<div x-show="activeSubTab === 'incomplete'" class="space-y-4">
    <template x-if="!incompleteLoading && incompleteAlbums.length === 0">
        <div class="bg-surface-panel border border-surface-border rounded-xl p-8 text-center text-content-muted text-sm">
            Нет неполных или несверенных релизов в списке.
        </div>
    </template>

    <template x-if="incompleteLoading">
        <div class="bg-surface-panel border border-surface-border rounded-xl p-8 text-center text-content-muted text-sm flex items-center justify-center space-x-2">
            <svg class="w-4 h-4 animate-spin text-sky-400" aria-hidden="true" viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 20q-3.35 0-5.675-2.325T4 12t2.325-5.675T12 4q1.725 0 3.3.712T18 6.75V4h2v6h-6V8h3.2q-.8-1.4-2.187-2.2T12 5Q9.075 5 7.038 7.038T5 12t2.038 4.963T12 19q2.625 0 4.588-1.7t2.312-4.3h2.05q-.375 3.475-2.95 5.738T12 20"/>
            </svg>
            <span>Проверка целостности релизов...</span>
        </div>
    </template>

    <template x-if="!incompleteLoading && incompleteAlbums.length > 0">
        <div class="space-y-4">
            <template x-for="alb in incompleteAlbums" :key="alb.path">
                <div class="bg-surface-panel border border-surface-border rounded-xl p-5 shadow-panel space-y-4 transition hover:border-sky-500/40">
                    <!-- Шапка релиза -->
                    <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4 border-b border-surface-border pb-4">
                        <div class="flex items-center space-x-4 min-w-0">
                            <!-- Обложка -->
                            <div class="w-14 h-14 rounded-lg bg-surface-input flex items-center justify-center shrink-0 overflow-hidden border border-surface-border shadow-sm">
                                <template x-if="alb.cover_url">
                                    <img :src="alb.cover_url" class="w-full h-full object-cover" alt="Обложка релиза" />
                                </template>
                                <template x-if="!alb.cover_url">
                                    <svg class="w-7 h-7 text-sky-400/60" aria-hidden="true" viewBox="0 0 24 24" fill="currentColor">
                                        <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 14.5c-2.49 0-4.5-2.01-4.5-4.5S9.51 7.5 12 7.5s4.5 2.01 4.5 4.5-2.01 4.5-4.5 4.5zm0-5.5c-.55 0-1 .45-1 1s.45 1 1 1 1-.45 1-1-.45-1-1-1z"/>
                                    </svg>
                                </template>
                            </div>

                            <div class="min-w-0">
                                <div class="flex items-center space-x-2">
                                    <h4 class="text-sm font-bold text-content-primary truncate" x-text="alb.album" :title="alb.album"></h4>
                                    <template x-if="alb.year">
                                        <span class="text-xs text-content-muted font-mono" x-text="`(${alb.year})`"></span>
                                    </template>
                                </div>
                                <p class="text-xs text-content-secondary truncate" x-text="alb.artist" :title="alb.artist"></p>
                                <p class="text-xs text-content-muted font-mono truncate mt-0.5" x-text="alb.path" :title="alb.path"></p>
                            </div>
                        </div>

                        <!-- Кнопки действий -->
                        <div class="flex items-center space-x-2 shrink-0 self-end sm:self-center">
                            <!-- Кнопка Выбрать источник релиза -->
                            <button
                                type="button"
                                @click="$store.releaseSourcePicker.openForMissingAlbum(alb)"
                                :aria-label="'Выбрать источник цельного релиза ' + alb.album"
                                class="px-3 py-1.5 bg-surface-elevated hover:bg-surface-hover text-brand border border-brand/30 rounded-lg text-xs font-semibold transition flex items-center space-x-1.5 shadow-sm"
                                title="Выбрать официальный альбом YouTube Music или сет SoundCloud">
                                <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor">
                                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 14.5c-2.49 0-4.5-2.01-4.5-4.5S9.51 7.5 12 7.5s4.5 2.01 4.5 4.5-2.01 4.5-4.5 4.5zm0-5.5c-.55 0-1 .45-1 1s.45 1 1 1 1-.45 1-1-.45-1-1-1z"/>
                                </svg>
                                <span>Выбрать источник</span>
                            </button>

                            <span x-show="alb.completeness === 'unknown'" class="text-xs text-content-muted">Не сверено</span>
                            <!-- Кнопка Скачать все недостающие -->
                            <template x-if="alb.expected_count > alb.present_count">
                                <button
                                    @click="downloadMissing(alb)"
                                    :disabled="isDownloading(alb)"
                                    :aria-label="'Скачать недостающие треки для релиза ' + alb.album"
                                    class="px-3 py-1.5 bg-sky-600 hover:bg-sky-500 disabled:opacity-50 text-white rounded-lg text-xs font-semibold transition flex items-center space-x-1.5 shadow">
                                    <svg class="w-3.5 h-3.5" :class="{'animate-spin': isDownloading(alb)}" aria-hidden="true" viewBox="0 0 24 24" fill="currentColor">
                                        <path d="M12 16l-5-5h3V4h4v7h3l-5 5zm9-4v7H3v-7H1v7a2 2 0 0 0 2 2h18a2 2 0 0 0 2-2v-7h-2z"/>
                                    </svg>
                                    <span x-text="isDownloading(alb) ? 'Отправка...' : `Скачать недостающие (${alb.expected_count - alb.present_count})`"></span>
                                </button>
                            </template>
                            <template x-if="alb.completeness === 'complete'">
                                <span class="px-2.5 py-1 bg-brand/10 border border-brand/20 text-brand rounded-lg text-xs font-medium flex items-center space-x-1">
                                    <svg class="w-3.5 h-3.5" aria-hidden="true" viewBox="0 0 24 24" fill="currentColor"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>
                                    <span>Укомплектован</span>
                                </span>
                            </template>

                            <!-- Кнопка Открыть в редакторе тегов (если есть завершенная дозагрузка) -->
                            <template x-if="getBackfillJobForAlbum(alb.path)">
                                <button
                                    @click="openBackfillJob(alb.path)"
                                    :aria-label="'Редактировать теги всех треков релиза ' + alb.album"
                                    class="px-3 py-1.5 bg-brand hover:bg-brand-hover text-zinc-950 rounded-lg text-xs font-bold transition flex items-center space-x-1.5 shadow-lg shadow-brand/20 active:scale-95"
                                    title="Редактировать теги всех треков релиза">
                                    <svg class="w-3.5 h-3.5" aria-hidden="true" viewBox="0 0 24 24" fill="currentColor">
                                        <path d="M4 21q-.425 0-.712-.288T3 20v-2.425q0-.4.15-.763t.425-.637L16.2 3.575q.3-.275.663-.425t.762-.15t.775.15t.65.45L20.425 5q.3.275.437.65T21 6.4q0 .4-.138.763t-.437.662l-12.6 12.6q-.275.275-.638.425t-.762.15zM17.6 7.8L19 6.4L17.6 5l-1.4 1.4z"/>
                                    </svg>
                                    <span>В редактор тегов</span>
                                </button>
                            </template>

                            <!-- Кнопка разворачивания треклиста -->
                            <button
                                @click="toggleAlbumExpand(alb)"
                                :aria-label="(expandedAlbums[alb.path] ? 'Скрыть треклист релиза ' : 'Сверить треклист релиза ') + alb.album"
                                class="px-3 py-1.5 bg-surface-elevated hover:bg-surface-hover text-content-primary rounded-lg text-xs font-medium transition flex items-center space-x-1 border border-surface-border">
                                <span x-text="expandedAlbums[alb.path] ? 'Скрыть треклист' : 'Сверить с Deezer'"></span>
                                <svg class="w-3.5 h-3.5 transition-transform duration-200" :class="{'rotate-180': expandedAlbums[alb.path]}" aria-hidden="true" viewBox="0 0 24 24" fill="currentColor">
                                    <path d="M7.41 8.59L12 13.17l4.59-4.58L18 10l-6 6l-6-6z"/>
                                </svg>
                            </button>

                            <!-- Кнопка открыть папку -->
                            <button
                                @click="openDirectory(alb.path)"
                                title="Открыть папку"
                                :aria-label="'Открыть папку релиза ' + alb.album"
                                class="p-1.5 hover:bg-surface-elevated text-content-muted hover:text-content-primary rounded-lg transition border border-transparent hover:border-surface-border">
                                <svg class="w-4 h-4" aria-hidden="true" viewBox="0 0 24 24" fill="currentColor">
                                    <path d="M4 20q-.825 0-1.412-.587T2 18V6q0-.825.588-1.412T4 4h5.175q.4 0 .763.15t.637.425L12 6h8q.825 0 1.413.588T22 8v10q0 .825-.587 1.413T20 20zm0-2h16V8h-8.825l-2-2H4zm0 0V6z"/>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <!-- Прогресс заполненности и бейдж недостающих -->
                    <div class="space-y-1.5">
                        <div class="flex items-center justify-between text-xs">
                            <span class="text-content-secondary font-medium flex items-center space-x-2">
                                <span>Полнота релиза:</span>
                                <strong class="text-white font-mono" x-text="`${alb.present_count} из ${alb.expected_count} треков`"></strong>
                                <span class="text-sky-400 font-mono text-xs" x-text="`(${Math.round(alb.present_count / (alb.expected_count || 1) * 100)}%)`"></span>
                            </span>
                            <div class="text-xs text-amber-400 font-medium">
                                <span>Отсутствуют: </span>
                                <strong class="font-mono" x-text="(alb.missing_tracks?.length ? alb.missing_tracks.map(t => `${t.disc_number}.${t.track_number}`) : (alb.missing_track_numbers || []).map(n => '#' + n)).join(', ')"></strong>
                            </div>
                        </div>
                        <div class="w-full bg-surface-base rounded-full h-2 overflow-hidden border border-surface-border">
                            <div class="bg-gradient-to-r from-sky-500 to-indigo-500 h-2 rounded-full transition-all duration-300"
                                :style="`width: ${Math.round(alb.present_count / (alb.expected_count || 1) * 100)}%`"></div>
                        </div>
                    </div>

                    <!-- Развернутый аккордеон треклиста -->
                    <div x-show="expandedAlbums[alb.path]" class="mt-4 pt-3 border-t border-surface-border space-y-3 animate-fade-in">
                        <div class="flex items-center justify-between">
                            <h5 class="text-xs font-semibold text-content-secondary uppercase tracking-wider flex items-center space-x-2">
                                <span>Треклист релиза</span>
                                <template x-if="alb.is_catalog_matched">
                                    <span class="text-xs text-brand bg-brand/10 px-2 py-0.5 rounded border border-brand/20 font-mono">
                                        Сверено с каталогом Deezer
                                    </span>
                                </template>
                                <template x-if="catalogMatchLoading[alb.path]">
                                    <span class="text-xs text-sky-400 flex items-center space-x-1 font-mono">
                                        <svg class="w-3 h-3 animate-spin" aria-hidden="true" viewBox="0 0 24 24" fill="currentColor"><path d="M12 20q-3.35 0-5.675-2.325T4 12t2.325-5.675T12 4q1.725 0 3.3.712T18 6.75V4h2v6h-6V8h3.2q-.8-1.4-2.187-2.2T12 5Q9.075 5 7.038 7.038T5 12t2.038 4.963T12 19q2.625 0 4.588-1.7t2.312-4.3h2.05q-.375 3.475-2.95 5.738T12 20"/></svg>
                                        <span>Запрос каталога Deezer...</span>
                                    </span>
                                </template>
                            </h5>
                        </div>

                        <!-- Таблица треков релиза -->
                        <div class="bg-surface-base rounded-lg border border-surface-border overflow-hidden">
                            <table class="w-full text-left text-xs border-collapse">
                                <thead class="bg-surface-elevated text-content-secondary uppercase tracking-wider font-semibold border-b border-surface-border font-mono text-xs">
                                    <tr>
                                        <th class="p-2.5 w-12 text-center">#</th>
                                        <th class="p-2.5">Название трека</th>
                                        <th class="p-2.5 w-24 text-center">Статус</th>
                                        <th class="p-2.5 w-48 text-right">Действие</th>
                                    </tr>
                                </thead>
                                <tbody class="divide-y divide-surface-borderSubtle">
                                    <template x-for="(t, tIdx) in getAlbumTracks(alb)" :key="`${alb.path}_${t.disc_number || 1}_${t.track_number || tIdx}`">
                                        <tr class="hover:bg-surface-elevated/40 transition">
                                            <td class="p-2.5 text-center font-mono text-content-muted" x-text="t.disc_number > 1 ? `${t.disc_number}-${t.track_number}` : t.track_number"></td>
                                            <td class="p-2.5">
                                                <div class="font-medium text-white truncate max-w-sm" x-text="t.title || `Трек #${t.track_number}`"></div>
                                                <div class="flex items-center space-x-2 text-xs text-content-muted">
                                                    <template x-if="t.artist && t.artist !== alb.artist">
                                                        <span class="truncate max-w-[200px]" x-text="t.artist"></span>
                                                    </template>
                                                    <template x-if="t.duration">
                                                        <span class="text-content-muted font-mono" x-text="`${Math.floor(t.duration / 60)}:${String(Math.floor(t.duration % 60)).padStart(2, '0')}`"></span>
                                                    </template>
                                                </div>
                                            </td>
                                            <td class="p-2.5 text-center">
                                                <template x-if="t.is_present">
                                                    <span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-brand/10 text-brand border border-brand/20">
                                                        В медиатеке
                                                    </span>
                                                </template>
                                                <template x-if="!t.is_present">
                                                    <span class="inline-flex items-center px-2 py-0.5 rounded text-xs font-medium bg-red-500/10 text-red-400 border border-red-500/20">
                                                        Отсутствует
                                                    </span>
                                                </template>
                                            </td>
                                            <td class="p-2.5 text-right">
                                                <template x-if="!t.is_present">
                                                    <div class="inline-flex items-center space-x-1.5 justify-end">
                                                        <button
                                                            @click.stop="$store.sourcePicker.openForMissingTrack(alb, t)"
                                                            class="px-2 py-1 bg-surface-elevated hover:bg-surface-hover text-content-secondary hover:text-white border border-surface-border rounded text-xs font-medium transition inline-flex items-center space-x-1"
                                                            :aria-label="'Выбрать источник вручную для трека ' + (t.title || t.track_number)"
                                                            title="Выбрать источник вручную">
                                                            <svg class="w-3.5 h-3.5 text-brand" aria-hidden="true" viewBox="0 0 24 24" fill="currentColor">
                                                                <path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/>
                                                            </svg>
                                                            <span>Источник</span>
                                                        </button>
                                                        <button
                                                            @click="downloadMissing(alb, t)"
                                                            :disabled="isDownloading(alb, t)"
                                                            :aria-label="'Скачать недостающий трек ' + (t.title || t.track_number)"
                                                            class="px-2.5 py-1 bg-sky-600/20 hover:bg-sky-600/30 text-sky-300 border border-sky-500/30 rounded text-xs font-medium transition inline-flex items-center space-x-1">
                                                            <svg class="w-3.5 h-3.5" :class="{'animate-spin': isDownloading(alb, t)}" aria-hidden="true" viewBox="0 0 24 24" fill="currentColor">
                                                                <path d="M12 16l-5-5h3V4h4v7h3l-5 5zm9-4v7H3v-7H1v7a2 2 0 0 0 2 2h18a2 2 0 0 0 2-2v-7h-2z"/>
                                                            </svg>
                                                            <span>Скачать</span>
                                                        </button>
                                                    </div>
                                                </template>
                                            </td>
                                        </tr>
                                    </template>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </template>
        </div>
    </template>
</div>
{{ end }}
