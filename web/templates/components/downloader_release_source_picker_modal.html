{{ define "downloader_release_source_picker_modal" }}
<!-- ==================== МОДАЛЬНОЕ ОКНО: ВЫБОР ЦЕЛЬНОГО ИСТОЧНИКА РЕЛИЗА ==================== -->
<div
    x-show="$store.releaseSourcePicker && $store.releaseSourcePicker.isOpen"
    x-cloak
    role="dialog"
    aria-modal="true"
    aria-labelledby="release-picker-modal-title"
    class="fixed inset-0 z-50 overflow-y-auto bg-black/85 backdrop-blur-md flex items-center justify-center p-3 sm:p-6"
    @keydown.escape.window="$store.releaseSourcePicker.close()">

    <div
        class="bg-surface-panel border border-surface-border rounded-2xl w-full max-w-5xl shadow-2xl overflow-hidden flex flex-col max-h-[92vh] animate-scale-up"
        @click.outside="$store.releaseSourcePicker.close()">

        <!-- 1. ШАПКА МОДАЛА -->
        <div class="p-5 border-b border-surface-border bg-surface-elevated/60 flex items-start justify-between gap-4">
            <div class="min-w-0 flex-1 space-y-1.5">
                <div class="flex items-center space-x-2.5">
                    <span class="p-1.5 rounded-lg bg-brand/15 text-brand border border-brand/30 flex items-center justify-center">
                        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 14.5c-2.49 0-4.5-2.01-4.5-4.5S9.51 7.5 12 7.5s4.5 2.01 4.5 4.5-2.01 4.5-4.5 4.5zm0-5.5c-.55 0-1 .45-1 1s.45 1 1 1 1-.45 1-1-.45-1-1-1z"/>
                        </svg>
                    </span>
                    <h2 id="release-picker-modal-title" class="text-base font-bold text-white tracking-tight">
                        Выбор цельного источника релиза
                    </h2>
                </div>

                <!-- Метаданные релиза и языковой бейдж цензуры -->
                <div class="flex flex-wrap items-center gap-2 pt-0.5 text-xs">
                    <span class="font-bold text-content-primary text-sm" x-text="$store.releaseSourcePicker.album || 'Без названия'"></span>
                    <span class="text-content-muted">•</span>
                    <span class="text-content-secondary font-medium" x-text="$store.releaseSourcePicker.artist"></span>

                    <!-- Контекстный бейдж языка/политики цензуры -->
                    <template x-if="$store.releaseSourcePicker.isCyrillic">
                        <span class="px-2.5 py-0.5 rounded-full bg-rose-500/10 text-rose-300 border border-rose-500/25 font-medium text-[11px] flex items-center gap-1">
                            <span>🇷🇺 RU-исполнитель: приоритет авторскому оригиналу без цензуры (SoundCloud)</span>
                        </span>
                    </template>
                    <template x-if="!$store.releaseSourcePicker.isCyrillic">
                        <span class="px-2.5 py-0.5 rounded-full bg-brand/10 text-brand border border-brand/25 font-medium text-[11px] flex items-center gap-1">
                            <span>🌐 Зарубежный исполнитель: приоритет официальному студийному качеству</span>
                        </span>
                    </template>
                </div>
            </div>

            <!-- Кнопка закрытия -->
            <button
                type="button"
                @click="$store.releaseSourcePicker.close()"
                class="p-1.5 text-content-muted hover:text-white rounded-lg hover:bg-surface-hover transition"
                aria-label="Закрыть окно">
                <svg class="w-5 h-5" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                    <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
                </svg>
            </button>
        </div>

        <!-- 2. ПЕРЕКЛЮЧАТЕЛЬ ВКЛАДОК -->
        <div class="flex border-b border-surface-border bg-surface-base px-5">
            <button
                type="button"
                @click="$store.releaseSourcePicker.activeTab = 'candidates'"
                class="px-4 py-2.5 text-xs font-semibold border-b-2 transition flex items-center space-x-2"
                :class="$store.releaseSourcePicker.activeTab === 'candidates' ? 'border-brand text-brand font-bold' : 'border-transparent text-content-secondary hover:text-white'">
                <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                    <path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm0 14H8V4h12v12z"/>
                </svg>
                <span>Найденные релизы</span>
                <span class="px-1.5 py-0.2 rounded-full bg-surface-elevated text-[10px] font-mono" x-text="$store.releaseSourcePicker.candidates.length"></span>
            </button>

            <button
                type="button"
                @click="$store.releaseSourcePicker.activeTab = 'direct'"
                class="px-4 py-2.5 text-xs font-semibold border-b-2 transition flex items-center space-x-2"
                :class="$store.releaseSourcePicker.activeTab === 'direct' ? 'border-brand text-brand font-bold' : 'border-transparent text-content-secondary hover:text-white'">
                <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                    <path d="M3.9 12c0-1.71 1.39-3.1 3.1-3.1h4V7H7c-2.76 0-5 2.24-5 5s2.24 5 5 5h4v-1.9H7c-1.71 0-3.1-1.39-3.1-3.1zM8 13h8v-2H8v2zm9-6h-4v1.9h4c1.71 0 3.1 1.39 3.1 3.1s-1.39 3.1-3.1 3.1h-4V17h4c2.76 0 5-2.24 5-5s-2.24-5-5-5z"/>
                </svg>
                <span>Вставить прямую ссылку на сет / альбом</span>
            </button>
        </div>

        <!-- 3. ТЕЛО МОДАЛА -->
        <div class="p-5 flex-1 overflow-y-auto space-y-5">

            <!-- ВКЛАДКА 2: ПРЯМАЯ ССЫЛКА -->
            <div x-show="$store.releaseSourcePicker.activeTab === 'direct'" class="space-y-4">
                <div class="p-4 rounded-xl bg-surface-elevated border border-surface-border space-y-3">
                    <h3 class="text-xs font-bold text-white">Разбор стороннего плейлиста или сета</h3>
                    <p class="text-xs text-content-secondary">
                        Вставьте ссылку на альбом/сет из SoundCloud, YouTube Music или Bandcamp.
                        Треклист будет автоматически разобран и сопоставлен с целевыми песнями.
                    </p>
                    <div class="flex items-center space-x-2">
                        <input
                            type="text"
                            x-model="$store.releaseSourcePicker.directUrl"
                            placeholder="https://soundcloud.com/.../sets/... или https://music.youtube.com/playlist?list=..."
                            @keydown.enter.prevent="$store.releaseSourcePicker.parseDirectUrl()"
                            class="flex-1 px-3 py-2 rounded-xl bg-surface-input border border-surface-border text-xs text-white placeholder-content-muted focus:border-brand outline-hidden transition">
                        <button
                            type="button"
                            @click="$store.releaseSourcePicker.parseDirectUrl()"
                            :disabled="$store.releaseSourcePicker.isParsingUrl"
                            class="px-4 py-2 rounded-xl bg-brand text-black font-semibold text-xs hover:bg-brand/90 transition flex items-center space-x-1.5 disabled:opacity-50">
                            <template x-if="!$store.releaseSourcePicker.isParsingUrl">
                                <span>Разобрать и сопоставить</span>
                            </template>
                            <template x-if="$store.releaseSourcePicker.isParsingUrl">
                                <span>Анализ ссылок...</span>
                            </template>
                        </button>
                    </div>
                    <template x-if="$store.releaseSourcePicker.directError">
                        <p class="text-xs text-rose-400" x-text="$store.releaseSourcePicker.directError"></p>
                    </template>
                </div>
            </div>

            <!-- ЛЕНТА КАНДИДАТОВ РЕЛИЗА -->
            <div x-show="$store.releaseSourcePicker.activeTab === 'candidates'" class="space-y-4">
                <!-- Состояние загрузки -->
                <template x-if="$store.releaseSourcePicker.isLoading">
                    <div class="py-12 flex flex-col items-center justify-center space-y-3 text-content-muted">
                        <svg class="animate-spin h-6 w-6 text-brand" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
                        </svg>
                        <p class="text-xs">Поиск релизов на YouTube Music и SoundCloud...</p>
                    </div>
                </template>

                <!-- Сообщение об ошибке или отсутствии кандидатов -->
                <template x-if="!$store.releaseSourcePicker.isLoading && $store.releaseSourcePicker.candidates.length === 0">
                    <div class="p-6 rounded-xl bg-surface-elevated border border-surface-border text-center space-y-2">
                        <p class="text-xs text-content-secondary" x-text="$store.releaseSourcePicker.errorMessage || 'Релизов не найдено'"></p>
                        <button
                            type="button"
                            @click="$store.releaseSourcePicker.activeTab = 'direct'"
                            class="px-3 py-1.5 rounded-lg bg-surface-hover text-brand text-xs font-semibold hover:bg-surface-border transition">
                            Вставить прямую ссылку вручную
                        </button>
                    </div>
                </template>

                <!-- Горизонтальная лента карточек кандидатов -->
                <template x-if="!$store.releaseSourcePicker.isLoading && $store.releaseSourcePicker.candidates.length > 0">
                    <div class="space-y-2">
                        <div class="flex items-center justify-between text-xs text-content-secondary">
                            <span class="font-semibold text-content-muted">Выберите источник для сопоставления:</span>
                            <span x-text="`Кандидатов: ${$store.releaseSourcePicker.candidates.length}`"></span>
                        </div>

                        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-3">
                            <template x-for="(cand, idx) in $store.releaseSourcePicker.candidates" :key="cand.id || idx">
                                <div
                                    @click="$store.releaseSourcePicker.selectCandidate(idx)"
                                    class="p-3.5 rounded-xl border cursor-pointer transition flex flex-col justify-between space-y-3"
                                    :class="$store.releaseSourcePicker.selectedCandidateIndex === idx ?
                                        'bg-surface-elevated border-brand shadow-lg ring-1 ring-brand' :
                                        'bg-surface-base border-surface-border hover:bg-surface-elevated/50 hover:border-surface-borderSubtle'">

                                    <div class="space-y-1.5">
                                        <div class="flex items-center justify-between gap-2">
                                            <!-- Источник -->
                                            <span class="text-[11px] font-bold uppercase tracking-wider font-mono"
                                                :class="cand.source.includes('soundcloud') ? 'text-amber-400' : 'text-red-400'"
                                                x-text="cand.source.includes('soundcloud') ? 'SoundCloud' : 'YouTube Music'">
                                            </span>

                                            <!-- Совпадение треков -->
                                            <span class="px-2 py-0.5 rounded text-[10px] font-mono font-bold"
                                                :class="cand.matched_count === cand.total_count ? 'bg-emerald-500/20 text-emerald-300' : 'bg-surface-input text-content-secondary'"
                                                x-text="`${cand.matched_count}/${cand.total_count} треков (${Math.round(cand.matched_ratio * 100)}%)`">
                                            </span>
                                        </div>

                                        <!-- Название релиза кандидата -->
                                        <h4 class="text-xs font-bold text-white truncate" x-text="cand.title"></h4>
                                        <p class="text-[11px] text-content-secondary truncate" x-text="cand.artist"></p>
                                    </div>

                                    <!-- Бейдж цензуры и качества -->
                                    <div class="pt-1 border-t border-surface-border/50 flex items-center justify-between">
                                        <span class="px-2 py-0.5 rounded-full text-[10px] font-semibold"
                                            :class="{
                                                'bg-rose-500/15 text-rose-300 border border-rose-500/30': cand.censor_status === 'red_flag',
                                                'bg-emerald-500/15 text-emerald-300 border border-emerald-500/30': cand.censor_status === 'recommended',
                                                'bg-surface-input text-content-muted border border-surface-border': cand.censor_status === 'neutral'
                                            }"
                                            x-text="cand.censor_badge">
                                        </span>

                                        <span class="text-[10px] font-mono text-content-muted" x-text="`Score: ${cand.score}`"></span>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>
                </template>

                <!-- 4. ТАБЛИЦА СРАВНЕНИЯ «БОК О БОК» (SIDE-BY-SIDE) -->
                <template x-if="!$store.releaseSourcePicker.isLoading && $store.releaseSourcePicker.currentCandidate()">
                    <div class="space-y-3 pt-2">
                        <div class="flex items-center justify-between">
                            <h3 class="text-xs font-bold text-white tracking-wide flex items-center gap-2">
                                <span>Сравнение треклистов</span>
                                <span class="text-content-muted font-normal text-[11px]">(клик по строке позволяет вручную переназначить несовпавший трек)</span>
                            </h3>
                            <span class="text-xs font-mono text-content-secondary"
                                x-text="`Сопоставлено: ${$store.releaseSourcePicker.getMatchedCount()} из ${$store.releaseSourcePicker.targetTracks.length}`">
                            </span>
                        </div>

                        <div class="border border-surface-border rounded-xl overflow-hidden bg-surface-base">
                            <div class="grid grid-cols-12 bg-surface-elevated border-b border-surface-border px-3 py-2 text-[11px] font-semibold text-content-muted uppercase tracking-wider">
                                <div class="col-span-6 flex items-center gap-2">
                                    <span>Целевой трек релиза</span>
                                </div>
                                <div class="col-span-6 flex items-center gap-2">
                                    <span>Дорожка выбранного кандидата</span>
                                </div>
                            </div>

                            <div class="divide-y divide-surface-border/50 max-h-[380px] overflow-y-auto">
                                <template x-for="(target, tIdx) in $store.releaseSourcePicker.targetTracks" :key="target.track_id || tIdx">
                                    <div class="p-2.5 transition hover:bg-surface-hover/50 relative">
                                        <div class="grid grid-cols-12 items-center gap-2">
                                            <!-- ЛЕВАЯ КОЛОНКА: Целевой трек -->
                                            <div class="col-span-6 flex items-center space-x-2 min-w-0 pr-2">
                                                <span class="w-6 text-center text-xs font-mono text-content-muted font-bold" x-text="target.track_number || (tIdx + 1)"></span>
                                                <div class="min-w-0 flex-1">
                                                    <p class="text-xs font-bold text-white truncate" x-text="target.title"></p>
                                                    <p class="text-[10px] text-content-secondary truncate" x-text="target.artist"></p>
                                                </div>
                                                <span class="text-[11px] font-mono text-content-muted shrink-0"
                                                    x-text="target.duration ? (window.AppFormatters ? window.AppFormatters.formatDuration(target.duration) : target.duration + 'с') : '—'">
                                                </span>
                                            </div>

                                            <!-- ПРАВАЯ КОЛОНКА: Сопоставленный кандидат -->
                                            <div class="col-span-6 flex items-center space-x-2 min-w-0 pl-2 border-l border-surface-border/60">
                                                <template x-if="$store.releaseSourcePicker.getMappedCandidateTrack(tIdx)">
                                                    <div class="flex items-center space-x-2 min-w-0 flex-1">
                                                        <div class="min-w-0 flex-1">
                                                            <p class="text-xs font-medium text-emerald-300 truncate" x-text="$store.releaseSourcePicker.getMappedCandidateTrack(tIdx).title"></p>
                                                            <p class="text-[10px] text-content-muted truncate" x-text="$store.releaseSourcePicker.getMappedCandidateTrack(tIdx).artist || ''"></p>
                                                        </div>

                                                        <!-- Длительность и дельта -->
                                                        <div class="flex items-center space-x-1.5 shrink-0">
                                                            <span class="text-[11px] font-mono text-content-secondary"
                                                                x-text="window.AppFormatters ? window.AppFormatters.formatDuration($store.releaseSourcePicker.getMappedCandidateTrack(tIdx).duration) : $store.releaseSourcePicker.getMappedCandidateTrack(tIdx).duration + 'с'">
                                                            </span>

                                                            <!-- Бейдж разницы во времени -->
                                                            <template x-if="target.duration && $store.releaseSourcePicker.getMappedCandidateTrack(tIdx).duration">
                                                                <span class="px-1.5 py-0.2 rounded text-[10px] font-mono font-bold"
                                                                    :class="{
                                                                        'bg-emerald-500/20 text-emerald-300': $store.releaseSourcePicker.getTrackDelta(target.duration, $store.releaseSourcePicker.getMappedCandidateTrack(tIdx).duration).tier === 'exact',
                                                                        'bg-amber-500/20 text-amber-300': $store.releaseSourcePicker.getTrackDelta(target.duration, $store.releaseSourcePicker.getMappedCandidateTrack(tIdx).duration).tier === 'close',
                                                                        'bg-rose-500/20 text-rose-300': $store.releaseSourcePicker.getTrackDelta(target.duration, $store.releaseSourcePicker.getMappedCandidateTrack(tIdx).duration).tier === 'far'
                                                                    }"
                                                                    x-text="$store.releaseSourcePicker.getTrackDelta(target.duration, $store.releaseSourcePicker.getMappedCandidateTrack(tIdx).duration).text">
                                                                </span>
                                                            </template>
                                                        </div>
                                                    </div>
                                                </template>

                                                <!-- Если соответствие не найдено -->
                                                <template x-if="!$store.releaseSourcePicker.getMappedCandidateTrack(tIdx)">
                                                    <div class="flex items-center justify-between min-w-0 flex-1">
                                                        <span class="text-xs text-rose-400 font-medium italic">Нет совпадения (будет найден поштучно)</span>
                                                    </div>
                                                </template>

                                                <!-- Кнопка ручной смены сопоставления -->
                                                <button
                                                    type="button"
                                                    @click="$store.releaseSourcePicker.toggleRemapSelector(tIdx)"
                                                    class="p-1 rounded text-content-muted hover:text-white hover:bg-surface-elevated transition shrink-0"
                                                    title="Выбрать другую дорожку кандидата">
                                                    <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor">
                                                        <path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/>
                                                    </svg>
                                                </button>
                                            </div>
                                        </div>

                                        <!-- ВЫПАДАЮЩИЙ СПИСОК РУЧНОГО НАЗНАЧЕНИЯ ДОРОЖКИ -->
                                        <div
                                            x-show="$store.releaseSourcePicker.activeRemapTargetIdx === tIdx"
                                            x-cloak
                                            @click.outside="$store.releaseSourcePicker.activeRemapTargetIdx = null"
                                            class="mt-2 p-2 rounded-xl bg-surface-elevated border border-surface-border shadow-2xl space-y-1.5 z-20">
                                            <div class="flex items-center justify-between px-2 py-1 text-[11px] font-semibold text-content-muted border-b border-surface-border">
                                                <span>Выберите дорожку из кандидата для этой позиции:</span>
                                                <button
                                                    type="button"
                                                    @click="$store.releaseSourcePicker.clearTrackRemap(tIdx)"
                                                    class="text-rose-400 hover:text-rose-300">
                                                    Исключить (скачать поштучно)
                                                </button>
                                            </div>

                                            <div class="max-h-40 overflow-y-auto divide-y divide-surface-border/40">
                                                <template x-for="cTrack in ($store.releaseSourcePicker.currentCandidate() ? $store.releaseSourcePicker.currentCandidate().tracks : [])" :key="cTrack.direct_url || cTrack.video_id || cTrack.index">
                                                    <div
                                                        @click="$store.releaseSourcePicker.remapTrack(tIdx, cTrack)"
                                                        class="px-2 py-1.5 text-xs hover:bg-surface-hover rounded cursor-pointer flex items-center justify-between text-content-primary transition">
                                                        <span class="truncate flex-1" x-text="`${cTrack.index ? cTrack.index + '. ' : ''}${cTrack.title}`"></span>
                                                        <span class="font-mono text-[10px] text-content-muted ml-2"
                                                            x-text="window.AppFormatters ? window.AppFormatters.formatDuration(cTrack.duration) : cTrack.duration + 'с'">
                                                        </span>
                                                    </div>
                                                </template>
                                            </div>
                                        </div>
                                    </div>
                                </template>
                            </div>
                        </div>
                    </div>
                </template>
            </div>
        </div>

        <!-- 5. ПОДВАЛ МОДАЛА -->
        <div class="p-4 border-t border-surface-border bg-surface-elevated/70 flex flex-wrap items-center justify-between gap-3">
            <div class="text-xs text-content-secondary space-y-0.5">
                <template x-if="$store.releaseSourcePicker.currentCandidate()">
                    <p>
                        Будет скачано из релиза:
                        <span class="font-bold text-white font-mono" x-text="`${$store.releaseSourcePicker.getMatchedCount()} из ${$store.releaseSourcePicker.targetTracks.length}`"></span>.
                        <template x-if="$store.releaseSourcePicker.targetTracks.length - $store.releaseSourcePicker.getMatchedCount() > 0">
                            <span class="text-amber-400">
                                Оставшиеся <span x-text="$store.releaseSourcePicker.targetTracks.length - $store.releaseSourcePicker.getMatchedCount()"></span> треков будут найдены поштучно.
                            </span>
                        </template>
                    </p>
                </template>
            </div>

            <div class="flex items-center space-x-2">
                <button
                    type="button"
                    @click="$store.releaseSourcePicker.close()"
                    class="px-4 py-2 rounded-xl bg-surface-hover text-content-secondary hover:text-white font-semibold text-xs transition">
                    Отмена
                </button>
                <button
                    type="button"
                    @click="$store.releaseSourcePicker.applyReleaseSource()"
                    :disabled="$store.releaseSourcePicker.isApplying || !$store.releaseSourcePicker.currentCandidate()"
                    class="px-5 py-2 rounded-xl bg-brand text-black font-bold text-xs hover:bg-brand/90 transition shadow-lg shadow-white/10 disabled:opacity-50 flex items-center space-x-1.5">
                    <template x-if="!$store.releaseSourcePicker.isApplying">
                        <span>Применить и скачать релиз</span>
                    </template>
                    <template x-if="$store.releaseSourcePicker.isApplying">
                        <span>Применение источника...</span>
                    </template>
                </button>
            </div>
        </div>

    </div>
</div>
{{ end }}
