{{ define "radar" }}
<div x-show="$store.app.activeTab === 'radar'" x-transition class="space-y-6">
    <!-- Верхняя информационная панель и управление -->
    <div class="bg-surface-panel/90 backdrop-blur-md border border-surface-border rounded-2xl p-4 sm:p-6 shadow-panel">
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
            <div>
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-brand to-rose-500 p-0.5 shadow-lg shadow-brand/20 flex items-center justify-center">
                        <div class="w-full h-full bg-surface-panel rounded-[10px] flex items-center justify-center text-brand" aria-hidden="true">
                            <svg class="w-5 h-5 text-brand" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                                <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm0-14c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6-2.69-6-6-6zm0 10c-2.21 0-4-1.79-4-4s1.79-4 4-4 4 1.79 4 4-1.79 4-4 4z"/>
                            </svg>
                        </div>
                    </div>
                    <div>
                        <h2 class="text-xl font-bold text-white tracking-tight flex items-center space-x-2">
                            <span>Радар релизов & Детектор пробелов</span>
                            <template x-if="$store.radar.unreadCount > 0">
                                <span class="px-2 py-0.5 text-xs font-mono font-bold bg-brand text-zinc-950 rounded-full animate-pulse" x-text="`+${$store.radar.unreadCount}`"></span>
                            </template>
                        </h2>
                        <p class="text-xs text-content-muted">Мониторинг дискографий, свежих альбомов и синглов отслеживаемых исполнителей</p>
                    </div>
                </div>
            </div>

            <!-- Кнопки управления и сканирования -->
            <div class="flex items-center space-x-3">
                <template x-if="!$store.radar.progress.is_running">
                    <button
                        @click="$store.radar.triggerScan()"
                        class="px-4 py-2 bg-brand hover:bg-brand-hover text-zinc-950 text-xs font-semibold rounded-xl transition flex items-center space-x-2 shadow-md shadow-brand/20">
                        <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                            <path d="M17.65 6.35A7.958 7.958 0 0 0 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0 1 12 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
                        </svg>
                        <span>Проверить все новинки</span>
                    </button>
                </template>
                <template x-if="$store.radar.progress.is_running">
                    <button
                        @click="$store.radar.cancelScan()"
                        class="px-4 py-2 bg-rose-600/80 hover:bg-rose-600 text-white text-xs font-semibold rounded-xl transition flex items-center space-x-2 shadow-md shadow-rose-600/20">
                        <svg class="w-4 h-4 animate-spin" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
                        </svg>
                        <span>Остановить</span>
                    </button>
                </template>
            </div>
        </div>

        <!-- Индикатор фонового прогресса -->
        <template x-if="$store.radar.progress.is_running">
            <div class="mt-4 pt-4 border-t border-surface-border space-y-2">
                <div class="flex items-center justify-between text-xs">
                    <span class="text-content-secondary flex items-center space-x-2">
                        <span class="w-2 h-2 rounded-full bg-brand animate-ping" aria-hidden="true"></span>
                        <span>Сканирование: <strong class="text-white" x-text="$store.radar.progress.current_artist || 'подготовка...'"></strong></span>
                    </span>
                    <span class="font-mono text-content-muted" x-text="`${$store.radar.progress.current_index} из ${$store.radar.progress.total_artists} (${$store.radar.progress.total_artists > 0 ? Math.round(($store.radar.progress.current_index / $store.radar.progress.total_artists) * 100) : 0}%)`"></span>
                </div>
                <div class="w-full bg-surface-input rounded-full h-2 overflow-hidden border border-surface-border">
                    <div class="bg-gradient-to-r from-brand to-rose-500 h-full transition-all duration-300"
                        :style="`width: ${$store.radar.progress.total_artists > 0 ? ($store.radar.progress.current_index / $store.radar.progress.total_artists) * 100 : 0}%`"></div>
                </div>
            </div>
        </template>
    </div>

    <!-- Вкладки подраздела: Лента новинок vs Отслеживаемые артисты -->
    <div class="flex items-center justify-between border-b border-surface-border pb-3">
        <div class="flex space-x-2">
            <button
                @click="$store.radar.activeSubTab = 'feed'; $store.radar.fetchFeed(1)"
                :class="$store.radar.activeSubTab === 'feed' ? 'bg-surface-elevated text-brand font-bold border-brand' : 'text-content-secondary hover:text-white border-transparent'"
                class="px-4 py-2 rounded-xl text-xs border transition flex items-center space-x-2">
                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-6h2v6zm0-8h-2V7h2v2z"/>
                </svg>
                <span>Лента новинок</span>
                <span class="px-1.5 py-0.2 bg-surface-input text-xs font-mono rounded" x-text="$store.radar.feedTotal"></span>
            </button>
            <button
                @click="$store.radar.activeSubTab = 'artists'; $store.radar.fetchArtists()"
                :class="$store.radar.activeSubTab === 'artists' ? 'bg-surface-elevated text-brand font-bold border-brand' : 'text-content-secondary hover:text-white border-transparent'"
                class="px-4 py-2 rounded-xl text-xs border transition flex items-center space-x-2">
                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                    <path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5s-3 1.34-3 3 1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/>
                </svg>
                <span>Отслеживаемые артисты</span>
                <span class="px-1.5 py-0.2 bg-surface-input text-xs font-mono rounded" x-text="$store.radar.artistsTotal"></span>
            </button>
        </div>
    </div>

    <!-- ПОДРАЗДЕЛ 1: ЛЕНТА РЕЛИЗОВ -->
    <div x-show="$store.radar.activeSubTab === 'feed'" class="space-y-4">
        <!-- Фильтры ленты -->
        <div class="flex flex-wrap items-center justify-between gap-3 bg-surface-panel/50 p-3 rounded-xl border border-surface-border">
            <div class="flex items-center space-x-2">
                <template x-for="t in [
                    { id: 'all', label: 'Все' },
                    { id: 'album', label: 'Альбомы' },
                    { id: 'single', label: 'Синглы' },
                    { id: 'ep', label: 'EP' },
                    { id: 'compilation', label: 'Сборники' }
                ]" :key="t.id">
                    <button
                        @click="$store.radar.feedType = t.id; $store.radar.fetchFeed(1)"
                        :class="$store.radar.feedType === t.id ? 'bg-brand text-zinc-950 font-semibold' : 'bg-surface-input text-content-secondary hover:text-white'"
                        class="px-3 py-1.5 rounded-lg text-xs transition"
                        x-text="t.label">
                    </button>
                </template>
            </div>

            <!-- Поиск по названию / артисту -->
            <div class="w-full sm:w-64">
                <input
                    type="text"
                    x-model="$store.radar.feedSearch"
                    @input.debounce.300ms="$store.radar.fetchFeed(1)"
                    placeholder="Поиск по ленте..."
                    aria-label="Поиск по ленте новинок"
                    class="w-full bg-surface-input border border-surface-border rounded-lg px-3 py-1.5 text-xs text-white placeholder-content-muted focus:outline-none focus:border-brand">
            </div>
        </div>

        <!-- Сетка релизов -->
        <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 lg:grid-cols-6 gap-4">
            <template x-for="item in $store.radar.feedItems" :key="item.id">
                <div class="group bg-surface-panel rounded-2xl border border-surface-border overflow-hidden flex flex-col hover:border-brand/40 transition shadow-sm hover:shadow-brand/10">
                    <!-- Обложка -->
                    <div class="aspect-square relative bg-surface-input overflow-hidden">
                        <img
                            :src="item.cover_url || '/static/images/default-cover.png'"
                            :alt="item.title"
                            class="w-full h-full object-cover transition-transform duration-300 group-hover:scale-105"
                            loading="lazy"
                            @error="$event.target.src = '/static/images/default-cover.png'">
                        <!-- Тип релиза и год -->
                        <div class="absolute top-2 left-2 flex flex-col space-y-1">
                            <span class="px-2 py-0.5 text-xs font-mono font-bold uppercase tracking-wider bg-black/75 backdrop-blur-md rounded text-white border border-white/10" x-text="item.release_type"></span>
                        </div>
                        <template x-if="item.year > 0">
                            <span class="absolute top-2 right-2 px-1.5 py-0.5 text-xs font-mono bg-black/75 backdrop-blur-md rounded text-amber-400 font-semibold" x-text="item.year"></span>
                        </template>

                        <!-- Статус релиза -->
                        <div class="absolute bottom-2 left-2">
                            <template x-if="item.status === 'new'">
                                <span class="px-2 py-0.5 text-xs font-bold uppercase bg-brand text-zinc-950 rounded shadow">Новинка</span>
                            </template>
                            <template x-if="item.status === 'downloaded'">
                                <span class="px-2 py-0.5 text-xs font-bold uppercase bg-emerald-600 text-white rounded shadow">Скачан</span>
                            </template>
                        </div>
                    </div>

                    <!-- Информация о релизе -->
                    <div class="p-3 flex-1 flex flex-col justify-between">
                        <div>
                            <h3 class="font-bold text-xs text-white truncate" :title="item.title" x-text="item.title"></h3>
                            <button
                                @click="$store.radar.openDiscography(item.artist_name)"
                                class="text-left text-xs text-content-secondary hover:text-brand truncate w-full transition mt-0.5"
                                :title="item.artist_name"
                                :aria-label="'Открыть дискографию: ' + item.artist_name"
                                x-text="item.artist_name">
                            </button>
                            <div class="text-xs text-content-muted mt-1 font-mono">
                                <span x-text="item.release_date || (item.year ? item.year : '')"></span>
                                <span x-text="item.track_count > 0 ? ` • ${item.track_count} трек.` : ''"></span>
                            </div>
                        </div>

                        <!-- Кнопки действий -->
                        <div class="mt-3 pt-2 border-t border-surface-border flex items-center justify-between">
                            <button
                                @click="$store.radar.downloadRelease(item)"
                                :aria-label="'Скачать в медиатеку: ' + item.title"
                                title="Скачать в медиатеку"
                                class="p-1.5 rounded-lg bg-surface-elevated hover:bg-brand hover:text-zinc-950 text-content-secondary transition">
                                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                                    <path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/>
                                </svg>
                            </button>
                            <div class="flex items-center space-x-1">
                                <button
                                    @click="$store.radar.openDiscography(item.artist_name)"
                                    :aria-label="'Вся дискография: ' + item.artist_name"
                                    title="Вся дискография"
                                    class="p-1.5 rounded-lg hover:bg-surface-elevated text-content-muted hover:text-white transition">
                                    <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                                        <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
                                    </svg>
                                </button>
                                <button
                                    @click="$store.radar.setReleaseStatus(item, 'ignored')"
                                    :aria-label="'Скрыть релиз ' + item.title"
                                    title="Скрыть релиз"
                                    class="p-1.5 rounded-lg hover:bg-surface-elevated text-content-muted hover:text-rose-400 transition">
                                    <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                                        <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
                                    </svg>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </template>
        </div>

        <!-- Пагинация и управление загрузкой ленты -->
        <template x-if="$store.radar.feedTotal > 0">
            <div class="mt-6 flex flex-col sm:flex-row items-center justify-between gap-4 pt-4 border-t border-surface-border">
                <div class="text-xs text-content-muted">
                    Показано <strong class="text-white" x-text="$store.radar.feedItems.length"></strong> из <strong class="text-white" x-text="$store.radar.feedTotal"></strong> новинок
                </div>

                <!-- Кнопка "Загрузить еще" -->
                <template x-if="$store.radar.feedItems.length < $store.radar.feedTotal">
                    <button
                        @click="$store.radar.loadMoreFeed()"
                        :disabled="$store.radar.isLoadingMore"
                        class="px-5 py-2.5 bg-surface-elevated hover:bg-brand text-content-primary hover:text-zinc-950 text-xs font-semibold rounded-xl border border-surface-border hover:border-brand transition flex items-center space-x-2 shadow-sm disabled:opacity-50">
                        <template x-if="$store.radar.isLoadingMore">
                            <svg class="w-4 h-4 animate-spin text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" aria-hidden="true">
                                <circle class="opacity-25" cx="12" cy="12" r="10" stroke-width="4"></circle>
                                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
                            </svg>
                        </template>
                        <template x-if="!$store.radar.isLoadingMore">
                            <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                                <path d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6v2z"/>
                            </svg>
                        </template>
                        <span x-text="$store.radar.isLoadingMore ? 'Загрузка...' : `Показать еще (${Math.min($store.radar.feedLimit, $store.radar.feedTotal - $store.radar.feedItems.length)})`"></span>
                    </button>
                </template>

                <!-- Выбор количества на странице -->
                <div class="flex items-center space-x-2 text-xs text-content-muted">
                    <span>Показывать по:</span>
                    <div class="flex space-x-1">
                        <template x-for="lim in [24, 48, 96, 240]" :key="lim">
                            <button
                                @click="$store.radar.changeFeedLimit(lim)"
                                :class="$store.radar.feedLimit === lim ? 'bg-brand text-zinc-950 font-bold' : 'bg-surface-input text-content-secondary hover:text-white'"
                                class="px-2.5 py-1 rounded-lg transition font-mono text-xs"
                                x-text="lim">
                            </button>
                        </template>
                    </div>
                </div>
            </div>
        </template>

        <!-- Пустое состояние -->
        <template x-if="!$store.radar.isLoading && $store.radar.feedItems.length === 0">
            <div class="bg-surface-panel border border-surface-border rounded-2xl p-12 text-center text-content-muted space-y-3">
                <svg class="w-12 h-12 mx-auto text-content-muted/40" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm0-14c-3.31 0-6 2.69-6 6s2.69 6 6 6 6-2.69 6-6-2.69-6-6-6zm0 10c-2.21 0-4-1.79-4-4s1.79-4 4-4 4 1.79 4 4-1.79 4-4 4z"/>
                </svg>
                <div class="text-sm font-medium text-white">Релизы не найдены</div>
                <div class="text-xs">Нажмите «Проверить все новинки» или добавьте новых артистов во вкладке «Отслеживаемые артисты».</div>
            </div>
        </template>
    </div>

    <!-- ПОДРАЗДЕЛ 2: ОТСЛЕЖИВАЕМЫЕ АРТИСТЫ -->
    <div x-show="$store.radar.activeSubTab === 'artists'" class="space-y-4">
        <!-- Панель добавления артиста и фильтров -->
        <div class="flex flex-col sm:flex-row items-center justify-between gap-3 bg-surface-panel/50 p-4 rounded-xl border border-surface-border">
            <div class="flex-1 w-full sm:max-w-md flex items-center space-x-2">
                <input
                    type="text"
                    x-model="$store.radar.newArtistName"
                    @keydown.enter="$store.radar.addArtist()"
                    placeholder="Имя исполнителя для отслеживания..."
                    aria-label="Имя исполнителя для отслеживания"
                    class="flex-1 bg-surface-input border border-surface-border rounded-lg px-3 py-2 text-xs text-white placeholder-content-muted focus:outline-none focus:border-brand">
                <button
                    @click="$store.radar.addArtist()"
                    class="px-4 py-2 bg-brand hover:bg-brand-hover text-zinc-950 text-xs font-semibold rounded-lg transition shrink-0">
                    Добавить
                </button>
            </div>

            <div class="flex items-center space-x-3 w-full sm:w-auto">
                <label class="flex items-center space-x-2 text-xs text-content-secondary cursor-pointer">
                    <input
                        type="checkbox"
                        x-model="$store.radar.artistsOnlyFollowed"
                        @change="$store.radar.fetchArtists()"
                        class="rounded bg-surface-input border-surface-border text-brand focus:ring-brand">
                    <span>Только активные</span>
                </label>
                <input
                    type="text"
                    x-model="$store.radar.artistsSearch"
                    placeholder="Фильтр артистов..."
                    aria-label="Фильтр артистов"
                    class="bg-surface-input border border-surface-border rounded-lg px-3 py-1.5 text-xs text-white placeholder-content-muted focus:outline-none focus:border-brand">
            </div>
        </div>

        <!-- Таблица артистов -->
        <div class="bg-surface-panel border border-surface-border rounded-2xl overflow-hidden shadow-sm">
            <div class="overflow-x-auto">
                <table class="w-full text-left text-xs">
                    <thead class="bg-surface-input border-b border-surface-border text-content-muted font-mono uppercase text-xs">
                        <tr>
                            <th class="p-3.5">Исполнитель</th>
                            <th class="p-3.5 text-center">Релизов / Треков</th>
                            <th class="p-3.5 text-center">Пробелов (Gaps)</th>
                            <th class="p-3.5 text-center">Отслеживание</th>
                            <th class="p-3.5 text-center">Автозагрузка</th>
                            <th class="p-3.5 text-right">Действия</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-surface-borderSubtle">
                        <template x-for="art in $store.radar.filteredArtists()" :key="art.id || art.name">
                            <tr class="hover:bg-surface-hover/50 transition">
                                <td class="p-3.5">
                                    <div class="flex items-center space-x-3">
                                        <div class="w-8 h-8 rounded-lg bg-surface-elevated flex items-center justify-center font-bold text-brand shrink-0" x-text="art.name.charAt(0)"></div>
                                        <div>
                                            <div class="font-bold text-white text-sm" x-text="art.name"></div>
                                            <template x-if="art.custom_search_alias">
                                                <div class="text-xs text-content-muted" x-text="`Алиас: ${art.custom_search_alias}`"></div>
                                            </template>
                                        </div>
                                    </div>
                                </td>
                                <td class="p-3.5 text-center font-mono text-content-secondary">
                                    <span class="font-bold text-white" x-text="art.album_count || 0"></span><span class="text-xs text-content-muted"> альб.</span>
                                    <template x-if="art.track_count > 0">
                                        <span class="ml-1 text-xs text-content-muted" x-text="`(${art.track_count} тр.)`"></span>
                                    </template>
                                </td>
                                <td class="p-3.5 text-center font-mono font-semibold" :class="art.gap_count > 0 ? 'text-amber-400 font-bold' : 'text-content-muted'" x-text="art.gap_count || 0"></td>
                                <td class="p-3.5 text-center">
                                    <button
                                        @click="$store.radar.toggleFollow(art)"
                                        :aria-label="'Отслеживание исполнителя ' + art.name + ': ' + (art.is_followed ? 'Включено' : 'Выключено')"
                                        :class="art.is_followed ? 'bg-emerald-500/20 text-emerald-300 border-emerald-500/40' : 'bg-surface-input text-content-muted border-surface-border'"
                                        class="px-2.5 py-1 rounded-full border text-xs font-medium transition">
                                        <span x-text="art.is_followed ? 'Включено' : 'Выключено'"></span>
                                    </button>
                                </td>
                                <td class="p-3.5 text-center">
                                    <button
                                        @click="$store.radar.toggleAutoDownload(art)"
                                        :aria-label="'Автозагрузка для ' + art.name + ': ' + (art.auto_download ? 'Да' : 'Нет')"
                                        :class="art.auto_download ? 'bg-brand/20 text-brand border-brand/40' : 'bg-surface-input text-content-muted border-surface-border'"
                                        class="px-2.5 py-1 rounded-full border text-xs font-medium transition">
                                        <span x-text="art.auto_download ? 'Да' : 'Нет'"></span>
                                    </button>
                                </td>
                                <td class="p-3.5 text-right">
                                    <div class="flex items-center justify-end space-x-2">
                                        <button
                                            @click="$store.radar.triggerScan(art.name)"
                                            :aria-label="'Проверить дискографию ' + art.name + ' сейчас'"
                                            title="Проверить дискографию сейчас"
