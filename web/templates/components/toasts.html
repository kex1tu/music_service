{{ define "toasts" }}
<!-- ==================== СИСТЕМА УВЕДОМЛЕНИЙ (TOASTS) ==================== -->
    <div role="status" aria-live="polite" class="fixed right-4 z-50 flex flex-col space-y-2 pointer-events-none transition-all duration-300"
         :class="$store.player?.isVisible ? 'bottom-[calc(9.5rem+env(safe-area-inset-bottom,0px))] md:bottom-24' : 'bottom-[calc(4.5rem+env(safe-area-inset-bottom,0px))] md:bottom-6'">
        <template x-for="t in $store.app.toasts" :key="t.id">
            <div
                class="pointer-events-auto px-4 py-3 rounded-xl shadow-panel text-xs font-medium max-w-sm backdrop-blur-md animate-scale-in border flex items-center space-x-3"
                :class="{
                    'bg-surface-panel/95 border-brand/40 text-content-primary shadow-brand-glow': t.type === 'success',
                    'bg-surface-panel/95 border-red-500/50 text-red-200': t.type === 'error',
                    'bg-surface-panel/95 border-surface-border text-content-primary': t.type === 'info',
                }">
                <template x-if="t.type === 'success'">
                    <div class="w-5 h-5 rounded-full bg-brand-muted text-brand flex items-center justify-center shrink-0" aria-hidden="true">
                        <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                            <path d="m10.6 13.8l-2.15-2.15q-.275-.275-.7-.275t-.7.275t-.275.7t.275.7L9.9 15.9q.3.3.7.3t.7-.3l5.65-5.65q.275-.275.275-.7t-.275-.7t-.7-.275t-.7.275zM12 22q-2.075 0-3.9-.788t-3.175-2.137T2.788 15.9T2 12t.788-3.9t2.137-3.175T8.1 2.788T12 2t3.9.788t3.175 2.137T21.213 8.1T22 12t-.788 3.9t-2.137 3.175t-3.175 2.138T12 22m0-2q3.35 0 5.675-2.325T20 12t-2.325-5.675T12 4T6.325 6.325T4 12t2.325 5.675T12 20m0-8"/>
                        </svg>
                    </div>
                </template>
                <template x-if="t.type === 'error'">
                    <div class="w-5 h-5 rounded-full bg-red-500/20 text-red-400 flex items-center justify-center shrink-0" aria-hidden="true">
                        <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                            <path d="M12.713 16.713Q13 16.425 13 16t-.288-.712T12 15t-.712.288T11 16t.288.713T12 17t.713-.288m0-4Q13 12.425 13 12V8q0-.425-.288-.712T12 7t-.712.288T11 8v4q0 .425.288.713T12 13t.713-.288M12 22q-2.075 0-3.9-.788t-3.175-2.137T2.788 15.9T2 12t.788-3.9t2.137-3.175T8.1 2.788T12 2t3.9.788t3.175 2.137T21.213 8.1T22 12t-.788 3.9t-2.137 3.175t-3.175 2.138T12 22m0-2q3.35 0 5.675-2.325T20 12t-2.325-5.675T12 4T6.325 6.325T4 12t2.325 5.675T12 20m0-8"/>
                        </svg>
                    </div>
                </template>
                <template x-if="t.type === 'info'">
                    <div class="w-5 h-5 rounded-full bg-surface-elevated text-content-secondary flex items-center justify-center shrink-0" aria-hidden="true">
                        <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                            <path d="M12.713 16.713Q13 16.425 13 16v-4q0-.425-.288-.712T12 11t-.712.288T11 12v4q0 .425.288.713T12 17t.713-.288m0-8Q13 8.425 13 8t-.288-.712T12 7t-.712.288T11 8t.288.713T12 9t.713-.288M12 22q-2.075 0-3.9-.788t-3.175-2.137T2.788 15.9T2 12t.788-3.9t2.137-3.175T8.1 2.788T12 2t3.9.788t3.175 2.137T21.213 8.1T22 12t-.788 3.9t-2.137 3.175t-3.175 2.138T12 22m0-2q3.35 0 5.675-2.325T20 12t-2.325-5.675T12 4T6.325 6.325T4 12t2.325 5.675T12 20m0-8"/>
                        </svg>
                    </div>
                </template>
                <span x-text="t.message" class="leading-snug"></span>
            </div>
        </template>
    </div>
{{ end }}
