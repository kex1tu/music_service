{{ define "puddletag_tag_panel" }}
<!-- ==================== БОКОВАЯ ПАНЕЛЬ ТЕГОВ (STUDIO TAG INSPECTOR) ==================== -->
<aside aria-labelledby="tag-inspector-title" class="w-full lg:w-72 xl:w-80 bg-surface-panel border border-surface-border rounded-lg p-3 sm:p-4 flex flex-col space-y-3 shadow-panel shrink-0 select-none">
    <!-- Заголовок панели тегов и счетчик выбора -->
    <div class="flex items-center justify-between border-b border-surface-borderSubtle pb-2">
        <div class="flex items-center space-x-2">
            <span class="w-2 h-2 rounded-full bg-white" :class="hasDirtyChanges ? 'animate-pulse' : ''"></span>
            <h2 id="tag-inspector-title" class="text-xs font-semibold uppercase tracking-wider text-content-primary">Инспектор тегов</h2>
        </div>
        <div class="text-xs font-mono tabular-nums text-content-muted">
            <span x-text="selectedTracksCount > 0 ? `Выбрано: ${selectedTracksCount}` : 'Нет выбора'"></span>
        </div>
    </div>

    <!-- БЛОК ОБЛОЖКИ (ARTWORK BOX) -->
    <div
        class="bg-surface-input border border-dashed border-surface-border hover:border-white/30 rounded-md p-2.5 flex flex-col items-center justify-center relative group transition cursor-pointer"
        @dragover.prevent
        @drop="handleCoverDrop($event)"
        @click="$refs.coverFileInput.click()"
        title="Нажмите или перетащите изображение для замены обложки">
        
        <input
            type="file"
            x-ref="coverFileInput"
            @change="handleCoverFileInput($event)"
            accept="image/jpeg,image/png,image/webp"
            aria-label="Выбрать файл обложки с диска"
            class="hidden">

        <div class="w-28 h-28 rounded-sm bg-surface-base border border-surface-border overflow-hidden relative shadow-xs flex items-center justify-center">
            <template x-if="tagPanel.cover_url">
                <img :src="tagPanel.cover_url" alt="Обложка альбома" class="w-full h-full object-cover">
            </template>
            <template x-if="!tagPanel.cover_url">
                <div class="flex flex-col items-center justify-center text-content-muted/50 space-y-1">
                    <svg class="w-8 h-8" aria-hidden="true" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55c-2.21 0-4 1.79-4 4s1.79 4 4 4s4-1.79 4-4V7h4V3z"/>
                    </svg>
                    <span class="text-xs uppercase font-mono">Нет обложки</span>
                </div>
            </template>

            <!-- Оверлей при наведении -->
            <div class="absolute inset-0 bg-black/75 opacity-0 group-hover:opacity-100 flex flex-col items-center justify-center transition p-2 text-center text-xs text-white space-y-1">
                <button
                    type="button"
                    @click.stop="openCoverGallery()"
                    class="px-2 py-1 bg-brand hover:bg-brand-hover text-zinc-950 font-semibold rounded text-xs transition shadow-xs flex items-center space-x-1">
                    <svg class="w-3.5 h-3.5 text-zinc-950" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                        <path d="M9.5 16q-2.725 0-4.612-1.888T3 9.5t1.888-4.612T9.5 3t4.613 1.888T16 9.5q0 1.1-.35 2.075T14.7 13.3l5.6 5.6q.275.275.275.7t-.275.7t-.7.275t-.7-.275l-5.6-5.6q-.75.6-1.725.95T9.5 16m0-2q1.875 0 3.188-1.312T14 9.5t-1.312-3.187T9.5 5T6.313 6.313T5 9.5t1.313 3.188T9.5 14"/>
                    </svg>
                    <span>Найти онлайн</span>
                </button>
                <span class="text-[10px] text-content-muted">или клик / Drop</span>
            </div>
        </div>

        <!-- Кнопки управления обложкой -->
        <div class="flex items-center space-x-1.5 mt-2" @click.stop>
            <button
                type="button"
                @click="openCoverGallery()"
                class="px-2 py-0.5 bg-brand hover:bg-brand-hover text-zinc-950 font-semibold rounded-sm text-xs font-mono transition flex items-center space-x-1 shadow-xs"
                title="Поиск обложки высокого разрешения в онлайн-базах">
                <svg class="w-3 h-3 text-zinc-950" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                    <path d="M9.5 16q-2.725 0-4.612-1.888T3 9.5t1.888-4.612T9.5 3t4.613 1.888T16 9.5q0 1.1-.35 2.075T14.7 13.3l5.6 5.6q.275.275.275.7t-.275.7t-.7.275t-.7-.275l-5.6-5.6q-.75.6-1.725.95T9.5 16m0-2q1.875 0 3.188-1.312T14 9.5t-1.312-3.187T9.5 5T6.313 6.313T5 9.5t1.313 3.188T9.5 14"/>
                </svg>
                <span>Поиск</span>
            </button>
            <button
                type="button"
                @click="$refs.coverFileInput.click()"
                class="px-2 py-0.5 bg-surface-elevated hover:bg-surface-hover text-content-secondary hover:text-white rounded-sm text-xs font-mono border border-surface-border transition"
                title="Загрузить изображение с диска">
                Загрузить
            </button>
            <template x-if="tagPanel.cover_url">
                <button
                    type="button"
                    @click="removeCover()"
                    class="px-2 py-0.5 bg-rose-500/10 hover:bg-rose-500/20 text-rose-300 rounded-sm text-xs font-mono border border-rose-500/25 transition"
                    title="Удалить обложку">
                    Удалить
                </button>
            </template>
        </div>
    </div>

    <!-- ПОЛЯ ВВОДА ТЕГОВ -->
    <div class="space-y-2 overflow-y-auto flex-1 pr-0.5 text-xs">
        <!-- Название (Title) -->
        <div>
            <label for="tag-panel-title" class="block text-xs font-mono uppercase tracking-wider text-content-muted mb-0.5">Название (Title)</label>
            <input
                id="tag-panel-title"
                type="text"
                :value="tagPanel.title"
                @input="onTagPanelInput('title', $event.target.value)"
                :placeholder="tagPanelDiff.title ? '<Разные значения>' : 'Название композиции'"
                aria-label="Название трека"
                class="w-full bg-surface-input border border-surface-border rounded-sm px-2 py-1 text-content-primary focus:border-white/30 focus:ring-1 focus:ring-white/20 outline-none transition text-xs"
                :class="tagPanelDiff.title ? 'placeholder:text-amber-400/80 italic' : 'placeholder:text-content-muted'">
        </div>

        <!-- Исполнитель (Artist) -->
        <div>
            <label for="tag-panel-artist" class="block text-xs font-mono uppercase tracking-wider text-content-muted mb-0.5">Исполнитель (Artist)</label>
            <input
                id="tag-panel-artist"
                type="text"
                :value="tagPanel.artist"
                @input="onTagPanelInput('artist', $event.target.value)"
                :placeholder="tagPanelDiff.artist ? '<Разные значения>' : 'Исполнитель'"
                aria-label="Исполнитель"
                class="w-full bg-surface-input border border-surface-border rounded-sm px-2 py-1 text-content-primary focus:border-white/30 focus:ring-1 focus:ring-white/20 outline-none transition text-xs"
                :class="tagPanelDiff.artist ? 'placeholder:text-amber-400/80 italic' : 'placeholder:text-content-muted'">
        </div>

        <!-- Альбомный артист (Album Artist) -->
        <div>
            <label for="tag-panel-album-artist" class="block text-xs font-mono uppercase tracking-wider text-content-muted mb-0.5">Альбомный артист</label>
            <input
                id="tag-panel-album-artist"
                type="text"
                :value="tagPanel.album_artist"
                @input="onTagPanelInput('album_artist', $event.target.value)"
                :placeholder="tagPanelDiff.album_artist ? '<Разные значения>' : 'Основной автор релиза'"
                aria-label="Альбомный артист"
                class="w-full bg-surface-input border border-surface-border rounded-sm px-2 py-1 text-content-primary focus:border-white/30 focus:ring-1 focus:ring-white/20 outline-none transition text-xs"
                :class="tagPanelDiff.album_artist ? 'placeholder:text-amber-400/80 italic' : 'placeholder:text-content-muted'">
        </div>

        <!-- Альбом (Album) -->
        <div>
            <label for="tag-panel-album" class="block text-xs font-mono uppercase tracking-wider text-content-muted mb-0.5">Альбом (Album)</label>
            <input
                id="tag-panel-album"
                type="text"
                :value="tagPanel.album"
                @input="onTagPanelInput('album', $event.target.value)"
                :placeholder="tagPanelDiff.album ? '<Разные значения>' : 'Название альбома'"
                aria-label="Альбом"
                class="w-full bg-surface-input border border-surface-border rounded-sm px-2 py-1 text-content-primary focus:border-white/30 focus:ring-1 focus:ring-white/20 outline-none transition text-xs"
                :class="tagPanelDiff.album ? 'placeholder:text-amber-400/80 italic' : 'placeholder:text-content-muted'">
        </div>

        <!-- Год и Жанр в 2 колонки -->
        <div class="grid grid-cols-2 gap-1.5">
            <div>
                <label for="tag-panel-year" class="block text-xs font-mono uppercase tracking-wider text-content-muted mb-0.5">Год</label>
                <input
                    id="tag-panel-year"
                    type="number"
                    :value="tagPanel.year"
                    @input="onTagPanelInput('year', $event.target.value)"
                    :placeholder="tagPanelDiff.year ? '<Разные>' : 'ГГГГ'"
                    aria-label="Год выпуска"
                    class="w-full bg-surface-input border border-surface-border rounded-sm px-2 py-1 text-content-primary focus:border-white/30 focus:ring-1 focus:ring-white/20 outline-none transition text-xs font-mono tabular-nums"
                    :class="tagPanelDiff.year ? 'placeholder:text-amber-400/80 italic' : 'placeholder:text-content-muted'">
            </div>
            <div>
                <label for="tag-panel-genre" class="block text-xs font-mono uppercase tracking-wider text-content-muted mb-0.5">Жанр</label>
                <input
                    id="tag-panel-genre"
                    type="text"
                    :value="tagPanel.genre"
                    @input="onTagPanelInput('genre', $event.target.value)"
                    :placeholder="tagPanelDiff.genre ? '<Разные>' : 'Жанр'"
                    aria-label="Жанр"
                    class="w-full bg-surface-input border border-surface-border rounded-sm px-2 py-1 text-content-primary focus:border-white/30 focus:ring-1 focus:ring-white/20 outline-none transition text-xs"
                    :class="tagPanelDiff.genre ? 'placeholder:text-amber-400/80 italic' : 'placeholder:text-content-muted'">
            </div>
        </div>

        <!-- Номер дорожки и Всего треков -->
        <div class="grid grid-cols-2 gap-1.5">
            <div>
                <label for="tag-panel-track-number" class="block text-xs font-mono uppercase tracking-wider text-content-muted mb-0.5">Дорожка #</label>
                <input
                    id="tag-panel-track-number"
                    type="number"
                    :value="tagPanel.track_number"
                    @input="onTagPanelInput('track_number', $event.target.value)"
                    :placeholder="tagPanelDiff.track_number ? '<Разные>' : '1'"
                    aria-label="Номер дорожки"
                    class="w-full bg-surface-input border border-surface-border rounded-sm px-2 py-1 text-content-primary focus:border-white/30 focus:ring-1 focus:ring-white/20 outline-none transition text-xs font-mono tabular-nums"
                    :class="tagPanelDiff.track_number ? 'placeholder:text-amber-400/80 italic' : 'placeholder:text-content-muted'">
            </div>
            <div>
                <label for="tag-panel-track-total" class="block text-xs font-mono uppercase tracking-wider text-content-muted mb-0.5">Всего треков</label>
                <input
                    id="tag-panel-track-total"
                    type="number"
                    :value="tagPanel.track_total"
                    @input="onTagPanelInput('track_total', $event.target.value)"
                    :placeholder="tagPanelDiff.track_total ? '<Разные>' : 'Всего'"
                    aria-label="Всего треков"
                    class="w-full bg-surface-input border border-surface-border rounded-sm px-2 py-1 text-content-primary focus:border-white/30 focus:ring-1 focus:ring-white/20 outline-none transition text-xs font-mono tabular-nums"
                    :class="tagPanelDiff.track_total ? 'placeholder:text-amber-400/80 italic' : 'placeholder:text-content-muted'">
            </div>
        </div>

        <!-- Диск # и Всего дисков -->
        <div class="grid grid-cols-2 gap-1.5">
            <div>
                <label for="tag-panel-disc-number" class="block text-xs font-mono uppercase tracking-wider text-content-muted mb-0.5">Диск #</label>
                <input
                    id="tag-panel-disc-number"
                    type="number"
                    :value="tagPanel.disc_number"
                    @input="onTagPanelInput('disc_number', $event.target.value)"
                    :placeholder="tagPanelDiff.disc_number ? '<Разные>' : '1'"
                    aria-label="Номер диска"
                    class="w-full bg-surface-input border border-surface-border rounded-sm px-2 py-1 text-content-primary focus:border-white/30 focus:ring-1 focus:ring-white/20 outline-none transition text-xs font-mono tabular-nums"
                    :class="tagPanelDiff.disc_number ? 'placeholder:text-amber-400/80 italic' : 'placeholder:text-content-muted'">
            </div>
            <div>
                <label for="tag-panel-disc-total" class="block text-xs font-mono uppercase tracking-wider text-content-muted mb-0.5">Всего дисков</label>
                <input
                    id="tag-panel-disc-total"
                    type="number"
                    :value="tagPanel.disc_total"
                    @input="onTagPanelInput('disc_total', $event.target.value)"
                    :placeholder="tagPanelDiff.disc_total ? '<Разные>' : '1'"
                    aria-label="Всего дисков"
                    class="w-full bg-surface-input border border-surface-border rounded-sm px-2 py-1 text-content-primary focus:border-white/30 focus:ring-1 focus:ring-white/20 outline-none transition text-xs font-mono tabular-nums"
                    :class="tagPanelDiff.disc_total ? 'placeholder:text-amber-400/80 italic' : 'placeholder:text-content-muted'">
            </div>
        </div>
    </div>
</aside>
{{ end }}
