{{ define "file_manager" }}
<!-- ==================== ВКЛАДКА 2: ФАЙЛОВЫЙ МЕНЕДЖЕР ==================== -->
        <section x-show="$store.app.activeTab === 'files'" x-data="fileManagerComponent()" class="space-y-4 animate-fade-in">
            <!-- Навигационная панель хлебных крошек -->
            <div class="bg-surface-panel/90 border border-surface-border rounded-xl p-3 sm:p-4 flex flex-wrap items-center justify-between gap-3 shadow-md backdrop-blur-sm">
                <nav class="flex items-center space-x-1 sm:space-x-2 text-xs sm:text-sm overflow-x-auto py-1">
                    <template x-for="(crumb, idx) in breadcrumbs" :key="crumb.path">
                        <div class="flex items-center space-x-1 sm:space-x-2 flex-shrink-0">
                            <template x-if="idx > 0">
                                <svg class="w-3 h-3 text-content-muted" viewBox="0 0 24 24" fill="currentColor">
                                    <path d="M8.59 16.59L13.17 12 8.59 7.41 10 6l6 6-6 6-1.41-1.41z"/>
                                </svg>
                            </template>
                            <button
                                @click="navigateTo(crumb.path)"
                                :class="idx === breadcrumbs.length - 1 ? 'font-semibold text-brand' : 'text-content-secondary hover:text-content-primary'"
                                class="transition text-xs sm:text-sm flex items-center space-x-1.5 px-1.5 py-1 rounded hover:bg-surface-hover">
                                <template x-if="idx === 0">
                                    <svg class="w-4 h-4 inline mr-0.5 text-brand" viewBox="0 0 24 24" fill="currentColor">
                                        <path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/>
                                    </svg>
                                </template>
                                <span x-text="crumb.name"></span>
                            </button>
                        </div>
                    </template>
                </nav>

                <div class="flex items-center space-x-2 w-full sm:w-auto justify-end flex-wrap gap-y-2">
                    <!-- Быстрый фильтр в папке -->
                    <div class="relative flex-1 sm:w-60 min-w-[160px]">
                        <input
                            type="text"
                            x-model="searchQuery"
                            @input="onSearchInput()"
                            placeholder="Фильтр в папке..."
                            class="w-full bg-surface-elevated text-content-primary text-xs rounded-lg pl-8 pr-7 py-1.5 border border-surface-border focus:border-brand focus:ring-1 focus:ring-brand outline-none transition placeholder:text-content-muted"
                        >
                        <svg class="w-3.5 h-3.5 text-content-muted absolute left-2.5 top-2 pointer-events-none" viewBox="0 0 24 24" fill="currentColor">
                            <path d="m19.6 21l-6.3-6.3q-.75.6-1.725.95T9.5 16q-2.725 0-4.612-1.888T3 9.5t1.888-4.612T9.5 3t4.613 1.888T16 9.5q0 1.1-.35 2.075T14.7 13.3l6.3 6.3zM9.5 14q1.875 0 3.188-1.312T14 9.5t-1.312-3.187T9.5 5T6.313 6.313T5 9.5t1.313 3.188T9.5 14"/>
                        </svg>
                        <button
                            x-show="searchQuery"
                            @click="clearSearch()"
                            class="absolute right-2 top-1.5 text-content-muted hover:text-content-primary p-0.5"
                            title="Очистить фильтр">
                            <svg class="w-3 h-3" viewBox="0 0 24 24" fill="currentColor">
                                <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
                            </svg>
                        </button>
                    </div>

                    <template x-if="parentPath !== null">
                        <button
                            @click="navigateUp()"
                            class="px-3 py-1.5 bg-surface-elevated hover:bg-surface-hover text-content-secondary hover:text-content-primary text-xs font-medium rounded-lg transition border border-surface-border flex items-center space-x-1.5 shadow-sm active:scale-95 shrink-0">
                            <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor">
                                <path d="m7.825 13l4.9 4.9q.3.3.288.7t-.313.7q-.3.275-.7.288t-.7-.288l-6.6-6.6q-.15-.15-.213-.325T4.426 12t.063-.375t.212-.325l6.6-6.6q.275-.275.688-.275t.712.275q.3.3.3.713t-.3.712L7.825 11H19q.425 0 .713.288T20 12t-.288.713T19 13z"/>
                            </svg>
                            <span>Назад</span>
                        </button>
                    </template>
                    <button
                        @click="loadDirectory(currentPath)"
                        class="px-3 py-1.5 bg-surface-elevated hover:bg-surface-hover text-content-secondary hover:text-content-primary text-xs font-medium rounded-lg transition border border-surface-border flex items-center space-x-1.5 shadow-sm active:scale-95 shrink-0">
                        <svg class="w-3.5 h-3.5 text-brand" :class="isLoading ? 'animate-spin' : ''" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M12 20q-3.35 0-5.675-2.325T4 12t2.325-5.675T12 4q1.725 0 3.3.712T18 6.75V5q0-.425.288-.712T19 4t.713.288T20 5v5q0 .425-.288.713T19 11h-5q-.425 0-.712-.288T13 10t.288-.712T14 9h3.2q-.8-1.4-2.187-2.2T12 6Q9.5 6 7.75 7.75T6 12t1.75 4.25T12 18q1.7 0 3.113-.862t2.187-2.313q.2-.35.563-.487t.737-.013q.4.125.575.525t-.025.75q-1.025 2-2.925 3.2T12 20"/>
                        </svg>
                        <span>Обновить</span>
                    </button>
                </div>
            </div>

            <!-- Таблица элементов каталога -->
            <div class="bg-surface-panel border border-surface-border rounded-xl overflow-hidden shadow-xl">
                <div class="overflow-x-auto">
                    <table class="w-full text-left text-sm text-content-secondary table-fixed">
                        <thead class="bg-surface-base/90 text-[11px] font-mono uppercase tracking-wider text-content-muted border-b border-surface-border">
                            <tr>
                                <th class="py-3 px-2 sm:px-3 w-10 sm:w-12 text-center">#</th>
                                <th class="py-3 px-2 sm:px-4">Композиция</th>
                                <th class="py-3 px-3 sm:px-4 hidden md:table-cell md:w-36 lg:w-44 xl:w-56">Исполнитель</th>
                                <th class="py-3 px-3 sm:px-4 hidden lg:table-cell lg:w-36 xl:w-52">Альбом</th>
                                <th class="py-3 px-2 text-center hidden sm:table-cell sm:w-16 lg:w-20">Текст</th>
                                <th class="py-3 px-2 sm:px-4 text-right w-16 sm:w-20 lg:w-24">Время</th>
                                <th class="py-3 px-2 sm:px-4 text-right w-24 sm:w-28 md:w-32 lg:w-36">Действия</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-surface-border/50">
                            <!-- Пустое состояние каталога -->
                            <template x-if="items.length === 0 && !isLoading">
                                <tr>
                                    <td colspan="7" class="py-16 text-center text-content-muted">
                                        <div class="flex flex-col items-center justify-center space-y-2">
                                            <svg class="w-10 h-10 text-content-muted/50" viewBox="0 0 24 24" fill="currentColor">
                                                <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55c-2.21 0-4 1.79-4 4s1.79 4 4 4s4-1.79 4-4V7h4V3z"/>
                                            </svg>
                                            <span class="text-sm font-medium">Каталог пуст</span>
                                        </div>
                                    </td>
                                </tr>
                            </template>

                            <!-- Ничего не найдено по поисковому фильтру -->
                            <template x-if="items.length > 0 && totalFiltered === 0 && !isLoading">
                                <tr>
                                    <td colspan="7" class="py-12 text-center text-content-muted">
                                        <div class="flex flex-col items-center justify-center space-y-2">
                                            <svg class="w-8 h-8 text-content-muted/50" viewBox="0 0 24 24" fill="currentColor">
                                                <path d="m19.6 21l-6.3-6.3q-.75.6-1.725.95T9.5 16q-2.725 0-4.612-1.888T3 9.5t1.888-4.612T9.5 3t4.613 1.888T16 9.5q0 1.1-.35 2.075T14.7 13.3l6.3 6.3zM9.5 14q1.875 0 3.188-1.312T14 9.5t-1.312-3.187T9.5 5T6.313 6.313T5 9.5t1.313 3.188T9.5 14"/>
                                            </svg>
                                            <span class="text-sm">Ничего не найдено по запросу «<span class="text-content-primary" x-text="searchQuery"></span>»</span>
                                            <button @click="clearSearch()" class="text-xs text-brand hover:underline mt-1">Очистить фильтр</button>
                                        </div>
                                    </td>
                                </tr>
                            </template>

                            <!-- Элементы -->
                            <template x-for="item in paginatedItems" :key="item.path">
                                <tr class="hover:bg-surface-hover/70 transition-colors group/row"
                                    :class="{ 'bg-brand-muted/70 text-content-primary border-l-2 border-brand': $store.player?.currentTrack && $store.player.currentTrack.path === item.path }">
                                    <!-- Номер или Иконка / Кнопка воспроизведения -->
                                    <td class="py-2.5 sm:py-3 px-2 sm:px-3 text-center text-content-muted w-10 sm:w-12">
                                        <template x-if="item.type === 'directory'">
                                            <div class="flex items-center justify-center">
                                                <svg class="w-5 h-5 text-amber-400 group-hover/row:scale-110 transition-transform" viewBox="0 0 24 24" fill="currentColor">
                                                    <path d="M4 20q-.825 0-1.412-.587T2 18V6q0-.825.588-1.412T4 4h5.175q.4 0 .763.15t.637.425L12 6h8q.825 0 1.413.588T22 8v10q0 .825-.587 1.413T20 20z"/>
                                                </svg>
                                            </div>
                                        </template>
                                        <template x-if="item.type === 'file'">
                                            <div class="relative flex items-center justify-center h-7 w-7 mx-auto">
                                                <template x-if="item.extension === '.mp3'">
                                                    <div class="relative flex items-center justify-center w-full h-full">
                                                        <!-- Номер трека (скрывается при наведении или воспроизведении) -->
                                                        <span
                                                            class="font-mono text-xs transition-opacity"
                                                            :class="($store.player.currentTrack?.path === item.path && $store.player.isPlaying) ? 'hidden' : 'group-hover/row:hidden'"
                                                            x-text="item.track_number ? String(item.track_number).padStart(2, '0') : '—'">
                                                        </span>

                                                        <!-- Deezer-style Play / Pause Button -->
                                                        <button
                                                            @click="$store.player.playTrack(item, items)"
                                                            :title="$store.player.currentTrack?.path === item.path && $store.player.isPlaying ? 'Пауза' : 'Воспроизвести'"
                                                            class="w-7 h-7 rounded-full flex items-center justify-center transition shadow-sm"
                                                            :class="{
                                                                'flex bg-brand text-white shadow-brand/30': $store.player.currentTrack?.path === item.path && $store.player.isPlaying,
                                                                'hidden group-hover/row:flex bg-surface-elevated text-content-primary hover:bg-brand hover:text-white border border-surface-border': !($store.player.currentTrack?.path === item.path && $store.player.isPlaying)
                                                            }">
                                                            <svg class="w-3.5 h-3.5" :class="($store.player.currentTrack?.path === item.path && $store.player.isPlaying) ? '' : 'translate-x-0.5'" viewBox="0 0 24 24" fill="currentColor">
                                                                <path :d="($store.player.currentTrack?.path === item.path && $store.player.isPlaying) ? 'M6 19h4V5H6v14zm8-14v14h4V5h-4z' : 'M8 5v14l11-7z'"/>
                                                            </svg>
                                                        </button>
                                                    </div>
                                                </template>
                                                <template x-if="item.extension !== '.mp3'">
                                                    <svg class="w-4 h-4 text-content-muted" viewBox="0 0 24 24" fill="currentColor">
                                                        <path d="M14 2H6c-1.1 0-1.99.9-1.99 2L4 20c0 1.1.89 2 1.99 2H18c1.1 0 2-.9 2-2V8l-6-6zm2 16H8v-2h8v2zm0-4H8v-2h8v2zm-3-5V3.5L18.5 9H13z"/>
                                                    </svg>
                                                </template>
                                            </div>
                                        </template>
                                    </td>

                                    <!-- Имя / Название -->
                                    <td class="py-2.5 sm:py-3 px-2 sm:px-4 font-medium text-content-primary truncate min-w-0">
                                        <template x-if="item.type === 'directory'">
                                            <button
                                                @click="navigateTo(item.path)"
                                                class="hover:text-brand transition text-left flex items-center space-x-2.5 sm:space-x-3 w-full group/btn min-w-0">
                                                <div class="w-8 h-8 sm:w-9 sm:h-9 rounded-lg bg-surface-elevated border border-surface-border flex items-center justify-center text-amber-400 group-hover/btn:border-amber-500/40 transition shrink-0">
                                                    <svg class="w-4 h-4 sm:w-5 sm:h-5" viewBox="0 0 24 24" fill="currentColor">
                                                        <path d="M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/>
                                                    </svg>
                                                </div>
                                                <div class="min-w-0 flex-1">
                                                    <div class="font-semibold text-content-primary group-hover/btn:text-brand transition truncate text-xs sm:text-sm" x-text="item.name"></div>
                                                    <template x-if="item.track_count !== undefined">
                                                        <div class="text-[10px] sm:text-[11px] text-content-muted font-mono" x-text="`${item.track_count} треков`"></div>
                                                    </template>
                                                </div>
                                            </button>
                                        </template>
                                        <template x-if="item.type === 'file'">
                                            <div class="flex items-center space-x-2.5 sm:space-x-3 min-w-0">
                                                <!-- Mini Cover Thumbnail -->
                                                <div class="w-8 h-8 sm:w-9 sm:h-9 rounded-md bg-surface-elevated border border-surface-border/60 overflow-hidden shrink-0 relative flex items-center justify-center">
                                                    <img x-show="item.has_cover" :src="item.has_cover ? '/cover?path=' + encodeURIComponent(item.path) : ''" class="w-full h-full object-cover" loading="lazy">
                                                    <svg x-show="!item.has_cover" class="w-4 h-4 text-content-muted/60" viewBox="0 0 24 24" fill="currentColor">
                                                        <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55c-2.21 0-4 1.79-4 4s1.79 4 4 4s4-1.79 4-4V7h4V3z"/>
                                                    </svg>
                                                </div>
                                                <div class="min-w-0 flex-1">
                                                    <div
                                                        class="font-medium truncate transition text-xs sm:text-sm"
                                                        :class="$store.player?.currentTrack && $store.player.currentTrack.path === item.path ? 'text-brand font-semibold' : 'text-content-primary group-hover/row:text-white'"
                                                        x-text="item.title || item.name">
                                                    </div>
                                                    <!-- Mobile metadata subtitle: artist + lyrics badge -->
                                                    <div class="flex items-center space-x-1.5 text-[10px] sm:text-[11px] text-content-muted truncate md:hidden">
                                                        <span class="truncate" x-text="item.artist || 'Неизвестный исполнитель'"></span>
                                                        <span
                                                            x-show="item.lyrics_status === 'lrc' || item.lyrics_status === 'txt'"
                                                            class="px-1 py-0.2 rounded text-[9px] font-mono font-bold shrink-0 border"
                                                            :class="item.lyrics_status === 'lrc' ? 'bg-brand-muted text-brand border-brand/30' : 'bg-sky-500/10 text-sky-400 border-sky-500/30'"
                                                            x-text="item.lyrics_status ? item.lyrics_status.toUpperCase() : ''">
                                                        </span>
                                                    </div>
                                                </div>
                                            </div>
                                        </template>
                                    </td>

                                    <!-- Исполнитель -->
                                    <td class="py-2.5 sm:py-3 px-3 sm:px-4 text-content-secondary hidden md:table-cell truncate">
                                        <span class="truncate block text-xs sm:text-sm" x-text="item.artist || '—'"></span>
                                    </td>

                                    <!-- Альбом -->
                                    <td class="py-2.5 sm:py-3 px-3 sm:px-4 text-content-muted hidden lg:table-cell truncate">
                                        <span class="truncate block text-xs sm:text-sm" x-text="item.album || '—'"></span>
                                    </td>

                                    <!-- Статус текста -->
                                    <td class="py-2.5 sm:py-3 px-2 text-center hidden sm:table-cell">
                                        <template x-if="item.type === 'file' && item.extension === '.mp3'">
                                            <div>
                                                <span
                                                    class="text-[10px] font-mono font-bold px-1.5 sm:px-2 py-0.5 rounded tracking-wider uppercase inline-block border"
                                                    :class="{
                                                        'bg-brand-muted text-brand border-brand/30': item.lyrics_status === 'lrc',
                                                        'bg-sky-500/10 text-sky-400 border-sky-500/30': item.lyrics_status === 'txt',
                                                        'text-content-muted/50 border-transparent': item.lyrics_status === 'none' || !item.lyrics_status
                                                    }"
                                                    x-text="item.lyrics_status === 'lrc' ? 'LRC' : (item.lyrics_status === 'txt' ? 'TXT' : '—')">
                                                </span>
                                            </div>
                                        </template>
                                    </td>

                                    <!-- Длительность -->
                                    <td class="py-2.5 sm:py-3 px-2 sm:px-4 text-right text-content-secondary font-mono text-xs sm:text-sm whitespace-nowrap" x-text="item.type === 'file' && item.extension === '.mp3' ? formatDuration(item.duration) : '—'"></td>

                                    <!-- Действия -->
                                    <td class="py-2.5 sm:py-3 px-2 sm:px-4 text-right whitespace-nowrap">
                                        <div class="flex items-center justify-end space-x-1 sm:space-x-1.5">
                                            <!-- Действия каталога -->
                                            <template x-if="item.type === 'directory'">
                                                <div class="flex items-center space-x-1 sm:space-x-1.5">
                                                    <button
                                                        @click="matchInAudit(item)"
                                                        title="Сверить релиз с каталогом Deezer"
                                                        class="p-1.5 sm:px-2.5 sm:py-1 bg-surface-elevated hover:bg-sky-600 hover:text-white text-sky-400 rounded-md text-xs font-medium transition border border-surface-border flex items-center space-x-1 shadow-sm shrink-0 active:scale-95">
                                                        <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor">
                                                            <path d="m19.6 21l-6.3-6.3q-.75.6-1.725.95T9.5 16q-2.725 0-4.612-1.888T3 9.5t1.888-4.612T9.5 3t4.613 1.888T16 9.5q0 1.1-.35 2.075T14.7 13.3l6.3 6.3zM9.5 14q1.875 0 3.188-1.312T14 9.5t-1.312-3.187T9.5 5T6.313 6.313T5 9.5t1.313 3.188T9.5 14"/>
                                                        </svg>
                                                        <span class="hidden xl:inline text-[11px]">Сверить</span>
                                                    </button>
                                                    <button
                                                        @click="openInTagEditor(item)"
                                                        title="Редактировать альбом"
                                                        class="p-1.5 sm:px-2.5 sm:py-1 bg-surface-elevated hover:bg-brand hover:text-white text-content-secondary rounded-md text-xs font-medium transition border border-surface-border flex items-center space-x-1 shadow-sm shrink-0 active:scale-95">
                                                        <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor">
                                                            <path d="M4 21q-.425 0-.712-.288T3 20v-2.425q0-.4.15-.763t.425-.637L16.2 3.575q.3-.275.663-.425t.762-.15t.775.15t.65.45L20.425 5q.3.275.437.65T21 6.4q0 .4-.138.763t-.437.662l-12.6 12.6q-.275.275-.638.425t-.762.15zM17.6 7.8L19 6.4L17.6 5l-1.4 1.4z"/>
                                                        </svg>
                                                        <span class="hidden xl:inline text-[11px]">Теги</span>
                                                    </button>
                                                </div>
                                            </template>
                                            
                                            <!-- Действия аудиофайла MP3 -->
                                            <template x-if="item.type === 'file' && item.extension === '.mp3'">
                                                <div class="flex items-center space-x-1 sm:space-x-1.5">
                                                    <button
                                                        @click="$store.player.playTrack(item, items)"
                                                        :title="$store.player.currentTrack?.path === item.path && $store.player.isPlaying ? 'Пауза' : 'Слушать'"
                                                        class="p-1.5 rounded-md text-xs font-medium transition border border-surface-border flex items-center justify-center shadow-sm shrink-0 active:scale-95"
                                                        :class="{
                                                            'bg-brand text-white border-brand shadow-brand/20': $store.player.currentTrack?.path === item.path && $store.player.isPlaying,
                                                            'bg-surface-elevated hover:bg-brand hover:text-white text-content-secondary': !($store.player.currentTrack?.path === item.path && $store.player.isPlaying)
                                                        }">
                                                        <svg class="w-3.5 h-3.5" :class="($store.player.currentTrack?.path === item.path && $store.player.isPlaying) ? '' : 'translate-x-0.5'" viewBox="0 0 24 24" fill="currentColor">
                                                            <path :d="($store.player.currentTrack?.path === item.path && $store.player.isPlaying) ? 'M6 19h4V5H6v14zm8-14v14h4V5h-4z' : 'M8 5v14l11-7z'"/>
                                                        </svg>
                                                    </button>
                                                    <button
                                                        @click="openInTagEditor(item)"
                                                        title="Редактировать теги"
                                                        class="p-1.5 bg-surface-elevated hover:bg-brand hover:text-white text-content-secondary rounded-md text-xs transition border border-surface-border shadow-sm shrink-0 active:scale-95">
                                                        <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor">
                                                            <path d="m21.4 14.25l-7.15 7.15q-.3.3-.675.45t-.75.15t-.75-.15t-.675-.45l-8.825-8.825q-.275-.275-.425-.637T2 11.175V4q0-.825.588-1.412T4 2h7.175q.4 0 .775.163t.65.437l8.8 8.825q.3.3.438.675t.137.75t-.137.738t-.438.662M6.5 8q.625 0 1.063-.437T8 6.5t-.437-1.062T6.5 5t-1.062.438T5 6.5t.438 1.063T6.5 8"/>
                                                        </svg>
                                                    </button>
                                                </div>
                                            </template>

                                            <!-- Удалить -->
                                            <button
                                                @click="promptDelete(item)"
                                                title="Удалить"
                                                class="p-1.5 hover:bg-red-500/10 text-content-muted hover:text-red-400 rounded-md transition border border-transparent hover:border-red-500/20 active:scale-95 shrink-0">
                                                <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor">
                                                    <path d="M7 21q-.825 0-1.412-.587T5 19V6q-.425 0-.712-.288T4 5t.288-.712T5 4h4q0-.425.288-.712T10 3h4q.425 0 .713.288T15 4h4q.425 0 .713.288T20 5t-.288.713T19 6v13q0 .825-.587 1.413T17 21zM17 6H7v13h10zm-6.287 10.713Q11 16.425 11 16V9q0-.425-.288-.712T10 8t-.712.288T9 9v7q0 .425.288.713T10 17t.713-.288m4 0Q15 16.426 15 16V9q0-.425-.288-.712T14 8t-.712.288T13 9v7q0 .425.288.713T14 17t.713-.288M7 6v13z"/>
                                                </svg>
                                            </button>
                                        </div>
                                    </td>
                                </tr>
                            </template>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Панель пагинации -->
            <div x-show="totalFiltered > 0" class="bg-surface-panel/90 border border-surface-border rounded-xl p-3 sm:p-4 flex flex-wrap items-center justify-between gap-3 text-xs shadow-md">
                <!-- Сведения о количестве -->
                <div class="text-content-secondary flex items-center space-x-2 font-mono">
                    <span>Показано:</span>
                    <span class="font-semibold text-content-primary" x-text="paginationInfo"></span>
                    <template x-if="searchQuery">
                        <span class="text-brand font-sans">(по фильтру)</span>
                    </template>
                </div>

                <!-- Кнопки перелистывания -->
                <div class="flex items-center space-x-1 sm:space-x-1.5" x-show="totalPages > 1">
                    <button
                        @click="setPage(1)"
                        :disabled="currentPage === 1"
                        title="Первая страница"
                        class="px-2 py-1 bg-surface-elevated hover:bg-surface-hover disabled:opacity-40 disabled:hover:bg-surface-elevated text-content-primary rounded-lg transition border border-surface-border active:scale-95 font-mono text-xs">
                        «
                    </button>
                    <button
                        @click="prevPage()"
                        :disabled="currentPage === 1"
                        title="Предыдущая страница"
                        class="px-2.5 py-1 bg-surface-elevated hover:bg-surface-hover disabled:opacity-40 disabled:hover:bg-surface-elevated text-content-primary rounded-lg transition border border-surface-border active:scale-95 flex items-center space-x-1 text-xs">
                        <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor">
                            <path d="m7.825 13l4.9 4.9q.3.3.288.7t-.313.7q-.3.275-.7.288t-.7-.288l-6.6-6.6q-.15-.15-.213-.325T4.426 12t.063-.375t.212-.325l6.6-6.6q.275-.275.688-.275t.712.275q.3.3.3.713t-.3.712L7.825 11H19q.425 0 .713.288T20 12t-.288.713T19 13z"/>
                        </svg>
                        <span class="hidden sm:inline">Назад</span>
                    </button>
                    <div class="px-2.5 py-1 text-content-secondary font-mono text-xs">
                        Стр. <span class="font-bold text-content-primary" x-text="currentPage"></span> из <span x-text="totalPages"></span>
                    </div>
                    <button
                        @click="nextPage()"
                        :disabled="currentPage === totalPages"
                        title="Следующая страница"
                        class="px-2.5 py-1 bg-surface-elevated hover:bg-surface-hover disabled:opacity-40 disabled:hover:bg-surface-elevated text-content-primary rounded-lg transition border border-surface-border active:scale-95 flex items-center space-x-1 text-xs">
                        <span class="hidden sm:inline">Вперед</span>
                        <svg class="w-3.5 h-3.5 rotate-180" viewBox="0 0 24 24" fill="currentColor">
                            <path d="m7.825 13l4.9 4.9q.3.3.288.7t-.313.7q-.3.275-.7.288t-.7-.288l-6.6-6.6q-.15-.15-.213-.325T4.426 12t.063-.375t.212-.325l6.6-6.6q.275-.275.688-.275t.712.275q.3.3.3.713t-.3.712L7.825 11H19q.425 0 .713.288T20 12t-.288.713T19 13z"/>
                        </svg>
                    </button>
                    <button
                        @click="setPage(totalPages)"
                        :disabled="currentPage === totalPages"
                        title="Последняя страница"
                        class="px-2 py-1 bg-surface-elevated hover:bg-surface-hover disabled:opacity-40 disabled:hover:bg-surface-elevated text-content-primary rounded-lg transition border border-surface-border active:scale-95 font-mono text-xs">
                        »
                    </button>
                </div>

                <!-- Выбор размера страницы -->
                <div class="flex items-center space-x-2 text-content-muted">
                    <span class="hidden sm:inline">На странице:</span>
                    <select
                        x-model="pageSize"
                        @change="setPageSize($event.target.value)"
                        class="bg-surface-elevated text-content-primary text-xs rounded-lg px-2 py-1 border border-surface-border focus:border-brand outline-none transition cursor-pointer">
                        <option value="25">25</option>
                        <option value="50">50</option>
                        <option value="100">100</option>
                        <option value="200">200</option>
                        <option value="0">Все</option>
                    </select>
                </div>
            </div>
        </section>
{{ end }}
