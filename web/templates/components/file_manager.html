{{ define "file_manager" }}
<!-- ==================== ВКЛАДКА 2: МЕДИАТЕКА И РАБОЧАЯ СТАНЦИЯ PUDDLETAG ==================== -->
<section x-show="$store.app.activeTab === 'files'" x-data="fileManagerComponent()" x-init="loadDirectory('')" class="space-y-3 animate-fade-in flex flex-col h-full">
    <!-- Верхний командный тулбар управления и конвертеров -->
    {{ template "puddletag_toolbar" . }}

    <!-- Быстрая полоса подкаталогов текущей папки -->
    <template x-if="directories && directories.length > 0">
        <div class="flex items-center space-x-2 overflow-x-auto py-1 px-0.5 text-xs">
            <span class="text-content-muted font-mono text-[11px] shrink-0">Подпапки:</span>
            <template x-for="dir in directories" :key="dir.path">
                <div class="inline-flex items-center bg-surface-elevated hover:bg-surface-hover rounded-lg border border-surface-border transition shrink-0 shadow-sm overflow-hidden group">
                    <button
                        type="button"
                        @click="navigateTo(dir.path)"
                        class="px-2.5 py-1 text-content-secondary hover:text-brand flex items-center space-x-1.5 transition active:scale-95">
                        <svg class="w-3.5 h-3.5 text-amber-400" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/>
                        </svg>
                        <span x-text="dir.name" class="font-medium"></span>
                        <template x-if="dir.track_count !== undefined">
                            <span class="text-[10px] font-mono text-content-muted" x-text="`(${dir.track_count})`"></span>
                        </template>
                    </button>
                    <button
                        type="button"
                        @click.stop="promptDeleteDirectory(dir)"
                        title="Удалить папку"
                        class="px-1.5 py-1 text-content-muted hover:text-red-400 hover:bg-red-500/10 transition border-l border-surface-border">
                        <svg class="w-3 h-3" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M7 21q-.825 0-1.412-.587T5 19V6q-.425 0-.712-.288T4 5t.288-.712T5 4h4q0-.425.288-.712T10 3h4q.425 0 .713.288T15 4h4q.425 0 .713.288T20 5t-.288.713T19 6v13q0 .825-.587 1.413T17 21zm3.713-4.288Q11 16.426 11 16V9q0-.425-.288-.712T10 8t-.712.288T9 9v7q0 .425.288.713T10 17t.713-.288m4 0Q15 16.426 15 16V9q0-.425-.288-.712T14 8t-.712.288T13 9v7q0 .425.288.713T14 17t.713-.288"/>
                        </svg>
                    </button>
                </div>
            </template>
        </div>
    </template>

    <!-- Основная рабочая область: Боковая Tag Panel + Центральный Data Grid -->
    <div class="flex flex-col lg:flex-row gap-3 items-stretch min-w-0">
        {{ template "puddletag_tag_panel" . }}
        {{ template "puddletag_grid" . }}
    </div>

    <!-- Модальные окна предпросмотра Diff, быстрых действий и баз тегов -->
    {{ template "puddletag_diff_modal" . }}
    {{ template "puddletag_actions_modals" . }}
    {{ template "puddletag_source_modal" . }}
</section>
{{ end }}
