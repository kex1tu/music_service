{{ define "audit_metrics" }}
<!-- Сводка метрик коллекции (8 карточек) -->
<div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 xl:grid-cols-4 2xl:grid-cols-8 gap-4">
    <!-- Карточка 1: Всего треков -->
    <div class="bg-gray-900 border border-gray-800 rounded-xl p-5">
        <div class="flex items-center justify-between">
            <span class="text-xs font-semibold text-gray-400 uppercase tracking-wider">Всего треков</span>
            <span class="w-8 h-8 rounded-lg bg-emerald-500/10 text-emerald-400 flex items-center justify-center">
                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z"/>
                </svg>
            </span>
        </div>
        <div class="mt-4 flex items-baseline space-x-2">
            <span class="text-2xl font-bold text-white font-mono" x-text="summary.total_tracks"></span>
            <span class="text-xs text-gray-500" x-text="`в ${summary.total_albums} релизах`"></span>
        </div>
    </div>

    <!-- Карточка 2: Без текстов -->
    <div
        @click="activeSubTab = 'lyrics'"
        class="bg-gray-900 border border-gray-800 rounded-xl p-5 cursor-pointer hover:border-purple-500/50 transition"
        :class="{'ring-1 ring-purple-500/50': activeSubTab === 'lyrics'}">
        <div class="flex items-center justify-between">
            <span class="text-xs font-semibold text-purple-400 uppercase tracking-wider">Без текстов (.lrc)</span>
            <span class="w-8 h-8 rounded-lg bg-purple-500/10 text-purple-400 flex items-center justify-center">
                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-2 10H7v-2h10v2zm0-4H7V7h10v2z"/>
                </svg>
            </span>
        </div>
        <div class="mt-4 flex items-baseline space-x-2">
            <span class="text-2xl font-bold text-purple-300 font-mono" x-text="summary.missing_lyrics_count"></span>
            <span class="text-xs text-gray-500">треков</span>
        </div>
    </div>

    <!-- Карточка 3: Без обложек -->
    <div
        @click="activeSubTab = 'covers'"
        class="bg-gray-900 border border-gray-800 rounded-xl p-5 cursor-pointer hover:border-yellow-500/50 transition"
        :class="{'ring-1 ring-yellow-500/50': activeSubTab === 'covers'}">
        <div class="flex items-center justify-between">
            <span class="text-xs font-semibold text-yellow-400 uppercase tracking-wider">Без обложек</span>
            <span class="w-8 h-8 rounded-lg bg-yellow-500/10 text-yellow-400 flex items-center justify-center">
                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/>
                </svg>
            </span>
        </div>
        <div class="mt-4 flex items-baseline space-x-2">
            <span class="text-2xl font-bold text-yellow-300 font-mono" x-text="summary.missing_covers_count"></span>
            <span class="text-xs text-gray-500">релизов</span>
        </div>
    </div>

    <!-- Карточка 4: Дубликаты -->
    <div
        @click="activeSubTab = 'duplicates'"
        class="bg-gray-900 border border-gray-800 rounded-xl p-5 cursor-pointer hover:border-red-500/50 transition"
        :class="{'ring-1 ring-red-500/50': activeSubTab === 'duplicates'}">
        <div class="flex items-center justify-between">
            <span class="text-xs font-semibold text-red-400 uppercase tracking-wider">Дубликаты треков</span>
            <span class="w-8 h-8 rounded-lg bg-red-500/10 text-red-400 flex items-center justify-center">
                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/>
                </svg>
            </span>
        </div>
        <div class="mt-4 flex items-baseline space-x-2">
            <span class="text-2xl font-bold text-red-300 font-mono" x-text="duplicatesData.total_duplicate_files || summary.duplicates_count || 0"></span>
            <span class="text-xs text-gray-500" x-text="`в ${(duplicatesData.groups ? duplicatesData.groups.length : 0)} группах`"></span>
        </div>
    </div>

    <!-- Карточка 5: Неполные релизы -->
    <div
        @click="activeSubTab = 'incomplete'"
        class="bg-gray-900 border border-gray-800 rounded-xl p-5 cursor-pointer hover:border-sky-500/50 transition"
        :class="{'ring-1 ring-sky-500/50': activeSubTab === 'incomplete'}">
        <div class="flex items-center justify-between">
            <span class="text-xs font-semibold text-sky-400 uppercase tracking-wider">Неполные релизы</span>
            <span class="w-8 h-8 rounded-lg bg-sky-500/10 text-sky-400 flex items-center justify-center">
                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 14.5c-2.49 0-4.5-2.01-4.5-4.5S9.51 7.5 12 7.5s4.5 2.01 4.5 4.5-2.01 4.5-4.5 4.5zm0-5.5c-.55 0-1 .45-1 1s.45 1 1 1 1-.45 1-1-.45-1-1-1z"/>
                </svg>
            </span>
        </div>
        <div class="mt-4 flex items-baseline space-x-2">
            <span class="text-2xl font-bold text-sky-300 font-mono" x-text="(incompleteAlbums ? incompleteAlbums.length : (summary.incomplete_albums_count ?? 0)) ?? 0"></span>
            <span class="text-xs text-gray-500">альбомов</span>
        </div>
    </div>

    <!-- Карточка 6: Некорректные пути -->
    <div
        @click="activeSubTab = 'paths'"
        class="bg-gray-900 border border-gray-800 rounded-xl p-5 cursor-pointer hover:border-amber-500/50 transition"
        :class="{'ring-1 ring-amber-500/50': activeSubTab === 'paths'}">
        <div class="flex items-center justify-between">
            <span class="text-xs font-semibold text-amber-400 uppercase tracking-wider">Не по шаблону</span>
            <span class="w-8 h-8 rounded-lg bg-amber-500/10 text-amber-400 flex items-center justify-center">
                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M10 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2h-8l-2-2z"/>
                </svg>
            </span>
        </div>
        <div class="mt-4 flex items-baseline space-x-2">
            <span class="text-2xl font-bold text-amber-300 font-mono" x-text="(invalidPaths ? invalidPaths.length : (summary.invalid_paths_count ?? 0)) ?? 0"></span>
            <span class="text-xs text-gray-500">путей</span>
        </div>
    </div>

    <!-- Карточка 7: Жанры (не-EN) -->
    <div
        @click="activeSubTab = 'genres'"
        class="bg-gray-900 border border-gray-800 rounded-xl p-5 cursor-pointer hover:border-rose-500/50 transition"
        :class="{'ring-1 ring-rose-500/50': activeSubTab === 'genres'}">
        <div class="flex items-center justify-between">
            <span class="text-xs font-semibold text-rose-400 uppercase tracking-wider">Жанры (не-EN)</span>
            <span class="w-8 h-8 rounded-lg bg-rose-500/10 text-rose-400 flex items-center justify-center">
                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor">
                    <path d="m21.4 14.25l-7.15 7.15q-.3.3-.675.45t-.75.15t-.75-.15t-.675-.45l-8.825-8.825q-.275-.275-.425-.637T2 11.175V4q0-.825.588-1.412T4 2h7.175q.4 0 .775.163t.65.437l8.8 8.825q.3.3.438.675t.137.75t-.137.738t-.438.662M6.5 8q.625 0 1.063-.437T8 6.5t-.437-1.062T6.5 5t-1.062.438T5 6.5t.438 1.063T6.5 8"/>
                </svg>
            </span>
        </div>
        <div class="mt-4 flex items-baseline space-x-2">
            <span class="text-2xl font-bold text-rose-300 font-mono" x-text="(nonEnGenres ? nonEnGenres.length : (summary.non_en_genres_count ?? 0)) ?? 0"></span>
            <span class="text-xs text-gray-500">тегов</span>
        </div>
    </div>

    <!-- Карточка 8: Сверка тегов -->
    <div
        @click="activeSubTab = 'tags'"
        class="bg-gray-900 border border-gray-800 rounded-xl p-5 cursor-pointer hover:border-emerald-500/50 transition"
        :class="{'ring-1 ring-emerald-500/50': activeSubTab === 'tags'}">
        <div class="flex items-center justify-between">
            <span class="text-xs font-semibold text-emerald-400 uppercase tracking-wider">Сверка тегов</span>
            <span class="w-8 h-8 rounded-lg bg-emerald-500/10 text-emerald-400 flex items-center justify-center">
                <svg class="w-4 h-4" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
                </svg>
            </span>
        </div>
        <div class="mt-4 flex items-baseline space-x-2">
            <span class="text-2xl font-bold text-emerald-300 font-mono" x-text="(tagIssues ? tagIssues.length : (summary.tag_issues_count ?? 0)) ?? 0"></span>
            <span class="text-xs text-gray-500">дефектов</span>
        </div>
    </div>
</div>
{{ end }}
