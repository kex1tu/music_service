{{ define "downloader_active" }}
<!-- Статус активной задачи загрузки -->
<template x-if="job">
    <div class="mt-6 pt-6 border-t border-surface-border space-y-3">
        <div class="flex items-center justify-between gap-4">
            <div class="flex items-center space-x-3 min-w-0">
                <span class="text-xs font-semibold px-2.5 py-1 rounded uppercase tracking-wider flex-shrink-0"
                    :class="{
                        'bg-yellow-500/20 text-yellow-400 border border-yellow-500/30': job.status === 'QUEUED' || job.status === 'RESOLVING',
                        'bg-blue-500/20 text-blue-400 border border-blue-500/30': job.status === 'DOWNLOADING',
                        'bg-purple-500/20 text-purple-400 border border-purple-500/30': job.status === 'CONVERTING',
                        'bg-indigo-500/20 text-indigo-400 border border-indigo-500/30': job.status === 'TAGGING',
                        'bg-brand-muted text-brand border border-brand/30': job.status === 'READY',
                        'bg-red-500/20 text-red-400 border border-red-500/30': job.status === 'ERROR',
                    }"
                    x-text="job.status">
                </span>
                <span class="text-sm text-content-primary font-medium min-w-0 truncate" x-text="job.current_step" :title="job.current_step"></span>
            </div>
            <div class="flex items-center space-x-2 flex-shrink-0">
                <template x-if="job.total_tracks > 1">
                    <span class="text-xs text-content-muted font-mono" x-text="`(${job.completed_tracks}/${job.total_tracks})`"></span>
                </template>
                <span class="text-xs text-brand font-semibold font-mono" x-text="`${Math.min(100, Math.max(0, Math.round(job.progress || 0)))}%`"></span>
            </div>
        </div>

        <!-- Прогресс-бар -->
        <div class="w-full bg-surface-input rounded-full h-2 overflow-hidden border border-surface-border">
            <div
                class="bg-gradient-to-r from-brand to-amber-400 h-2 rounded-full transition-all duration-300 shadow-sm shadow-brand/40"
                :style="`width: ${Math.min(100, Math.max(0, Math.round(job.progress || 0)))}%`"></div>
        </div>

        <!-- Сообщение об ошибке при ERROR -->
        <template x-if="job.status === 'ERROR'">
            <div class="p-3 bg-red-900/20 border border-red-700/40 rounded-xl text-xs text-red-300">
                <strong class="font-bold">Ошибка:</strong> <span x-text="job.error"></span>
            </div>
        </template>

        <!-- Список треков активной задачи и выбор альтернативных версий -->
        <template x-if="job.tracks && job.tracks.length > 0">
            <div class="mt-4 pt-3 border-t border-surface-border space-y-2.5">
                <div class="flex items-center justify-between text-xs font-semibold text-content-secondary px-1">
                    <div class="flex items-center space-x-2">
                        <svg class="w-4 h-4 text-brand" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55c-2.21 0-4 1.79-4 4s1.79 4 4 4s4-1.79 4-4V7h4V3z"/>
                        </svg>
                        <span>Треки релиза (<span x-text="job.tracks.length"></span>)</span>
                    </div>
                    <span class="text-[11px] text-content-muted">Нажмите «Версии», чтобы выбрать другой источник аудио</span>
                </div>

                <div class="space-y-1.5 max-h-80 overflow-y-auto pr-1">
                    <template x-for="(track, tIdx) in job.tracks" :key="track.track_id || tIdx">
                        <div class="p-2.5 rounded-xl bg-surface-base border border-surface-border transition shadow-sm space-y-2"
                            :class="{ 'border-brand/40 ring-1 ring-brand/20': isVersionsOpen(track.track_id) }">
                            <div class="flex flex-wrap sm:flex-nowrap items-center justify-between gap-2">
                                <div class="flex items-center space-x-2.5 min-w-0 flex-1">
                                    <span class="w-5 text-center text-xs font-mono font-bold text-content-muted shrink-0" x-text="track.track_number || (tIdx + 1)"></span>
                                    <div class="min-w-0 flex-1">
                                        <div class="text-xs font-semibold text-content-primary truncate" x-text="track.title"></div>
                                        <div class="text-[11px] text-content-muted truncate" x-text="track.artist"></div>
                                    </div>
                                </div>
                                <div class="flex items-center space-x-2 shrink-0">
                                    <span class="text-[11px] font-mono text-content-muted" x-text="window.AppFormatters ? window.AppFormatters.formatDuration(track.duration) : track.duration + 'с'"></span>

                                    <!-- Бейдж оригинальности -->
                                    <template x-if="track.version_status">
                                        <span
                                            class="inline-flex items-center space-x-1 px-2 py-0.5 rounded-full text-[10px] font-semibold border shrink-0 transition"
                                            :class="getVersionBadge(track.version_status).badgeClass"
                                            :title="getVersionBadge(track.version_status).tooltip">
                                            <span class="w-1.5 h-1.5 rounded-full shrink-0" :class="getVersionBadge(track.version_status).dotClass"></span>
                                            <span x-text="getVersionBadge(track.version_status).label"></span>
                                        </span>
                                    </template>

                                    <!-- Кнопка выпадающего списка версий -->
                                    <template x-if="track.candidates && track.candidates.length > 1">
                                        <button
                                            type="button"
                                            @click.stop="toggleVersions(track.track_id)"
                                            class="px-2 py-1 rounded-lg text-[11px] font-semibold transition flex items-center space-x-1 border shadow-xs"
                                            :class="isVersionsOpen(track.track_id) ? 'bg-brand/15 text-brand border-brand/40' : 'bg-surface-elevated hover:bg-surface-hover text-content-secondary hover:text-white border-surface-border'"
                                            title="Выбрать альтернативную версию аудио">
                                            <span>Версии (<span x-text="track.candidates.length"></span>)</span>
                                            <svg class="w-3 h-3 transition-transform duration-200" :class="{ 'rotate-180': isVersionsOpen(track.track_id) }" viewBox="0 0 24 24" fill="currentColor">
                                                <path d="M12 15.375L6 9.375l1.4-1.4l4.6 4.6l4.6-4.6l1.4 1.4z"/>
                                            </svg>
                                        </button>
                                    </template>
                                </div>
                            </div>

                            <!-- Контрольные точки отслушивания цензуры (Quick-Listen Spots) -->
                            <template x-if="track.quick_listen_spots && track.quick_listen_spots.length > 0">
                                <div class="flex flex-wrap items-center gap-1.5 mt-2 pt-1.5 border-t border-surface-border/40">
                                    <span class="text-[10px] text-content-muted font-medium flex items-center gap-1 shrink-0">
                                        <svg class="w-3 h-3 text-amber-400" viewBox="0 0 24 24" fill="currentColor">
                                            <path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
                                        </svg>
                                        Проверить:
                                    </span>
                                    <template x-for="spot in track.quick_listen_spots" :key="spot.time_sec">
                                        <button type="button"
                                                @click.stop="$store.player.playCensorshipSpot('/api/stream?path=' + encodeURIComponent(track.converted_path || ''), spot, track.title, track.artist)"
                                                :title="`Строка: '${spot.line_text}'`"
                                                :class="spot.category === 'DRUG_COAP_6_13' ? 'bg-rose-500/15 hover:bg-rose-500/30 text-rose-300 border-rose-500/30' : (spot.category === 'SUSPECT_MARKER' ? 'bg-amber-500/15 hover:bg-amber-500/30 text-amber-300 border-amber-500/30' : 'bg-purple-500/15 hover:bg-purple-500/30 text-purple-300 border-purple-500/30')"
                                                class="px-2 py-0.5 rounded text-[10px] font-mono border transition-colors flex items-center gap-1 shadow-xs">
                                            <span class="text-[8px]">▶</span>
                                            <span x-text="spot.time_str"></span>
                                            <span class="font-bold font-sans" x-text="`«${spot.word}»`"></span>
                                            <template x-if="spot.category === 'DRUG_COAP_6_13'">
                                                <span class="text-[9px] px-1 rounded bg-rose-500/30 text-rose-200">КоАП</span>
                                            </template>
                                        </button>
                                    </template>
                                </div>
                            </template>

                            <!-- Раскрывающийся список кандидатов версий -->
                            <template x-if="isVersionsOpen(track.track_id)">
                                <div class="p-2.5 rounded-lg bg-surface-panel border border-surface-borderSubtle space-y-1.5 mt-2 animate-fade-in">
                                    <div class="flex items-center justify-between text-[11px] text-content-muted border-b border-surface-borderSubtle pb-1 px-1">
                                        <span class="font-medium">Найденные варианты на SoundCloud:</span>
                                        <span class="text-[10px]">Кликните «Выбрать» для замены файла</span>
                                    </div>
                                    <div class="space-y-1 max-h-56 overflow-y-auto pr-0.5">
                                        <template x-for="(cand, cIdx) in track.candidates" :key="cand.url || cIdx">
                                            <div
                                                class="p-2 rounded-lg border transition flex flex-wrap sm:flex-nowrap items-center justify-between gap-2"
                                                :class="cand.url === track.audio_source_url ? 'bg-brand/10 border-brand/40 shadow-xs' : 'bg-surface-elevated/80 border-surface-border hover:border-surface-borderHover'">
                                                <div class="min-w-0 flex-1 space-y-0.5">
                                                    <div class="flex items-center space-x-2">
                                                        <template x-if="cand.url === track.audio_source_url">
                                                            <span class="text-[9px] font-bold px-1.5 py-0.5 rounded bg-brand/20 text-brand border border-brand/30 uppercase tracking-wider shrink-0">
                                                                Текущая
                                                            </span>
                                                        </template>
                                                        <span class="text-xs font-semibold text-content-primary truncate" x-text="cand.title" :title="cand.title"></span>
                                                    </div>
                                                    <div class="flex flex-wrap items-center gap-x-2.5 gap-y-0.5 text-[11px] text-content-muted">
                                                        <template x-if="cand.uploader">
                                                            <span class="truncate max-w-[180px]" x-text="`Автор: ${cand.uploader}`"></span>
                                                        </template>
                                                        <span class="font-mono" x-text="`Длит: ${window.AppFormatters ? window.AppFormatters.formatDuration(cand.duration) : cand.duration + 'с'}`"></span>
                                                        <span
                                                            class="font-mono font-medium"
                                                            :class="{
                                                                'text-emerald-400': Math.abs(cand.delta_seconds) <= 2,
                                                                'text-amber-400': Math.abs(cand.delta_seconds) > 2 && Math.abs(cand.delta_seconds) <= 5,
                                                                'text-content-muted': Math.abs(cand.delta_seconds) > 5
                                                            }"
                                                            x-text="`Дельта: ${formatDelta(cand.delta_seconds)}`">
                                                        </span>
                                                        <template x-if="cand.upload_date">
                                                            <span class="font-mono text-[10px]" x-text="`Дата: ${formatUploadDate(cand.upload_date)}`"></span>
                                                        </template>
                                                    </div>
                                                </div>
                                                <div class="shrink-0 flex items-center space-x-2">
                                                    <template x-if="cand.url === track.audio_source_url">
                                                        <span class="text-xs text-brand font-semibold flex items-center space-x-1 px-2 py-1">
                                                            <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor">
                                                                <path d="m9.55 18l-5.7-5.7l1.425-1.425L9.55 15.15l9.175-9.175L20.15 7.4z"/>
                                                            </svg>
                                                            <span>Выбрана</span>
                                                        </span>
                                                    </template>
                                                    <template x-if="cand.url !== track.audio_source_url">
                                                        <button
                                                            type="button"
                                                            @click="switchTrackVersion(track, cand.url)"
                                                            :disabled="switchingTrackId === track.track_id"
                                                            class="px-2.5 py-1 bg-surface-elevated hover:bg-brand text-content-secondary hover:text-white rounded-md text-xs font-semibold border border-surface-border hover:border-brand transition shadow-xs flex items-center space-x-1 disabled:opacity-50"
                                                            title="Переключить трек на эту версию аудио">
                                                            <template x-if="switchingTrackId === track.track_id">
                                                                <svg class="w-3 h-3 animate-spin" viewBox="0 0 24 24" fill="currentColor">
                                                                    <path d="M8.125 21.213q-1.825-.788-3.187-2.15t-2.15-3.188T2 11.988t.788-3.875t2.15-3.175t3.187-2.15T12 2q.425 0 .713.288T13 3t-.288.713T12 4Q8.675 4 6.337 6.338T4 12t2.338 5.663T12 20t5.663-2.337T20 12q0-.425.288-.712T21 11t.713.288T22 12q0 2.05-.788 3.875t-2.15 3.188t-3.175 2.15t-3.875.787t-3.887-.787"/>
                                                                </svg>
                                                            </template>
                                                            <span>Выбрать</span>
                                                        </button>
                                                    </template>
                                                </div>
                                            </div>
                                        </template>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </template>
                </div>
            </div>
        </template>

        <!-- Кнопки действий задачи -->
        <div class="flex items-center justify-end space-x-3 pt-2">
            <template x-if="job.status === 'READY'">
                <div class="flex flex-wrap items-center gap-2">
                    <button
                        type="button"
                        @click="acceptJobDirectly(job.id)"
                        class="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold rounded-lg transition shadow-md shadow-emerald-600/20 flex items-center space-x-1.5"
                        title="Переместить релиз в медиатеку в один клик">
                        <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor">
                            <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
                        </svg>
                        <span>Принять в медиатеку</span>
                    </button>
                    <template x-if="$store.app.queue.readyCount > 1">
                        <button
                            type="button"
                            @click="$store.app.queue.openAllReadyJobsInTagEditor()"
                            class="px-3.5 py-2 bg-gradient-to-r from-brand to-amber-600 hover:from-brand-hover hover:to-amber-500 text-white text-xs font-bold rounded-lg transition shadow-md shadow-brand/20 flex items-center space-x-1.5 animate-pulse"
                            title="Открыть все завершенные релизы из очереди в редакторе тегов">
                            <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor">
                                <path d="M4 18q-.825 0-1.412-.587T2 16V4q0-.825.588-1.412T4 2h12q.825 0 1.413.588T18 4v12q0 .825-.587 1.413T16 18zm16 4q-.825 0-1.412-.587T18 20V7q0-.425.288-.712T19 6t.713.288T20 7v13h-13q-.425 0-.712-.288T6 19t.288-.712T7 18h13z"/>
                            </svg>
                            <span>Редактировать всё из очереди (<span x-text="$store.app.queue.readyCount"></span>)</span>
                        </button>
                    </template>
                    <button
                        type="button"
                        @click="openTagEditorForJob(job.id)"
                        class="px-4 py-2 bg-surface-elevated hover:bg-surface-hover border border-surface-border text-content-primary hover:text-white text-xs font-semibold rounded-lg transition shadow-md flex items-center space-x-1.5">
                        <svg class="w-3.5 h-3.5 text-brand" viewBox="0 0 24 24" fill="currentColor">
                            <path d="m21.4 14.25l-7.15 7.15q-.3.3-.675.45t-.75.15t-.75-.15t-.675-.45l-8.825-8.825q-.275-.275-.425-.637T2 11.175V4q0-.825.588-1.412T4 2h7.175q.4 0 .775.163t.65.437l8.8 8.825q.3.3.438.675t.137.75t-.137.738t-.438.662M6.5 8q.625 0 1.063-.437T8 6.5t-.437-1.062T6.5 5t-1.062.438T5 6.5t.438 1.063T6.5 8"/>
                        </svg>
                        <span x-text="$store.app.queue.readyCount > 1 ? 'Открыть этот релиз' : 'Редактировать теги'"></span>
                    </button>
                </div>
            </template>
            <template x-if="job.status !== 'READY' && job.status !== 'ERROR'">
                <button
                    @click="cancelJob()"
                    class="px-3 py-1.5 bg-red-900/60 hover:bg-red-800 text-red-200 text-xs rounded-lg border border-red-700/50 transition flex items-center space-x-1.5">
                    <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor">
                        <path d="m12 13.4l2.9 2.9q.275.275.7.275t.7-.275t.275-.7t-.275-.7L13.4 12l2.9-2.9q.275-.275.275-.7t-.275-.7t-.7-.275t-.7.275L12 10.6L9.1 7.7q-.275-.275-.7-.275t-.7.275t-.275.7t.275.7l2.9 2.9l-2.9 2.9q-.275.275-.275.7t.275.7t.7.275t.7-.275zm0 8.6q-2.075 0-3.9-.788t-3.175-2.137T2.788 15.9T2 12t.788-3.9t2.137-3.175T8.1 2.788T12 2t3.9.788t3.175 2.137T21.213 8.1T22 12t-.788 3.9t-2.137 3.175t-3.175 2.138T12 22"/>
                    </svg>
                    <span>Отменить</span>
                </button>
            </template>
            <template x-if="job.status === 'ERROR'">
                <button
                    @click="retryJob(job.id)"
                    class="px-3 py-1.5 bg-amber-600 hover:bg-amber-500 text-white text-xs rounded-lg transition flex items-center space-x-1.5 font-medium shadow"
                    title="Перезапустить загрузку">
                    <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 20q-3.35 0-5.675-2.325T4 12t2.325-5.675T12 4q1.725 0 3.3.712T18 6.75V4h2v6h-6V8h3.05q-1.125-1.45-2.787-2.225T12 5q-2.9 0-4.95 2.05T5 12t2.05 4.95T12 19q2.425 0 4.3-1.463T18.65 14h2.075q-.45 3.025-2.688 5.013T12 20"/>
                    </svg>
                    <span>Повторить</span>
                </button>
            </template>
            <button
                @click="resetForm()"
                class="px-3 py-1.5 bg-surface-elevated hover:bg-surface-hover text-content-secondary hover:text-white border border-surface-border text-xs rounded-lg transition flex items-center space-x-1.5">
                <svg class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="currentColor">
                    <path d="M9.825 20.7q-2.575-.725-4.2-2.837T4 13q0-1.425.475-2.713t1.35-2.362q.275-.3.675-.313t.725.313q.275.275.288.675t-.263.75q-.6.775-.925 1.7T6 13q0 2.025 1.188 3.613t3.062 2.162q.325.1.538.375t.212.6q0 .5-.35.788t-.825.162m4.35 0q-.475.125-.825-.175t-.35-.8q0-.3.213-.575t.537-.375q1.875-.6 3.063-2.175T18 13q0-2.5-1.75-4.25T12 7h-.075l.4.4q.275.275.275.7t-.275.7t-.7.275t-.7-.275l-2.1-2.1q-.15-.15-.212-.325T8.55 6t.063-.375t.212-.325l2.1-2.1q.275-.275.7-.275t.7.275t.275.7t-.275.7l-.4.4H12q3.35 0 5.675 2.325T20 13q0 2.725-1.625 4.85t-4.2 2.85"/>
                </svg>
                <span>Сбросить</span>
            </button>
        </div>
    </div>
</template>
{{ end }}
