name: CI/CD Auto-Deploy

on:
  push:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      target:
        description: 'Deployment target'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - nl_music
          - server2

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  test:
    name: Run Tests & Linters
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 'stable'
          check-latest: true
          cache: true
          cache-dependency-path: go.sum

      - name: Install FFmpeg and FFprobe
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffprobe -version

      - name: Run unit tests
        env:
          GOTOOLCHAIN: auto
        run: |
          go test -v ./...

  build:
    name: Build Static Binary
    needs: test
    runs-on: ubuntu-latest
    outputs:
      binary_sha256: ${{ steps.compile.outputs.binary_sha256 }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: 'stable'
          check-latest: true
          cache: true
          cache-dependency-path: go.sum

      - name: Compile pure Go binary (CGO_ENABLED=0)
        id: compile
        env:
          GOTOOLCHAIN: auto
        run: |
          mkdir -p bin
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags="-s -w" -o bin/music-manager cmd/server/main.go
          chmod +x bin/music-manager
          ls -lh bin/music-manager
          printf 'binary_sha256=%s\n' "$(sha256sum bin/music-manager | cut -d ' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Upload Binary Artifact
        uses: actions/upload-artifact@v6
        with:
          name: music-manager-bin
          path: bin/music-manager
          retention-days: 1

  deploy:
    name: Deploy via scripts/deploy.sh
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Download Binary Artifact
        uses: actions/download-artifact@v7
        with:
          name: music-manager-bin
          path: bin

      - name: Configure SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          umask 077
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/music_deploy_key

      - name: Deploy and verify
        env:
          DEPLOY_TARGET: ${{ inputs.target || 'all' }}
          BINARY_SHA256: ${{ needs.build.outputs.binary_sha256 }}
        run: bash scripts/deploy.sh "$DEPLOY_TARGET" --prebuilt "$BINARY_SHA256"
